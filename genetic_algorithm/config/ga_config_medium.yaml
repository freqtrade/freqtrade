# ============================================================================
# GA Configuration: MEDIUM (Balanced Search)
# ============================================================================
# 
# PURPOSE:
#   Balanced configuration for observing evolution dynamics with regime detection.
#   Good for understanding how fitness evolves across different market conditions.
#
# USE CASES:
#   - Testing regime detection effectiveness
#   - Comparing strategies across market conditions
#   - Intermediate development runs
#   - Validating configuration changes before deep search
#
# EXPECTED RUNTIME: 15-30 minutes
# EXPECTED RESULTS: Decent strategies, clear evolution trends
#
# RUN COMMAND:
#   python genetic_algorithm/run_ga.py --config genetic_algorithm/config/ga_config_medium.yaml --visualize
#
# VISUALIZATION:
#   During run: Live plots show evolution progress
#   After run: python genetic_algorithm/scripts/visualize_evolution.py --config medium
#
# ============================================================================

# === Genetic Algorithm Parameters ===
# Moderate settings - balance between quality and speed
genetic_algorithm:
  # Reproducible results
  random_seed: 42
  
  # MODERATE population - diverse enough for good exploration
  # 40 individuals provides good genetic diversity
  population_size: 40
  
  # MODERATE generations - enough to see convergence patterns
  # 15 generations typically shows clear evolution trends
  generations: 12
  
  # Standard mutation rate
  # 0.15 is the classic GA mutation rate
  mutation_rate: 0.2
  
  # Standard crossover rate
  crossover_rate: 0.70
  
  # Elite size - ~15% of population preserved
  # 6 elites ensures top performers survive
  elite_size: 6
  
  # Tournament size - moderate selection pressure
  # 4 balances exploration vs exploitation well
  tournament_size: 4
  
  # Tournament selection - most reliable method
  selection_method: 'tournament'
  
  # Convergence patience - stop if stuck
  # 6 generations gives evolution time to recover
  convergence_patience: 6
  
  # Adaptive mutation - increase when stuck
  adaptive_mutation: true
  max_adaptation_factor: 2.0   # Up to 2x base rate
  adaptation_step: 0.10         # Gradual increase
  
  # Diversity mechanisms - all enabled
  fitness_sharing: true         # Penalize similar strategies
  sharing_radius: 0.30          # Standard similarity threshold
  diversity_threshold: 0.15     # Maintain 15% diversity
  allow_self_crossover: false   # Force different parents
  
  # Random immigrants - fresh genetic material
  # 4 per generation (10%) prevents stagnation
  random_immigrants: 14
  
  # Single objective mode
  mode: 'single_objective'

# === Fitness Function ===
# Standard balanced weights
fitness_weights:
  profit: 0.28            # Make money (slightly lower to balance risk metrics)
  sharpe_ratio: 0.14      # Risk-adjusted returns
  sortino_ratio: 0.12     # Downside risk focus
  profit_factor: 0.12     # Win/loss ratio
  drawdown: 0.14          # Drawdown penalty
  win_rate: 0.10          # Win percentage
  trade_frequency: 0.10   # Trade count penalty

fitness_penalties:
  min_trades: 8            # Require meaningful number of trades
  max_drawdown: 0.30       # Moderate drawdown limit
  min_win_rate: 0.30       # Require 30% win rate
  complexity_weight: 0.01  # Slight penalty for complexity

# === Backtesting Configuration ===
# Moderate data range for balanced testing
backtesting:
  # 6 MONTHS of data - good balance of regime variety
  timerange: "20250528-20260216"
  
  # Standard stake
  stake_amount: 100
  
  # TWO pairs - BTC for primary, ETH for validation
  # Multiple pairs test strategy generalization
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
  
  # Moderate concurrent trades
  max_open_trades: 4
  
  # Standard fee
  fee: 0.002
  
  # Exchange
  exchange: "binance"
  
  # Auto-download
  auto_download_data: true
  
  # Enable caching
  enable_cache: true
  
  # Longer timeout for multiple pairs
  timeout: 180

# === Walk-Forward Optimization ===
# ENABLED - validates out-of-sample performance
walk_forward:
  # Enable walk-forward validation
  enabled: false
  
  # Training window - 45 days of training data
  # Enough trades to evaluate strategies
  train_days: 45
  
  # Validation window - 15 days out-of-sample
  validation_days: 15
  
  # Step forward - 15 days per window
  # Results in ~3-4 walk-forward windows
  step_days: 15
  
  # Rolling window mode - fixed window slides forward
  mode: 'rolling'
  
  # Harmonic mean - penalizes inconsistency across windows
  aggregation: 'harmonic_mean'
  
  # Minimum trades required per window
  min_train_trades: 5

# === REGIME-AWARE EVALUATION ===
# ENABLED with balanced settings
regime_aware:
  # Enable regime detection
  enabled: true
  
  # USE NEW BEST METHOD
  # adx_di_hysteresis provides best accuracy with low flip rate
  method: 'adx_di_hysteresis'
  
  # Benchmark pair
  benchmark_pair: null  # Uses first pair
  
  # Detection timeframe - 4h for clean regime signals
  detection_timeframe: '1D'
  
  # Segment configuration - balanced for 6 months of data
  period_days: 30        # 30-day periods capture regime changes
  min_period_days: 20    # Accept 20+ day segments
  embargo_days: 3        # 3-day gap prevents leakage
  
  # Multiple segments per regime
  segments_per_regime: 2  # 2 segments each = 6 total
  
  # Holdout ratio - 20% reserved for final validation
  holdout_ratio: 0.20
  
  # Aggregation methods
  aggregation: 'harmonic_mean'  # Penalizes inconsistency
  cvar_alpha: 0.20
  
  # Equal regime weights - balanced evaluation
  regime_weights:
    bullish: 1.0
    bearish: 1.0
    sideways: 1.0

# === Strategy Constraints ===
strategy_constraints:
  min_trades: 8           # Require meaningful sample
  max_drawdown: 0.30      # Moderate risk limit
  min_win_rate: 0.30      # 30% minimum win rate
  # NOTE: Only use timeframes with data covering 2024-2026
  # 15m data is outdated (2023 only) - excluded until updated
  timeframes: ["5m", "1h", "4h"]
  stoploss_range: [-0.20, -0.04]
  roi_range: [0.01, 0.15]
  max_open_trades_range: [1, 6]

# === Multi-Timeframe ===
# MODERATE complexity
multi_timeframe:
  enabled: true
  available: ['15m', '1h', '4h']  # 3 informative TFs
  max_timeframes: 2              # Up to 2 informative TFs
  higher_timeframe_preference:
    - 'EMA'
    - 'SMA'
    - 'RSI'
    - 'ADX'
    - 'BBANDS'

# === Indicator Configuration ===
indicators:
  # STANDARD indicator set
  available:
    - "RSI"
    - "MACD"
    - "BBANDS"
    - "EMA"
    - "SMA"
    - "STOCH"
    - "ATR"
    - "ADX"
  
  # Standard count
  max_per_strategy: 4

# === Trade Visualization ===
trade_visualization:
  enabled: true
  output_dir: 'genetic_algorithm/output/medium_run/trade_plots'
  generations_to_plot: [0, 7, 14]  # Start, middle, end
  top_strategies_to_plot: 3

# === Parallel Evaluation ===
# ENABLED - speed up evaluation with multiple workers
parallel_evaluation:
  enabled: true              # Enable parallel backtesting
  max_workers: 8            # 6 workers for medium config (adjust to your CPU)
  chunk_size: 'auto'         # Automatic batch sizing
  worker_log_level: 'WARNING'  # Reduce log noise from workers
  timeout_per_eval: 120      # Timeout per individual evaluation

# === Output Configuration ===
output:
  dir: 'genetic_algorithm/output/medium_run'
  save_stats: true
  stats_file: 'evolution_stats.json'
  save_snapshots: true
  snapshot_interval: 3  # Every 3 generations
