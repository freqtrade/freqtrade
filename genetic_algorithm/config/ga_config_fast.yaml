# ============================================================================
# GA Configuration: FAST (Quick Testing)
# ============================================================================
# 
# PURPOSE:
#   Quick testing and validation of configuration changes, new features,
#   and strategy ideas. Optimized for fast iteration cycles (2-5 minutes).
#
# USE CASES:
#   - Testing if a new configuration works
#   - Quick validation of regime detection setup
#   - Checking if the GA engine runs correctly
#   - Debugging strategy generation issues
#
# EXPECTED RUNTIME: 2-5 minutes
# EXPECTED RESULTS: Not production-ready, but shows evolution trends
#
# RUN COMMAND:
#   python genetic_algorithm/run_ga.py --config genetic_algorithm/config/ga_config_fast.yaml --visualize
#
# VISUALIZATION:
#   After running, execute the auto-visualization script:
#   python genetic_algorithm/scripts/visualize_evolution.py --config fast
#
# ============================================================================

# === Genetic Algorithm Parameters ===
# Minimal settings for speed - we sacrifice quality for fast feedback
genetic_algorithm:
  # Reproducible results for debugging
  random_seed: 42
  
  # SMALL population - each individual needs backtesting, so fewer = faster
  # 15 individuals is enough to show diversity and evolution trends
  population_size: 15
  
  # FEW generations - just enough to see if evolution is working
  # 5 generations shows basic convergence patterns
  generations: 5
  
  # Standard mutation rate - not too high (chaos) or low (stagnation)
  # 0.20 is slightly higher for small populations to maintain diversity
  mutation_rate: 0.20
  
  # Crossover rate - probability two parents combine genes
  # 0.7 is standard for genetic algorithms
  crossover_rate: 0.7
  
  # Elite size - preserve top performers unchanged
  # ~13% of population (2/15) avoids losing good solutions
  elite_size: 2
  
  # Tournament size - selection pressure
  # 3 gives moderate selection pressure (balance exploration/exploitation)
  tournament_size: 3
  
  # Selection method - tournament is most commonly used
  selection_method: 'tournament'
  
  # Early stopping - stop if no improvement
  # 3 generations is short but sufficient for quick test
  convergence_patience: 3
  
  # Adaptive mutation - increases mutation when stuck
  # Enabled to help escape local optima quickly
  adaptive_mutation: true
  max_adaptation_factor: 2.5   # Can go up to 2.5x base rate
  adaptation_step: 0.15         # Fast adaptation for quick runs
  
  # Diversity mechanisms
  fitness_sharing: true         # Penalize similar strategies
  sharing_radius: 0.25          # Tighter radius for small population
  diversity_threshold: 0.20     # Higher threshold to force diversity
  allow_self_crossover: false
  
  # Random immigrants - inject fresh genes
  # 2 per generation (13%) to prevent premature convergence
  random_immigrants: 2
  
  # Single objective - simpler, faster than NSGA-II
  mode: 'single_objective'

# === Fitness Function ===
# How we combine metrics into a single score
fitness_weights:
  profit: 0.30            # Primary goal: make money
  sharpe_ratio: 0.15      # Risk-adjusted returns matter
  sortino_ratio: 0.10     # Downside risk penalty
  profit_factor: 0.10     # Gross profit / gross loss
  drawdown: 0.15          # Penalty for losing streaks
  win_rate: 0.10          # Winning trade percentage
  trade_frequency: 0.10   # Penalty for too few/many trades

fitness_penalties:
  min_trades: 3            # Very low - accept strategies with few trades for testing
  max_drawdown: 0.40       # Lenient - allow risky strategies for exploration
  min_win_rate: 0.25       # Lenient - don't filter too aggressively
  complexity_weight: 0.005 # Light penalty for complex strategies

# === Backtesting Configuration ===
# Slightly longer data range for proper regime segmentation
backtesting:
  # 6 MONTHS - required for regime detection to have enough segments
  # With 15-day periods, this gives ~12 segments for proper evaluation
  timerange: "20250601-20260218"
  
  # Standard stake amount
  stake_amount: 100
  
  # SINGLE pair for speed - BTC/USDT has best regime detection
  pairs:
    - "BTC/USDT"
  
  # Allow few concurrent trades
  max_open_trades: 3
  
  # Standard fee
  fee: 0.001
  
  # Exchange
  exchange: "binance"
  
  # Auto-download if data missing
  auto_download_data: true
  
  # Enable caching - huge speed boost
  enable_cache: true
  
  # Timeout per backtest (seconds)
  timeout: 120

# === Walk-Forward Optimization ===
# DISABLED for fast testing - we want raw speed
walk_forward:
  enabled: false
  train_days: 30
  validation_days: 7
  step_days: 7
  mode: 'rolling'
  aggregation: 'mean'
  min_train_trades: 3

# === REGIME-AWARE EVALUATION ===
# ENABLED - this is what we're testing!
# Uses the new Phase 6 improvements
regime_aware:
  # ENABLE regime detection for testing
  enabled: true
  
  # USE NEW BEST METHOD (Phase 6 improvement)
  # adx_di_hysteresis is the best performer with:
  # - +0.188% bullish returns, -0.128% bearish returns
  # - Only 5.9% flip rate (stable)
  # - 29% bullish, 35% bearish, 36% sideways distribution
  method: 'adx_di_hysteresis'
  
  # Benchmark pair for regime detection
  benchmark_pair: null  # Uses first pair (BTC/USDT)
  
  # Detection timeframe - 4h is optimal for regime detection
  # Higher than trading TF for cleaner signals
  detection_timeframe: '4h'
  
  # Segment configuration - balanced for fast testing with enough segments
  period_days: 20        # 20-day periods = more segments for segmentation
  min_period_days: 15    # Accept 15+ day segments
  embargo_days: 2        # Small gap between segments
  
  # Segments per regime - MUST be >= 3 for optimization to get segments
  # (holdout takes max(1, n*ratio) which always takes at least 1)
  segments_per_regime: 3  # 3 per regime ensures optimization gets segments
  
  # LOWER holdout for short runs - ensure optimization segments exist
  holdout_ratio: 0.10    # Only 10% holdout for fast testing
  
  # Aggregation - harmonic mean penalizes inconsistency
  aggregation: 'harmonic_mean'
  cvar_alpha: 0.20
  
  # Equal regime weights
  regime_weights:
    bullish: 1.0
    bearish: 1.0
    sideways: 1.0

# === Strategy Constraints ===
strategy_constraints:
  min_trades: 3           # Accept low-trade strategies for testing
  max_drawdown: 0.40      # Lenient
  min_win_rate: 0.25      # Lenient
  # NOTE: Only use timeframes with data covering the timerange
  # BTC/USDT has: 5m, 1h, 4h data for 2024-2026 period
  # 15m data is OLD (2023 only) - DO NOT USE until downloaded
  timeframes: ["5m", "1h", "4h"]  # Removed 15m - no current data
  stoploss_range: [-0.25, -0.03]
  roi_range: [0.01, 0.20]
  max_open_trades_range: [1, 5]

# === Multi-Timeframe ===
# DISABLED for fast config - avoids needing to download extra timeframe data
# Enable this only if you've downloaded 15m/1h data for all pairs
multi_timeframe:
  enabled: false           # DISABLED - speeds up testing, no extra data needed
  available: ['1h']        # Only 1h (less data requirement)
  max_timeframes: 1
  higher_timeframe_preference:
    - 'EMA'
    - 'RSI'
    - 'ADX'

# === Indicator Configuration ===
indicators:
  # REDUCED set for speed - fewer combinations to explore
  available:
    - "RSI"
    - "EMA"
    - "BBANDS"
    - "ADX"
    - "MACD"
  
  # Fewer indicators per strategy
  max_per_strategy: 3

# === Trade Visualization ===
# ENABLED for debugging
trade_visualization:
  enabled: true
  output_dir: 'genetic_algorithm/output/fast_run/trade_plots'
  generations_to_plot: [0, 2, 4]  # First, middle, last
  top_strategies_to_plot: 2

# === Parallel Evaluation ===
# ENABLED - speed up evaluation with multiple workers
parallel_evaluation:
  enabled: true              # Enable parallel backtesting
  max_workers: 4             # 4 workers for fast config (adjust to your CPU)
  chunk_size: 'auto'         # Automatic batch sizing
  worker_log_level: 'WARNING'  # Reduce log noise from workers
  timeout_per_eval: 60       # Timeout per individual evaluation

# === Output Configuration ===
output:
  # Output directory for this config
  dir: 'genetic_algorithm/output/fast_run'
  
  # Save evolution stats for visualization
  save_stats: true
  stats_file: 'evolution_stats.json'
  
  # Save population snapshots
  save_snapshots: true
  snapshot_interval: 1  # Every generation for detailed analysis
