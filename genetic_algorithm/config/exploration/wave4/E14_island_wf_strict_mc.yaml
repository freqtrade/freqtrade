# ============================================================================
# WAVE 4 — E14: Island + WF + MC + Strict Constraints (Best of Both Worlds)
# ============================================================================
# Purpose: Combine the TWO best-performing approaches:
#   - E7's island+WF framework (Rank #2, score 0.136, 16 min, 92.9% win rate)
#   - E8's strict constraints + MC validation (Rank #1, score 0.114, 5/5 SAFE)
#
# Hypothesis: E7 never had MC or strict constraints. E8 never had island model.
#             Combining both should give island's speed + E8's safety.
#             W3 showed naive feature stacking fails — this is targeted integration.
#
# Key adaptations from E8 → island model:
#   - Tighter drawdown (0.20), higher min_trades (15), stricter win_rate (0.35)
#   - MC validation ON (15 perms) — never tested on island model before
#   - holdout_penalty ON with factor 0.7
#   - Stricter overfit thresholds (0.20/0.40)
#
# Expected runtime: ~20-25 min (island model + MC adds ~5 min)
# ============================================================================

genetic_algorithm:
  random_seed: 140
  population_size: 6
  generations: 15
  max_runtime_minutes: 300
  mutation_rate: 0.20           # Lower than E7 (0.25) — closer to E8's conservative approach
  crossover_rate: 0.75
  crossover_method: 'uniform'
  elite_size: 2                 # More elitism than E7 (was 1), less than E8 (was 3)
  tournament_size: 4            # Stronger selection like E8 (E7 was 3)
  selection_method: 'tournament'
  convergence_patience: 8
  adaptive_mutation: true
  max_adaptation_factor: 2.0
  adaptation_step: 0.10
  max_mutation_rate: 0.40       # Lower cap than E7 (0.50)
  fitness_sharing: true
  sharing_radius: 0.30          # E8's wider sharing radius
  diversity_threshold: 0.20
  allow_self_crossover: false
  random_immigrants: 1          # Conservative like E8
  mode: 'single_objective'

fitness_weights:
  profit: 0.25                  # E8's reduced profit weight
  sharpe_ratio: 0.18
  sortino_ratio: 0.14
  profit_factor: 0.10
  drawdown: 0.18                # E8's higher drawdown weight
  win_rate: 0.05
  trade_frequency: 0.04
  monthly_stability: 0.06
  cross_pair: 0.00

fitness_penalties:
  min_trades: 12                # Stricter (E7 was 8)
  max_drawdown: 0.20            # E8's tight constraint
  min_win_rate: 0.35            # Stricter than E7 (0.30)
  complexity_weight: 0.020
  unused_indicator_weight: 0.02
  pair_loss_threshold: -8.0

backtesting:
  timerange: "20230301-20260228"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "SOL/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 120

walk_forward:
  enabled: true
  train_days: 120
  validation_days: 30
  step_days: 30
  mode: 'rolling'
  aggregation: 'trimmed_mean'
  min_train_trades: 8
  max_windows: 8
  embargo_days: 3

holdout_validation:
  enabled: true
  holdout_pct: 0.20             # E8's 20% holdout (E7 was 15%)

holdout_monitoring:
  enabled: true
  interval: 3
  top_n: 3
  early_stop: false
  fitness_penalty: true
  penalty_factor: 0.7

regime_aware:
  enabled: true
  method: 'ensemble'
  benchmark_pair: 'BTC/USDT'
  detection_timeframe: '4h'
  period_days: 60
  min_period_days: 30
  embargo_days: 3
  segments_per_regime: 4
  holdout_ratio: 0.20
  aggregation: 'harmonic_mean'
  min_segment_trades: 5
  regime_weights:
    bullish: 1.0
    bearish: 1.0
    sideways: 1.0

monte_carlo:
  enabled: true                 # NEW: MC never tested on island model!
  num_permutations: 15
  confidence_level: 0.95
  min_trades: 10

deflated_sharpe:
  enabled: true
  min_trades: 8
  benchmark_sr: 0.0
  skewness_correction: true

parsimony:
  enabled: true
  max_indicators: 3             # E8's tighter limit (E7 was 4)
  max_conditions: 5

cpcv:
  enabled: false

strategy_constraints:
  min_trades: 12
  max_drawdown: 0.20
  min_win_rate: 0.35
  timeframes: ["15m"]
  stoploss_range: [-0.10, -0.03]
  roi_range: [0.01, 0.08]
  max_open_trades_range: [1, 4]
  min_exit_conditions: 1

multi_timeframe:
  enabled: false

indicators:
  available:
    - "RSI"
    - "EMA"
    - "BBANDS"
    - "ADX"
    - "MACD"
    - "SMA"
    - "SUPERTREND"
    - "STOCH"
    - "ATR"
    - "CCI"
  max_per_strategy: 3
  min_per_strategy: 2
  min_entry_conditions: 2

  RSI:
    period: [7, 21]
    buy_threshold: [20, 35]
    sell_threshold: [65, 80]
  MACD:
    fast_period: [8, 18]
    slow_period: [21, 50]
    signal_period: [5, 14]
  BBANDS:
    period: [14, 30]
    std_dev: [1.5, 3.0]
  EMA:
    period: [8, 40]
  SMA:
    period: [15, 80]
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [18, 35]
    d_threshold: [65, 82]
  ATR:
    period: [10, 20]
  ADX:
    period: [10, 20]
    threshold: [22, 38]
  CCI:
    period: [10, 30]
    buy_threshold: [-180, -80]
    sell_threshold: [80, 180]
  SUPERTREND:
    period: [7, 14]
    multiplier: [2.0, 4.0]

trade_visualization:
  enabled: false

terminal_monitor:
  enabled: false

parallel_evaluation:
  enabled: false

output:
  dir: 'genetic_algorithm/output/exploration/wave4/E14_island_wf_strict_mc'
  save_stats: true
  stats_file: 'evolution_stats.json'
  save_snapshots: true
  snapshot_interval: 1

storage:
  database: "genetic_algorithm/data/wave4_E14_island_wf_strict_mc.db"
  strategy_dir: "user_data/strategies/wave4_E14_island_wf_strict_mc"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave4_E14"
  checkpoint_interval: 3
  keep_history: true

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave4_E14_island_wf_strict_mc.log"
  console: true

hall_of_fame:
  enabled: true
  max_size: 20
  inject_count: 2
  min_fitness: 0.05
  directory: "genetic_algorithm/data/hall_of_fame_wave4_E14"

advanced:
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: false
  llm:
    enabled: false

  island_model:
    enabled: true

island_model:
  enabled: true
  parallel_islands: false

  islands:
    - name: 'bullish'
      population_size: 6
      data_regime: 'bullish'
    - name: 'bearish'
      population_size: 6
      data_regime: 'bearish'
    - name: 'sideways'
      population_size: 6
      data_regime: 'sideways'
    - name: 'master'
      population_size: 6
      data_regime: 'balanced'

  migration:
    specialist:
      interval: 3
      count: 1
      topology: 'fully_connected'
    master:
      interval: 2
      count: 1
      send_count: 1

  regime_detection:
    pair: 'BTC/USDT'
    timeframe: '4h'
    timerange: '20230301-20260228'
    method: 'ensemble'
    period_days: 60
    holdout_ratio: 0.20

overfit_analysis:
  thresholds:
    holdout_degradation_warning: 0.20
    holdout_degradation_overfit: 0.40
    wf_gap_warning: 0.12
    wf_gap_overfit: 0.25
    mc_robustness_warning: 0.75
    mc_robustness_overfit: 0.55
    composite_warning: 0.20
    composite_overfit: 0.40
