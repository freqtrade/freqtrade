# ============================================================================
# WAVE 4 — E16: Island + WF + Strong Elitism + MC (E7 Enhanced)
# ============================================================================
# Purpose: Take E7 (Rank #2, score 0.136) and add the two features it missed:
#   - Stronger elitism (1 → 3) — preserve more top strategies per generation
#   - Monte Carlo validation — additional robustness check
#   - Slightly tighter constraints
#
# Hypothesis: E7 was already excellent (4/5 SAFE, 92.9% win rate) but lost
#             one strategy to WARNING. More elitism preserves the best,
#             MC catches borderline cases. Should push from 4/5 to 5/5 SAFE.
#
# Differences from E7:
#   - elite_size: 1 → 3 (preserve top 3 per island)
#   - monte_carlo: OFF → ON (15 perms)
#   - tournament_size: 3 → 4 (stronger selection)
#   - min_trades: 8 → 10 (slightly stricter)
#   - max_drawdown: 0.25 → 0.22 (slightly tighter)
#   - random_seed: 77 → 160
#
# Expected runtime: ~18-22 min (slightly longer than E7 due to MC)
# ============================================================================

genetic_algorithm:
  random_seed: 160
  population_size: 6
  generations: 15
  max_runtime_minutes: 300
  mutation_rate: 0.25
  crossover_rate: 0.75
  crossover_method: 'uniform'
  elite_size: 3                 # KEY CHANGE: 1 → 3
  tournament_size: 4            # Stronger selection (E7 was 3)
  selection_method: 'tournament'
  convergence_patience: 10
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.15
  max_mutation_rate: 0.50
  fitness_sharing: true
  sharing_radius: 0.25
  diversity_threshold: 0.15
  allow_self_crossover: false
  random_immigrants: 2
  mode: 'single_objective'

fitness_weights:
  profit: 0.30
  sharpe_ratio: 0.15
  sortino_ratio: 0.12
  profit_factor: 0.08
  drawdown: 0.15
  win_rate: 0.06
  trade_frequency: 0.04
  monthly_stability: 0.04
  cross_pair: 0.06

fitness_penalties:
  min_trades: 10                # Slightly stricter (E7 was 8)
  max_drawdown: 0.22            # Tighter (E7 was 0.25)
  min_win_rate: 0.32            # Slightly stricter (E7 was 0.30)
  complexity_weight: 0.015
  unused_indicator_weight: 0.02
  pair_loss_threshold: -8.0

backtesting:
  timerange: "20230301-20260228"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "SOL/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 120

walk_forward:
  enabled: true
  train_days: 120
  validation_days: 30
  step_days: 30
  mode: 'rolling'
  aggregation: 'trimmed_mean'
  min_train_trades: 8
  max_windows: 8
  embargo_days: 3

holdout_validation:
  enabled: true
  holdout_pct: 0.15

holdout_monitoring:
  enabled: true
  interval: 3
  top_n: 3
  early_stop: false
  fitness_penalty: true
  penalty_factor: 0.7

regime_aware:
  enabled: true
  method: 'ensemble'
  benchmark_pair: 'BTC/USDT'
  detection_timeframe: '4h'
  period_days: 60
  min_period_days: 30
  embargo_days: 3
  segments_per_regime: 4
  holdout_ratio: 0.20
  aggregation: 'harmonic_mean'
  min_segment_trades: 5
  regime_weights:
    bullish: 1.0
    bearish: 1.0
    sideways: 1.0

monte_carlo:
  enabled: true                 # KEY CHANGE: OFF → ON
  num_permutations: 15
  confidence_level: 0.95
  min_trades: 10

deflated_sharpe:
  enabled: true
  min_trades: 8
  benchmark_sr: 0.0
  skewness_correction: true

parsimony:
  enabled: true
  max_indicators: 4
  max_conditions: 5

cpcv:
  enabled: false

strategy_constraints:
  min_trades: 10
  max_drawdown: 0.22
  min_win_rate: 0.32
  timeframes: ["15m"]
  stoploss_range: [-0.10, -0.03]
  roi_range: [0.01, 0.08]
  max_open_trades_range: [1, 4]
  min_exit_conditions: 1

multi_timeframe:
  enabled: false

indicators:
  available:
    - "RSI"
    - "EMA"
    - "BBANDS"
    - "ADX"
    - "MACD"
    - "SMA"
    - "SUPERTREND"
    - "STOCH"
    - "ATR"
    - "CCI"
  max_per_strategy: 4
  min_per_strategy: 2
  min_entry_conditions: 2

  RSI:
    period: [7, 21]
    buy_threshold: [20, 38]
    sell_threshold: [62, 80]
  MACD:
    fast_period: [8, 18]
    slow_period: [21, 50]
    signal_period: [5, 14]
  BBANDS:
    period: [14, 30]
    std_dev: [1.5, 3.0]
  EMA:
    period: [5, 50]
  SMA:
    period: [10, 100]
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [18, 38]
    d_threshold: [62, 82]
  ATR:
    period: [10, 20]
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  CCI:
    period: [10, 30]
    buy_threshold: [-200, -80]
    sell_threshold: [80, 200]
  SUPERTREND:
    period: [7, 14]
    multiplier: [2.0, 4.0]

trade_visualization:
  enabled: false

terminal_monitor:
  enabled: false

parallel_evaluation:
  enabled: false

output:
  dir: 'genetic_algorithm/output/exploration/wave4/E16_island_wf_elite_mc'
  save_stats: true
  stats_file: 'evolution_stats.json'
  save_snapshots: true
  snapshot_interval: 1

storage:
  database: "genetic_algorithm/data/wave4_E16_island_wf_elite_mc.db"
  strategy_dir: "user_data/strategies/wave4_E16_island_wf_elite_mc"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave4_E16"
  checkpoint_interval: 3
  keep_history: true

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave4_E16_island_wf_elite_mc.log"
  console: true

hall_of_fame:
  enabled: true
  max_size: 20
  inject_count: 2
  min_fitness: 0.05
  directory: "genetic_algorithm/data/hall_of_fame_wave4_E16"

advanced:
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: false
  llm:
    enabled: false

  island_model:
    enabled: true

island_model:
  enabled: true
  parallel_islands: false

  islands:
    - name: 'bullish'
      population_size: 6
      data_regime: 'bullish'
    - name: 'bearish'
      population_size: 6
      data_regime: 'bearish'
    - name: 'sideways'
      population_size: 6
      data_regime: 'sideways'
    - name: 'master'
      population_size: 6
      data_regime: 'balanced'

  migration:
    specialist:
      interval: 3
      count: 1
      topology: 'fully_connected'
    master:
      interval: 2
      count: 1
      send_count: 1

  regime_detection:
    pair: 'BTC/USDT'
    timeframe: '4h'
    timerange: '20230301-20260228'
    method: 'ensemble'
    period_days: 60
    holdout_ratio: 0.20

overfit_analysis:
  thresholds:
    holdout_degradation_warning: 0.25
    holdout_degradation_overfit: 0.50
    wf_gap_warning: 0.15
    wf_gap_overfit: 0.30
    mc_robustness_warning: 0.70
    mc_robustness_overfit: 0.50
    composite_warning: 0.25
    composite_overfit: 0.50
