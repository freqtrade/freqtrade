# ============================================================================
# WAVE 3 — E13: Island + WF + Longer Training Windows
# ============================================================================
# Purpose: Test whether longer WF training windows improve robustness.
#   - E7 used train_days=120 (4 months) — best score so far
#   - E13 uses train_days=180 (6 months) — more data per window
#
# Also tests: larger holdout (20% vs 15%), more WF windows (10 vs 8),
# and stricter trade requirements. This is the "maximum validation" version.
#
# Hypothesis: More training data and stricter validation should produce
#             lower absolute fitness but better holdout ratios.
#             Quality over quantity — fewer but better strategies.
#
# Expected runtime: ~20-30 min (longer backtests per window)
# ============================================================================

genetic_algorithm:
  random_seed: 133
  population_size: 6
  generations: 15
  max_runtime_minutes: 300
  mutation_rate: 0.25
  crossover_rate: 0.75
  crossover_method: 'uniform'
  elite_size: 1
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 10
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.15
  max_mutation_rate: 0.50
  fitness_sharing: true
  sharing_radius: 0.25
  diversity_threshold: 0.15
  allow_self_crossover: false
  random_immigrants: 2
  mode: 'single_objective'

fitness_weights:
  profit: 0.30
  sharpe_ratio: 0.15
  sortino_ratio: 0.12
  profit_factor: 0.08
  drawdown: 0.15
  win_rate: 0.06
  trade_frequency: 0.04
  monthly_stability: 0.04
  cross_pair: 0.06

fitness_penalties:
  min_trades: 10                 # Stricter than E7 (was 8)
  max_drawdown: 0.20             # Tighter than E7 (was 0.25)
  min_win_rate: 0.35             # Higher than E7 (was 0.30)
  complexity_weight: 0.015
  unused_indicator_weight: 0.02
  pair_loss_threshold: -8.0

backtesting:
  timerange: "20230301-20260228"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "SOL/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 120

walk_forward:
  enabled: true
  train_days: 180                # LONGER — 6 months training
  validation_days: 30
  step_days: 30
  mode: 'rolling'
  aggregation: 'trimmed_mean'
  min_train_trades: 10           # Stricter
  max_windows: 10                # More windows
  embargo_days: 5                # Larger embargo

holdout_validation:
  enabled: true
  holdout_pct: 0.20              # Larger holdout (20% vs 15%)

holdout_monitoring:
  enabled: true
  interval: 3
  top_n: 3
  early_stop: false
  fitness_penalty: true
  penalty_factor: 0.7

regime_aware:
  enabled: true
  method: 'ensemble'
  benchmark_pair: 'BTC/USDT'
  detection_timeframe: '4h'
  period_days: 60
  min_period_days: 30
  embargo_days: 3
  segments_per_regime: 4
  holdout_ratio: 0.20
  aggregation: 'harmonic_mean'
  min_segment_trades: 5
  regime_weights:
    bullish: 1.0
    bearish: 1.0
    sideways: 1.0

monte_carlo:
  enabled: false

deflated_sharpe:
  enabled: true
  min_trades: 10                 # Stricter
  benchmark_sr: 0.0
  skewness_correction: true

parsimony:
  enabled: true
  max_indicators: 4
  max_conditions: 5

cpcv:
  enabled: false

strategy_constraints:
  min_trades: 10
  max_drawdown: 0.20
  min_win_rate: 0.35
  timeframes: ["15m"]
  stoploss_range: [-0.10, -0.03]
  roi_range: [0.01, 0.08]
  max_open_trades_range: [1, 4]
  min_exit_conditions: 1

multi_timeframe:
  enabled: false

indicators:
  available:
    - "RSI"
    - "EMA"
    - "BBANDS"
    - "ADX"
    - "MACD"
    - "SMA"
    - "SUPERTREND"
    - "STOCH"
    - "ATR"
    - "CCI"
  max_per_strategy: 4
  min_per_strategy: 2
  min_entry_conditions: 2

  RSI:
    period: [7, 21]
    buy_threshold: [20, 38]
    sell_threshold: [62, 80]
  MACD:
    fast_period: [8, 18]
    slow_period: [21, 50]
    signal_period: [5, 14]
  BBANDS:
    period: [14, 30]
    std_dev: [1.5, 3.0]
  EMA:
    period: [5, 50]
  SMA:
    period: [10, 100]
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [18, 38]
    d_threshold: [62, 82]
  ATR:
    period: [10, 20]
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  CCI:
    period: [10, 30]
    buy_threshold: [-200, -80]
    sell_threshold: [80, 200]
  SUPERTREND:
    period: [7, 14]
    multiplier: [2.0, 4.0]

trade_visualization:
  enabled: false

terminal_monitor:
  enabled: false

parallel_evaluation:
  enabled: false

output:
  dir: 'genetic_algorithm/output/exploration/wave3/E13_island_wf_longwindow'
  save_stats: true
  stats_file: 'evolution_stats.json'
  save_snapshots: true
  snapshot_interval: 1

storage:
  database: "genetic_algorithm/data/wave3_E13_island_wf_longwindow.db"
  strategy_dir: "user_data/strategies/wave3_E13_island_wf_longwindow"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave3_E13"
  checkpoint_interval: 3
  keep_history: true

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave3_E13_island_wf_longwindow.log"
  console: true

hall_of_fame:
  enabled: true
  max_size: 20
  inject_count: 2
  min_fitness: 0.05
  directory: "genetic_algorithm/data/hall_of_fame_wave3_E13"

advanced:
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: false
  llm:
    enabled: false

  island_model:
    enabled: true

island_model:
  enabled: true
  parallel_islands: false

  islands:
    - name: 'bullish'
      population_size: 6
      data_regime: 'bullish'
    - name: 'bearish'
      population_size: 6
      data_regime: 'bearish'
    - name: 'sideways'
      population_size: 6
      data_regime: 'sideways'
    - name: 'master'
      population_size: 6
      data_regime: 'balanced'

  migration:
    specialist:
      interval: 3
      count: 1
      topology: 'fully_connected'
    master:
      interval: 4
      count: 1
      strategy: 'best'

overfit_analysis:
  thresholds:
    holdout_degradation_warning: 0.20   # Stricter thresholds
    holdout_degradation_overfit: 0.45
    wf_gap_warning: 0.12
    wf_gap_overfit: 0.25
    mc_robustness_warning: 0.70
    mc_robustness_overfit: 0.50
