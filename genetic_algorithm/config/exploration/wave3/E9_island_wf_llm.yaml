# ============================================================================
# WAVE 3 — E9: Island + WF + LLM (Best Combo)
# ============================================================================
# Purpose: Combine the two best-performing approaches:
#   - Island + WF from E7 (Rank #1, avg score 0.136, 92.9% win rate)
#   - LLM guidance from E6 (Rank #4, best holdout 0.4039)
#
# Hypothesis: LLM-seeded strategies on regime-specific islands with WF
#             validation should produce both high fitness AND robust holdout.
#             E6's quality holdout + E7's low overfit = potential new best.
#
# Key settings borrowed:
#   From E7: island model (6/island), WF (120d/30d), 15 gen, holdout penalty
#   From E6: LLM seed/immigrants/mutation, Groq llama-3.3-70b
#
# Expected runtime: ~20-30 min (island model fast + LLM API latency)
# ============================================================================

genetic_algorithm:
  random_seed: null              # LLM needs randomness
  population_size: 6
  generations: 15
  max_runtime_minutes: 300
  mutation_rate: 0.25
  crossover_rate: 0.75
  crossover_method: 'uniform'
  elite_size: 1
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 10
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.15
  max_mutation_rate: 0.50
  fitness_sharing: true
  sharing_radius: 0.25
  diversity_threshold: 0.15
  allow_self_crossover: false
  random_immigrants: 1           # Fewer random, LLM fills the rest
  mode: 'single_objective'

fitness_weights:
  profit: 0.30
  sharpe_ratio: 0.15
  sortino_ratio: 0.12
  profit_factor: 0.08
  drawdown: 0.15
  win_rate: 0.06
  trade_frequency: 0.04
  monthly_stability: 0.04
  cross_pair: 0.06

fitness_penalties:
  min_trades: 8
  max_drawdown: 0.25
  min_win_rate: 0.30
  complexity_weight: 0.015
  unused_indicator_weight: 0.02
  pair_loss_threshold: -8.0

backtesting:
  timerange: "20230301-20260228"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "SOL/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 120

walk_forward:
  enabled: true
  train_days: 120
  validation_days: 30
  step_days: 30
  mode: 'rolling'
  aggregation: 'trimmed_mean'
  min_train_trades: 8
  max_windows: 8
  embargo_days: 3

holdout_validation:
  enabled: true
  holdout_pct: 0.15

holdout_monitoring:
  enabled: true
  interval: 3
  top_n: 3
  early_stop: false
  fitness_penalty: true
  penalty_factor: 0.7

regime_aware:
  enabled: true
  method: 'ensemble'
  benchmark_pair: 'BTC/USDT'
  detection_timeframe: '4h'
  period_days: 60
  min_period_days: 30
  embargo_days: 3
  segments_per_regime: 4
  holdout_ratio: 0.20
  aggregation: 'harmonic_mean'
  min_segment_trades: 5
  regime_weights:
    bullish: 1.0
    bearish: 1.0
    sideways: 1.0

monte_carlo:
  enabled: false

deflated_sharpe:
  enabled: true
  min_trades: 8
  benchmark_sr: 0.0
  skewness_correction: true

parsimony:
  enabled: true
  max_indicators: 4
  max_conditions: 5

cpcv:
  enabled: false

strategy_constraints:
  min_trades: 8
  max_drawdown: 0.25
  min_win_rate: 0.30
  timeframes: ["15m"]
  stoploss_range: [-0.10, -0.03]
  roi_range: [0.01, 0.08]
  max_open_trades_range: [1, 4]
  min_exit_conditions: 1

multi_timeframe:
  enabled: false

indicators:
  available:
    - "RSI"
    - "EMA"
    - "BBANDS"
    - "ADX"
    - "MACD"
    - "SMA"
    - "SUPERTREND"
    - "STOCH"
    - "ATR"
    - "CCI"
  max_per_strategy: 4
  min_per_strategy: 2
  min_entry_conditions: 2

  RSI:
    period: [7, 21]
    buy_threshold: [20, 38]
    sell_threshold: [62, 80]
  MACD:
    fast_period: [8, 18]
    slow_period: [21, 50]
    signal_period: [5, 14]
  BBANDS:
    period: [14, 30]
    std_dev: [1.5, 3.0]
  EMA:
    period: [5, 50]
  SMA:
    period: [10, 100]
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [18, 38]
    d_threshold: [62, 82]
  ATR:
    period: [10, 20]
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  CCI:
    period: [10, 30]
    buy_threshold: [-200, -80]
    sell_threshold: [80, 200]
  SUPERTREND:
    period: [7, 14]
    multiplier: [2.0, 4.0]

trade_visualization:
  enabled: false

terminal_monitor:
  enabled: false

parallel_evaluation:
  enabled: false

output:
  dir: 'genetic_algorithm/output/exploration/wave3/E9_island_wf_llm'
  save_stats: true
  stats_file: 'evolution_stats.json'
  save_snapshots: true
  snapshot_interval: 1

storage:
  database: "genetic_algorithm/data/wave3_E9_island_wf_llm.db"
  strategy_dir: "user_data/strategies/wave3_E9_island_wf_llm"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave3_E9"
  checkpoint_interval: 3
  keep_history: true

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave3_E9_island_wf_llm.log"
  console: true

hall_of_fame:
  enabled: true
  max_size: 20
  inject_count: 2
  min_fitness: 0.05
  directory: "genetic_algorithm/data/hall_of_fame_wave3_E9"

# === LLM + Island Model — BOTH ENABLED ===
advanced:
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: true

  llm:
    enabled: true
    provider: "groq"
    api_key: ""
    model: "llama-3.3-70b-versatile"
    temperature: 0.7
    max_tokens: 4096
    timeout: 60
    max_retries: 3
    retry_delay: 2.0
    min_call_interval: 1.0

    seed_ratio: 0.40
    immigrant_ratio: 0.60
    immigrants_per_generation: 2

    mutation_enabled: true
    mutation_probability: 0.15
    mutation_top_k: 3
    mutation_stagnation_threshold: 3

    batch_enabled: true
    max_batch_size: 3

    max_calls_per_generation: 10
    max_calls_per_run: 100

    escalation_threshold: 4
    escalation_immigrant_ratio: 0.80
    escalation_mutation_probability: 0.25

  island_model:
    enabled: true

island_model:
  enabled: true
  parallel_islands: false

  islands:
    - name: 'bullish'
      population_size: 6
      data_regime: 'bullish'
    - name: 'bearish'
      population_size: 6
      data_regime: 'bearish'
    - name: 'sideways'
      population_size: 6
      data_regime: 'sideways'
    - name: 'master'
      population_size: 6
      data_regime: 'balanced'

  migration:
    specialist:
      interval: 3
      count: 1
      topology: 'fully_connected'
    master:
      interval: 4
      count: 1
      strategy: 'best'

overfit_analysis:
  thresholds:
    holdout_degradation_warning: 0.25
    holdout_degradation_overfit: 0.50
    wf_gap_warning: 0.15
    wf_gap_overfit: 0.30
    mc_robustness_warning: 0.70
    mc_robustness_overfit: 0.50
