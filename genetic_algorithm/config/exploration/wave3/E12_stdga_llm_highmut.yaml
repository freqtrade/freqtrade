# ============================================================================
# WAVE 3 — E12: Standard GA + LLM + High Mutation
# ============================================================================
# Purpose: Combine the best standard GA settings from E5 and E6.
#   - E5 (high mutation 0.40): 4/5 SAFE, negative degradation
#   - E6 (LLM guidance): Best holdout (0.4039), 4/5 SAFE
#   
# This is the "standard GA best combo" to compare against island approaches.
#
# Hypothesis: If standard GA + LLM + high mutation can match island+WF,
#             the simpler approach is preferable. If not, island wins.
#
# Expected runtime: ~50-60 min (standard GA with pop=15)
# ============================================================================

genetic_algorithm:
  random_seed: null              # LLM needs randomness
  population_size: 15
  generations: 12
  max_runtime_minutes: 300
  mutation_rate: 0.40            # HIGH from E5
  crossover_rate: 0.65           # Lower to compensate
  crossover_method: 'uniform'
  elite_size: 2
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 10
  adaptive_mutation: true
  max_adaptation_factor: 2.0
  adaptation_step: 0.10
  max_mutation_rate: 0.60
  fitness_sharing: true
  sharing_radius: 0.20
  diversity_threshold: 0.15
  allow_self_crossover: false
  random_immigrants: 1           # Fewer, LLM replaces
  mode: 'single_objective'

fitness_weights:
  profit: 0.30
  sharpe_ratio: 0.15
  sortino_ratio: 0.10
  profit_factor: 0.10
  drawdown: 0.15
  win_rate: 0.05
  trade_frequency: 0.05
  monthly_stability: 0.05
  cross_pair: 0.05

fitness_penalties:
  min_trades: 10
  max_drawdown: 0.25
  min_win_rate: 0.35
  complexity_weight: 0.015
  unused_indicator_weight: 0.02
  pair_loss_threshold: -8.0

backtesting:
  timerange: "20230301-20260228"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "SOL/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 120

walk_forward:
  enabled: true
  train_days: 120
  validation_days: 30
  step_days: 30
  mode: 'rolling'
  aggregation: 'trimmed_mean'
  min_train_trades: 8
  max_windows: 8
  embargo_days: 3

holdout_validation:
  enabled: true
  holdout_pct: 0.15

holdout_monitoring:
  enabled: true
  interval: 3
  top_n: 3
  early_stop: false
  fitness_penalty: true
  penalty_factor: 0.7

monte_carlo:
  enabled: true
  n_permutations: 10
  confidence_level: 0.95

deflated_sharpe:
  enabled: true
  min_trades: 8
  benchmark_sr: 0.0
  skewness_correction: true

parsimony:
  enabled: true
  max_indicators: 4
  max_conditions: 5

cpcv:
  enabled: false

strategy_constraints:
  min_trades: 10
  max_drawdown: 0.25
  min_win_rate: 0.35
  timeframes: ["15m"]
  stoploss_range: [-0.10, -0.03]
  roi_range: [0.01, 0.08]
  max_open_trades_range: [1, 4]
  min_exit_conditions: 1

multi_timeframe:
  enabled: false

indicators:
  available:
    - "RSI"
    - "EMA"
    - "BBANDS"
    - "ADX"
    - "MACD"
    - "SMA"
    - "SUPERTREND"
    - "STOCH"
    - "ATR"
    - "CCI"
  max_per_strategy: 4
  min_per_strategy: 2
  min_entry_conditions: 2

  RSI:
    period: [7, 21]
    buy_threshold: [20, 38]
    sell_threshold: [62, 80]
  MACD:
    fast_period: [8, 18]
    slow_period: [21, 50]
    signal_period: [5, 14]
  BBANDS:
    period: [14, 30]
    std_dev: [1.5, 3.0]
  EMA:
    period: [5, 50]
  SMA:
    period: [10, 100]
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [18, 38]
    d_threshold: [62, 82]
  ATR:
    period: [10, 20]
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  CCI:
    period: [10, 30]
    buy_threshold: [-200, -80]
    sell_threshold: [80, 200]
  SUPERTREND:
    period: [7, 14]
    multiplier: [2.0, 4.0]

trade_visualization:
  enabled: false

terminal_monitor:
  enabled: false

parallel_evaluation:
  enabled: false

output:
  dir: 'genetic_algorithm/output/exploration/wave3/E12_stdga_llm_highmut'
  save_stats: true
  stats_file: 'evolution_stats.json'
  save_snapshots: true
  snapshot_interval: 1

storage:
  database: "genetic_algorithm/data/wave3_E12_stdga_llm_highmut.db"
  strategy_dir: "user_data/strategies/wave3_E12_stdga_llm_highmut"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave3_E12"
  checkpoint_interval: 3
  keep_history: true

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave3_E12_stdga_llm_highmut.log"
  console: true

hall_of_fame:
  enabled: true
  max_size: 20
  inject_count: 2
  min_fitness: 0.05
  directory: "genetic_algorithm/data/hall_of_fame_wave3_E12"

advanced:
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: true

  llm:
    enabled: true
    provider: "groq"
    api_key: ""
    model: "llama-3.3-70b-versatile"
    temperature: 0.7
    max_tokens: 4096
    timeout: 60
    max_retries: 3
    retry_delay: 2.0
    min_call_interval: 1.0

    seed_ratio: 0.40
    immigrant_ratio: 0.60
    immigrants_per_generation: 2

    mutation_enabled: true
    mutation_probability: 0.20   # Higher than E6 — matches high mut spirit
    mutation_top_k: 3
    mutation_stagnation_threshold: 3

    batch_enabled: true
    max_batch_size: 3

    max_calls_per_generation: 10
    max_calls_per_run: 100

    escalation_threshold: 4
    escalation_immigrant_ratio: 0.80
    escalation_mutation_probability: 0.30

overfit_analysis:
  thresholds:
    holdout_degradation_warning: 0.25
    holdout_degradation_overfit: 0.50
    wf_gap_warning: 0.15
    wf_gap_overfit: 0.30
    mc_robustness_warning: 0.70
    mc_robustness_overfit: 0.50
