# Minimal GA Configuration for Quick Testing
# 
# This config is designed for a minimal run to verify all GA features work:
# - 3 generations
# - 10 population size
# - 2 timeframes
# 
# Run: python genetic_algorithm/run_ga.py --config genetic_algorithm/config/ga_config_minimal.yaml --yes

# === Genetic Algorithm Parameters ===
genetic_algorithm:
  random_seed: 42  # Fixed seed for reproducibility
  population_size: 10
  generations: 3
  mutation_rate: 0.15
  crossover_rate: 0.7
  elite_size: 2
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 5
  
  # Diversity preservation
  adaptive_mutation: true
  max_adaptation_factor: 2.0
  adaptation_step: 0.1
  fitness_sharing: true
  sharing_radius: 0.3
  diversity_threshold: 0.15
  allow_self_crossover: false
  random_immigrants: 2

# === Fitness Function Weights ===
fitness_weights:
  profit: 0.30
  sharpe_ratio: 0.15
  sortino_ratio: 0.10
  profit_factor: 0.10
  drawdown: 0.15
  win_rate: 0.10
  trade_frequency: 0.10

# Fitness penalties
fitness_penalties:
  min_trades: 3
  max_drawdown: 0.30
  min_win_rate: 0.25
  complexity_weight: 0.01

# === Backtesting Configuration ===
backtesting:
  timerange: "20250620-20260218"
  stake_amount: 0.2
  pairs:
    - "ETH/BTC"
    - "LTC/BTC"
  max_open_trades: 4
  fee: 0.002
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 300

# === Walk-Forward Optimization ===
# Disabled for quick testing - enable for production runs
walk_forward:
  enabled: false
  train_days: 30
  validation_days: 10
  step_days: 10
  mode: 'rolling'
  aggregation: 'mean'
  min_train_trades: 5

# === Strategy Constraints ===
strategy_constraints:
  min_trades: 5
  max_drawdown: 0.30
  min_win_rate: 0.25
  timeframes: ["5m", "15m"]  # Only 2 timeframes
  stoploss_range: [-0.20, -0.05]
  roi_range: [0.01, 0.10]
  max_open_trades_range: [1, 6]

# === Multi-Timeframe Configuration ===
multi_timeframe:
  enabled: true
  available: ['15m', '1h']
  max_timeframes: 1
  higher_timeframe_preference:
    - 'EMA'
    - 'SMA'
    - 'RSI'

# === Indicator Configuration ===
indicators:
  available:
    - "RSI"
    - "MACD"
    - "BBANDS"
    - "EMA"
    - "SMA"
    - "STOCH"
    - "ATR"
    - "ADX"
    - "CCI"
  max_per_strategy: 4
  min_per_strategy: 2
  
  RSI:
    period: [7, 21]
    buy_threshold: [20, 40]
    sell_threshold: [60, 80]
  
  MACD:
    fast_period: [8, 21]
    slow_period: [21, 50]
    signal_period: [5, 14]
  
  BBANDS:
    period: [15, 30]
    std_dev: [1.5, 3.0]
  
  EMA:
    period: [5, 50]
  
  SMA:
    period: [10, 100]
  
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [20, 40]
    d_threshold: [60, 80]
  
  ATR:
    period: [10, 20]
  
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  
  CCI:
    period: [10, 30]
    buy_threshold: [-200, -100]
    sell_threshold: [100, 200]

# === Storage Configuration ===
storage:
  database: "genetic_algorithm/data/strategies.db"
  strategy_dir: "user_data/strategies/ga_generated"
  checkpoint_dir: "genetic_algorithm/data/checkpoints"
  checkpoint_interval: 5
  keep_history: true

# === Logging Configuration ===
logging:
  level: "INFO"
  file: "genetic_algorithm/logs/ga_minimal.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# === Visualization Configuration ===
visualization:
  enabled: false  # Disable for faster runs
  update_interval: 1
  plots:
    - "fitness_evolution"
    - "diversity"
  output_dir: "genetic_algorithm/plots"

# === Trade Visualization Configuration ===
trade_visualization:
  enabled: true
  top_n_strategies: 2
  mode: 'final'
  output_dir: "genetic_algorithm/output/trade_plots"
  show_volume: true
  dpi: 150

# === Advanced Features ===
advanced:
  parallel_evaluation: false
  num_workers: 4
  enable_dry_run: false
  dry_run_duration: 7
  enable_ml_fitness: false
  enable_llm: false
