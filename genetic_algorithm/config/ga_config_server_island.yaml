# Server-Optimized ISLAND MODEL Configuration — 6-Core i5 / 16 GB RAM / NVMe
#
# Tuned for: i5-9500T (6 cores), 16 GB RAM, NVMe SSD
# Key differences from standard island config:
#   - Parallel evaluation WITHIN each island (shared worker pool)
#   - Parallel island evolution (ThreadPoolExecutor for island orchestration)
#   - Larger populations per island (30 vs 25) for better diversity
#   - 3-year timerange for regime statistical significance
#   - More frequent checkpoints for unattended runs
#
# Expected runtime: ~4-6 hours with parallel islands (vs ~12-16h sequential)
#
# Usage:
#   python genetic_algorithm/run_ga.py \
#     --config genetic_algorithm/config/ga_config_server_island.yaml \
#     --no-monitor --yes

genetic_algorithm:
  random_seed: null
  population_size: 30
  generations: 20
  mutation_rate: 0.20
  crossover_rate: 0.78
  crossover_method: 'uniform'
  elite_size: 3
  tournament_size: 4
  selection_method: 'tournament'
  convergence_patience: 12
  max_runtime_minutes: 720
  adaptive_mutation: true
  max_adaptation_factor: 2.0
  adaptation_step: 0.12
  max_mutation_rate: 0.40
  fitness_sharing: true
  sharing_radius: 0.18
  diversity_threshold: 0.10
  allow_self_crossover: false
  random_immigrants: 3
  mode: 'single_objective'

fitness_weights:
  profit: 0.22
  sharpe_ratio: 0.20
  sortino_ratio: 0.14
  profit_factor: 0.10
  drawdown: 0.16
  win_rate: 0.10
  trade_frequency: 0.04
  monthly_stability: 0.04
  cross_pair: 0.00

fitness_penalties:
  min_trades: 8
  max_drawdown: 0.20
  min_win_rate: 0.40
  complexity_weight: 0.020
  pair_loss_threshold: -8.0
  unused_indicator_weight: 0.025

fitness_bounds:
  profit_min: -50
  profit_max: 200
  sharpe_min: -5
  sharpe_max: 10
  sortino_min: -5
  sortino_max: 12
  profit_factor_max: 10

trade_frequency_thresholds:
  very_few: 3
  few: 6
  ideal_min: 6
  ideal_max: 40
  moderate_excess: 80

# === Backtesting — 3 years for statistical significance ===
backtesting:
  timerange: "20230101-20260228"
  stake_amount: 0.15
  pairs:
    - "BTC/USDT"
  max_open_trades: 3
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  datadir: "user_data/data/binance"
  auto_download_data: true
  enable_cache: true
  timeout: 120

walk_forward:
  enabled: false

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

regime_aware:
  enabled: true
  method: 'ensemble'
  benchmark_pair: 'BTC/USDT'
  detection_timeframe: '4h'
  period_days: 60
  min_period_days: 30
  embargo_days: 3
  segments_per_regime: 4
  holdout_ratio: 0.20
  aggregation: 'harmonic_mean'
  min_segment_trades: 3
  regime_weights:
    bullish: 1.0
    bearish: 1.0
    sideways: 1.0

strategy_constraints:
  min_trades: 5
  max_drawdown: 0.22
  min_win_rate: 0.35
  timeframes: ["4h"]
  stoploss_range: [-0.10, -0.03]
  roi_range: [0.02, 0.10]
  max_open_trades_range: [1, 3]

multi_timeframe:
  enabled: false

indicators:
  available:
    - "RSI"
    - "MACD"
    - "BBANDS"
    - "EMA"
    - "SMA"
    - "STOCH"
    - "ATR"
    - "ADX"
    - "CCI"
    - "MFI"
    - "WILLR"
  max_per_strategy: 5
  min_per_strategy: 2
  min_entry_conditions: 2
  min_exit_conditions: 1

  RSI:
    period: [7, 21]
    buy_threshold: [20, 38]
    sell_threshold: [62, 80]
  MACD:
    fast_period: [8, 18]
    slow_period: [21, 50]
    signal_period: [5, 14]
  BBANDS:
    period: [14, 30]
    std_dev: [1.5, 3.0]
  EMA:
    period: [5, 50]
  SMA:
    period: [10, 100]
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [18, 38]
    d_threshold: [62, 82]
  ATR:
    period: [10, 20]
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  CCI:
    period: [10, 30]
    buy_threshold: [-200, -80]
    sell_threshold: [80, 200]
  MFI:
    period: [10, 20]
    buy_threshold: [18, 35]
    sell_threshold: [65, 82]
  WILLR:
    period: [10, 21]
    buy_threshold: [-85, -70]
    sell_threshold: [-30, -15]

parsimony:
  enabled: true
  tolerance: 0.02
  max_removals_per_strategy: 2

storage:
  database: "genetic_algorithm/data/strategies_island_server.db"
  strategy_dir: "user_data/strategies/ga_island_server"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_island_server"
  checkpoint_interval: 3
  keep_history: true

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/ga_island_server.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

visualization:
  enabled: false

terminal_monitor:
  enabled: true

hall_of_fame:
  enabled: true
  max_size: 50
  inject_count: 2
  min_fitness: 0.10
  directory: "genetic_algorithm/data/hall_of_fame_island_server"

deflated_sharpe:
  enabled: true
  min_trades: 5
  benchmark_sr: 0.0
  skewness_correction: true

# === Parallel Evaluation — ENABLED, shared across islands ===
parallel_evaluation:
  enabled: true
  num_workers: null
  backtest_timeout: 120
  memory_aware: true
  estimated_worker_memory_mb: 800
  min_free_ram_mb: 2048

advanced:
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: true

  llm:
    enabled: true
    provider: "groq"
    model: "llama-3.3-70b-versatile"
    temperature: 0.65
    max_retries: 2
    timeout: 60
    min_call_interval: 3.0
    max_call_interval: 12.0
    seed_ratio: 0.30
    immigrant_ratio: 0.40
    mutation_enabled: true
    mutation_probability: 0.12
    mutation_top_k: 3
    mutation_stagnation_threshold: 3
    max_calls_per_generation: 6
    max_calls_per_run: 200
    batch_enabled: true
    max_batch_size: 3

# ============================================================================
# ISLAND MODEL CONFIGURATION — Server-optimized
# ============================================================================
island_model:
  enabled: true

  # Parallel island evolution: evolve islands concurrently using threads
  # Each island submits backtests to the shared worker pool
  parallel_islands: true

  islands:
    - name: 'bullish'
      population_size: 30
      data_regime: 'bullish'
    - name: 'bearish'
      population_size: 30
      data_regime: 'bearish'
    - name: 'sideways'
      population_size: 30
      data_regime: 'sideways'
    - name: 'master'
      population_size: 30
      data_regime: 'balanced'

  migration:
    specialist:
      interval: 3
      count: 2
      topology: 'fully_connected'
    master:
      interval: 2
      count: 3
      send_count: 3

  regime_detection:
    pair: 'BTC/USDT'
    timeframe: '4h'
    timerange: '20230101-20260228'
    method: 'ensemble'
    period_days: 60
    holdout_ratio: 0.20

# === Web Dashboard ===
web_dashboard:
  host: "0.0.0.0"
  port: 8501
  open_browser: false
