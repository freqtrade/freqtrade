# ============================================================================
# PHASE 1 — Run A1: Multi-Pair 15m (R5-improved baseline)
# ============================================================================
# Based on R5 (benchmark v2 winner, 5/5 SAFE) with improvements:
#   - 5 pairs (added XRP/USDT)
#   - Larger population (40) and more generations (40)
#   - Tighter parsimony (max 4 indicators, 5 conditions)
#   - Higher min_trades (20) for statistical significance
#   - Runtime budget: ~3h
# ============================================================================

genetic_algorithm:
  random_seed: 100
  population_size: 40
  generations: 40
  max_runtime_minutes: 200
  mutation_rate: 0.20
  crossover_rate: 0.75
  crossover_method: 'uniform'
  elite_size: 4
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 15
  adaptive_mutation: true
  max_adaptation_factor: 2.0
  adaptation_step: 0.12
  max_mutation_rate: 0.65
  fitness_sharing: true
  sharing_radius: 0.22
  diversity_threshold: 0.15
  allow_self_crossover: false
  random_immigrants: 5
  mode: 'single_objective'

fitness_weights:
  profit: 0.28
  sharpe_ratio: 0.13
  sortino_ratio: 0.10
  profit_factor: 0.08
  drawdown: 0.12
  win_rate: 0.05
  trade_frequency: 0.06
  drawdown_duration: 0.02
  consecutive_losses: 0.02
  monthly_stability: 0.04
  cross_pair: 0.10

fitness_penalties:
  min_trades: 20
  max_drawdown: 0.35
  min_win_rate: 0.30
  complexity_weight: 0.012
  unused_indicator_weight: 0.025
  pair_loss_threshold: -5.0

backtesting:
  timerange: "20230301-20260228"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 240

walk_forward:
  enabled: true
  train_days: 90
  validation_days: 30
  step_days: 30
  mode: 'rolling'
  aggregation: 'mean'
  min_train_trades: 10
  max_windows: 10

holdout_validation:
  enabled: true
  holdout_pct: 0.15

holdout_monitoring:
  enabled: true
  interval: 3
  top_n: 3
  early_stop: true
  early_stop_threshold: 0.60
  early_stop_checks: 3
  trend_early_stop: true
  trend_checks: 3
  fitness_penalty: true
  penalty_factor: 0.8

regime_aware:
  enabled: false

monte_carlo:
  enabled: false

deflated_sharpe:
  enabled: true
  min_trades: 15
  benchmark_sr: 0.0
  skewness_correction: true

parsimony:
  enabled: true
  max_indicators: 4
  max_conditions: 5

cpcv:
  enabled: false

strategy_constraints:
  min_trades: 20
  max_drawdown: 0.35
  min_win_rate: 0.30
  timeframes: ["15m"]
  stoploss_range: [-0.15, -0.03]
  roi_range: [0.01, 0.12]
  max_open_trades_range: [1, 4]
  min_exit_conditions: 1

multi_timeframe:
  enabled: false

indicators:
  available:
    - "RSI"
    - "EMA"
    - "BBANDS"
    - "ADX"
    - "MACD"
    - "SMA"
    - "SUPERTREND"
    - "STOCH"
    - "ATR"
    - "CCI"
  max_per_strategy: 4
  min_per_strategy: 2
  min_entry_conditions: 2

  RSI:
    period: [7, 21]
    buy_threshold: [20, 38]
    sell_threshold: [62, 80]
  MACD:
    fast_period: [8, 18]
    slow_period: [21, 50]
    signal_period: [5, 14]
  BBANDS:
    period: [14, 30]
    std_dev: [1.5, 3.0]
  EMA:
    period: [5, 50]
  SMA:
    period: [10, 100]
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [18, 38]
    d_threshold: [62, 82]
  ATR:
    period: [10, 20]
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  CCI:
    period: [10, 30]
    buy_threshold: [-200, -80]
    sell_threshold: [80, 200]
  SUPERTREND:
    period: [7, 14]
    multiplier: [2.0, 4.0]

trade_visualization:
  enabled: false

terminal_monitor:
  enabled: false

parallel_evaluation:
  enabled: true
  num_workers: null
  worker_log_level: 'WARNING'
  backtest_timeout: 180

output:
  dir: 'genetic_algorithm/output/phase1/A1_multi_pair_15m'
  save_stats: true
  stats_file: 'evolution_stats.json'
  save_snapshots: true
  snapshot_interval: 1

storage:
  database: "genetic_algorithm/data/phase1_A1.db"
  strategy_dir: "user_data/strategies/phase1_A1"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_phase1_A1"
  checkpoint_interval: 5
  keep_history: true

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/phase1_A1.log"
  console: true

hall_of_fame:
  enabled: true
  max_size: 30
  inject_count: 0
  min_fitness: 0.10
  directory: "genetic_algorithm/data/hall_of_fame_phase1"

advanced:
  parallel_evaluation: false
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: false
  llm:
    enabled: false

overfit_analysis:
  thresholds:
    holdout_degradation_warning: 0.25
    holdout_degradation_overfit: 0.50
    wf_gap_warning: 0.15
    wf_gap_overfit: 0.30
    mc_robustness_warning: 0.70
    mc_robustness_overfit: 0.50
    composite_warning: 0.25
    composite_overfit: 0.50
