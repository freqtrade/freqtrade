# ============================================================================
# PHASE 1 — Run A3: Multi-Pair 1h (slow timeframe exploration)
# ============================================================================
# Same as A1 but with 1h strategy timeframe.
# 1h = fewer bars, fewer trades, faster backtests per eval.
# Can afford more generations (50) within ~3h budget.
# Lower min_trades (12) since 1h naturally produces fewer signals.
# Wider ROI/stoploss ranges since 1h moves are larger.
# ============================================================================

genetic_algorithm:
  random_seed: 300
  population_size: 40
  generations: 50
  max_runtime_minutes: 200
  mutation_rate: 0.20
  crossover_rate: 0.75
  crossover_method: 'uniform'
  elite_size: 4
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 18
  adaptive_mutation: true
  max_adaptation_factor: 2.0
  adaptation_step: 0.12
  max_mutation_rate: 0.65
  fitness_sharing: true
  sharing_radius: 0.22
  diversity_threshold: 0.15
  allow_self_crossover: false
  random_immigrants: 5
  mode: 'single_objective'

fitness_weights:
  profit: 0.28
  sharpe_ratio: 0.13
  sortino_ratio: 0.10
  profit_factor: 0.08
  drawdown: 0.12
  win_rate: 0.05
  trade_frequency: 0.06
  drawdown_duration: 0.02
  consecutive_losses: 0.02
  monthly_stability: 0.04
  cross_pair: 0.10

fitness_penalties:
  min_trades: 12           # 1h produces fewer trades
  max_drawdown: 0.35
  min_win_rate: 0.30
  complexity_weight: 0.012
  unused_indicator_weight: 0.025
  pair_loss_threshold: -5.0

backtesting:
  timerange: "20230301-20260228"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 120             # 1h backtests are fast

walk_forward:
  enabled: true
  train_days: 120          # Longer train windows for 1h (fewer bars per window)
  validation_days: 30
  step_days: 30
  mode: 'rolling'
  aggregation: 'mean'
  min_train_trades: 5      # Lower threshold for 1h
  max_windows: 10

holdout_validation:
  enabled: true
  holdout_pct: 0.15

holdout_monitoring:
  enabled: true
  interval: 3
  top_n: 3
  early_stop: true
  early_stop_threshold: 0.60
  early_stop_checks: 3
  trend_early_stop: true
  trend_checks: 3
  fitness_penalty: true
  penalty_factor: 0.8

regime_aware:
  enabled: false

monte_carlo:
  enabled: false

deflated_sharpe:
  enabled: true
  min_trades: 8
  benchmark_sr: 0.0
  skewness_correction: true

parsimony:
  enabled: true
  max_indicators: 4
  max_conditions: 5

cpcv:
  enabled: false

strategy_constraints:
  min_trades: 12
  max_drawdown: 0.35
  min_win_rate: 0.30
  timeframes: ["1h"]       # <-- 1-hour strategies
  stoploss_range: [-0.20, -0.05]   # Wider stops for 1h
  roi_range: [0.02, 0.20]          # Larger targets for 1h
  max_open_trades_range: [1, 4]
  min_exit_conditions: 1

multi_timeframe:
  enabled: false

indicators:
  available:
    - "RSI"
    - "EMA"
    - "BBANDS"
    - "ADX"
    - "MACD"
    - "SMA"
    - "SUPERTREND"
    - "STOCH"
    - "ATR"
    - "CCI"
  max_per_strategy: 4
  min_per_strategy: 2
  min_entry_conditions: 2

  RSI:
    period: [10, 28]       # Longer periods for 1h
    buy_threshold: [20, 38]
    sell_threshold: [62, 80]
  MACD:
    fast_period: [10, 20]
    slow_period: [24, 60]
    signal_period: [6, 16]
  BBANDS:
    period: [16, 40]
    std_dev: [1.5, 3.0]
  EMA:
    period: [8, 80]
  SMA:
    period: [12, 150]
  STOCH:
    k_period: [8, 25]
    d_period: [3, 14]
    k_threshold: [18, 38]
    d_threshold: [62, 82]
  ATR:
    period: [12, 25]
  ADX:
    period: [12, 25]
    threshold: [18, 40]
  CCI:
    period: [12, 35]
    buy_threshold: [-200, -80]
    sell_threshold: [80, 200]
  SUPERTREND:
    period: [8, 18]
    multiplier: [2.0, 4.5]

trade_visualization:
  enabled: false

terminal_monitor:
  enabled: false

parallel_evaluation:
  enabled: true
  num_workers: null
  worker_log_level: 'WARNING'
  backtest_timeout: 120

output:
  dir: 'genetic_algorithm/output/phase1/A3_multi_pair_1h'
  save_stats: true
  stats_file: 'evolution_stats.json'
  save_snapshots: true
  snapshot_interval: 1

storage:
  database: "genetic_algorithm/data/phase1_A3.db"
  strategy_dir: "user_data/strategies/phase1_A3"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_phase1_A3"
  checkpoint_interval: 5
  keep_history: true

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/phase1_A3.log"
  console: true

hall_of_fame:
  enabled: true
  max_size: 30
  inject_count: 0
  min_fitness: 0.10
  directory: "genetic_algorithm/data/hall_of_fame_phase1"

advanced:
  parallel_evaluation: false
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: false
  llm:
    enabled: false

overfit_analysis:
  thresholds:
    holdout_degradation_warning: 0.25
    holdout_degradation_overfit: 0.50
    wf_gap_warning: 0.15
    wf_gap_overfit: 0.30
    mc_robustness_warning: 0.70
    mc_robustness_overfit: 0.50
    composite_warning: 0.25
    composite_overfit: 0.50
