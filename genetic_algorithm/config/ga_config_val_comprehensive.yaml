# Validation Config D — Comprehensive Integration Test
#
# Goal: Everything enabled simultaneously for a full 4–5 hour stress test.
#       Tests feature interactions under sustained load.
# ALL features enabled: WF + parallel + regime + DSR + CPCV + MC + holdout + parsimony
# Dashboard: run with --dashboard to validate web events live
# Est. runtime: ~4–5 hours on 6-core/16GB

genetic_algorithm:
  random_seed: null
  population_size: 60
  generations: 25
  mutation_rate: 0.20
  max_mutation_rate: 0.35
  crossover_rate: 0.75
  crossover_method: 'uniform'
  elite_size: 6
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 12
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.15
  fitness_sharing: true
  sharing_radius: 0.25
  diversity_threshold: 0.15
  allow_self_crossover: false
  random_immigrants: 8
  mode: 'single_objective'

fitness_weights:
  profit: 0.28
  sharpe_ratio: 0.18
  sortino_ratio: 0.13
  profit_factor: 0.08
  drawdown: 0.15
  win_rate: 0.05
  trade_frequency: 0.05
  monthly_stability: 0.04
  cross_pair: 0.04

fitness_penalties:
  min_trades: 12
  max_drawdown: 0.25
  min_win_rate: 0.35
  complexity_weight: 0.015
  unused_indicator_weight: 0.02
  pair_loss_threshold: -8.0

fitness_bounds:
  profit_min: -50
  profit_max: 200
  sharpe_min: -5
  sharpe_max: 10
  sortino_min: -5
  sortino_max: 12
  profit_factor_max: 10

trade_frequency_thresholds:
  very_few: 5
  few: 10
  ideal_min: 10
  ideal_max: 50
  moderate_excess: 100

backtesting:
  timerange: "20230101-20260228"    # 38 months — full data range
  stake_amount: 0.15
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  max_open_trades: 3
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 150

walk_forward:
  enabled: true
  train_days: 120
  validation_days: 30
  step_days: 30
  mode: 'rolling'
  aggregation: 'mean'
  embargo_days: 5
  gap_penalty:
    enabled: true
    threshold: 0.10
    max_penalty: 0.5
  min_train_trades: 10
  max_windows: 12

holdout_validation:
  enabled: true
  holdout_pct: 0.15

holdout_monitoring:
  enabled: true
  interval: 2
  top_n: 5
  early_stop: true
  early_stop_threshold: 0.60
  early_stop_checks: 3
  trend_early_stop: true
  trend_checks: 3
  fitness_penalty: true
  penalty_factor: 0.8

# Regime ENABLED — adx_di_hysteresis (best performer)
regime_aware:
  enabled: true
  method: 'adx_di_hysteresis'
  benchmark_pair: null
  detection_timeframe: '4h'
  period_days: 90
  min_period_days: 60
  embargo_days: 5
  segments_per_regime: 3
  holdout_ratio: 0.20
  aggregation: 'harmonic_mean'
  cvar_alpha: 0.20
  regime_weights:
    bullish: 1.0
    bearish: 1.0
    sideways: 1.0

strategy_constraints:
  min_trades: 15
  max_drawdown: 0.20
  min_win_rate: 0.35
  timeframes: ["15m", "1h"]
  stoploss_range: [-0.10, -0.04]
  roi_range: [0.02, 0.08]
  max_open_trades_range: [2, 5]
  min_exit_conditions: 1

short_selling:
  enabled: false

multi_timeframe:
  enabled: false

indicators:
  available:
    - "RSI"
    - "MACD"
    - "BBANDS"
    - "EMA"
    - "SMA"
    - "ADX"
    - "SUPERTREND"
    - "PSAR"
    - "CMF"
    - "CDL_ENGULFING"
    - "CDL_HAMMER"
    - "CDL_DOJI"
    - "CDL_MORNINGSTAR"
    - "CDL_EVENINGSTAR"
    - "CDL_SHOOTINGSTAR"
    - "CDL_HARAMI"
  max_per_strategy: 4
  min_per_strategy: 2

  RSI:
    period: [7, 21]
    buy_threshold: [20, 40]
    sell_threshold: [60, 80]
  MACD:
    fast_period: [8, 21]
    slow_period: [21, 50]
    signal_period: [5, 14]
  BBANDS:
    period: [15, 30]
    std_dev: [1.5, 3.0]
  EMA:
    period: [5, 50]
  SMA:
    period: [10, 100]
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  SUPERTREND:
    period: [7, 14]
    multiplier: [2.0, 4.0]
  PSAR:
    acceleration: [0.01, 0.05]
    maximum: [0.1, 0.3]
  CMF:
    period: [10, 25]
    buy_threshold: [0.05, 0.2]
    sell_threshold: [-0.2, -0.05]
  CDL_MORNINGSTAR:
    penetration: [0.0, 0.3]
  CDL_EVENINGSTAR:
    penetration: [0.0, 0.3]

storage:
  database: "genetic_algorithm/data/strategies.db"
  strategy_dir: "user_data/strategies/ga_generated"
  checkpoint_dir: "genetic_algorithm/data/checkpoints"
  checkpoint_interval: 3          # Frequent checkpoints for crash recovery
  keep_history: true

hall_of_fame:
  directory: "genetic_algorithm/data/hall_of_fame"
  max_size: 50
  min_fitness: 0.0
  inject_count: 3

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/ga.log"
  console: true

terminal_monitor:
  enabled: true
  default_mode: "simple"
  refresh_rate: 4
  history_window: 25

visualization:
  enabled: true
  update_interval: 1
  plots:
    - "fitness_evolution"
    - "diversity"
    - "top_strategies"
  output_dir: "genetic_algorithm/output/val_comprehensive/plots"

parallel_evaluation:
  enabled: true
  num_workers: 8                  # 8 of 12 cores — leaves headroom for dashboard
  worker_log_level: 'WARNING'

deflated_sharpe:
  enabled: true
  penalty_weight: 0.15
  min_trades: 20
  significance: 0.05

# CPCV ENABLED with more groups for better PBO estimate
cpcv:
  enabled: true
  n_groups: 8                     # More blocks for 38 months of data
  n_test_groups: 2
  purge_pct: 0.01
  embargo_pct: 0.01
  max_paths: 100
  pbo_threshold: 0.5
  penalty_weight: 0.20

monte_carlo:
  enabled: true
  num_permutations: 25
  methods:
    - bootstrap
    - shuffle
    - slippage_jitter

parsimony:
  enabled: true
  epsilon: 0.02
  max_removals: 1

dynamic_bounds:
  enabled: true
  mutation_strength: 0.1

overfit_analysis:
  thresholds:
    holdout_degradation_warning: 0.25
    holdout_degradation_overfit: 0.50
    wf_gap_warning: 0.15
    wf_gap_overfit: 0.30
    mc_robustness_warning: 0.70
    mc_robustness_overfit: 0.50
    composite_warning: 0.25
    composite_overfit: 0.50
