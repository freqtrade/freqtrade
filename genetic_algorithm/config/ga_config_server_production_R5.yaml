# ============================================================================
# PRODUCTION RUN: Scaled R5 Multi-Pair — Server-Optimized
# ============================================================================
# Based on: R5 Multi-Pair (benchmark v2 WINNER — 5/5 SAFE, 0.4127 fitness)
# Scaled:   pop 25→80, gen 20→50 for deeper evolution
# Server:   i5-9500T 6 cores / 16 GB RAM / NVMe — 90% utilization
#
# Key changes from benchmark R5:
#   - population_size: 25 → 80 (4x, sweet spot for 5-worker parallelism)
#   - generations: 20 → 50 (2.5x, deeper search)
#   - 5 pairs (added XRP/USDT vs R5's 4)
#   - Frequent checkpoints (every 3 gens for remote safety)
#   - 24h safety cap
#   - Convergence patience 20 (adjusted for larger search)
#   - Monte Carlo enabled (now that we have compute budget)
#
# Expected runtime: ~12-20 hours
#
# Usage:
#   cd /home/periklis/projects/trading/freqtradeForkGA
#   source .venv/bin/activate
#   python genetic_algorithm/run_ga.py \
#     --config genetic_algorithm/config/ga_config_server_production_R5.yaml \
#     --no-monitor --yes
# ============================================================================

# === Genetic Algorithm Parameters ===
genetic_algorithm:
  random_seed: null  # Different seed each run for exploration
  population_size: 80
  generations: 50
  max_runtime_minutes: 1440  # 24h safety cap
  mutation_rate: 0.20
  crossover_rate: 0.75
  crossover_method: 'uniform'
  elite_size: 8  # ~10% of population
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 20
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.12
  max_mutation_rate: 0.65
  fitness_sharing: true
  sharing_radius: 0.22
  diversity_threshold: 0.15
  allow_self_crossover: false
  random_immigrants: 8  # ~10% of population
  mode: 'single_objective'

# === Fitness Function Weights ===
# Same proven weights from R5
fitness_weights:
  profit: 0.30
  sharpe_ratio: 0.12
  sortino_ratio: 0.10
  profit_factor: 0.08
  drawdown: 0.12
  win_rate: 0.05
  trade_frequency: 0.05
  drawdown_duration: 0.02
  consecutive_losses: 0.02
  monthly_stability: 0.04
  cross_pair: 0.10

# === Fitness Penalties ===
fitness_penalties:
  min_trades: 15
  max_drawdown: 0.35
  min_win_rate: 0.30
  complexity_weight: 0.008
  unused_indicator_weight: 0.02
  pair_loss_threshold: -5.0

# === Backtesting Configuration ===
backtesting:
  timerange: "20230301-20260228"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 180

# === Walk-Forward Validation ===
walk_forward:
  enabled: true
  train_days: 90
  validation_days: 30
  step_days: 30
  mode: 'rolling'
  aggregation: 'harmonic_mean'  # Stricter than R5's 'mean'
  min_train_trades: 10
  max_windows: 10

# === Holdout Validation ===
holdout_validation:
  enabled: true
  holdout_pct: 0.15

# === Holdout Monitoring ===
holdout_monitoring:
  enabled: true
  interval: 3
  top_n: 5  # Monitor top 5 (more than R5's 3 given larger pop)
  early_stop: true
  early_stop_threshold: 0.60
  early_stop_checks: 3
  trend_early_stop: true
  trend_checks: 3
  fitness_penalty: true
  penalty_factor: 0.8

# === Regime-Aware (disabled — using multi-pair regularization instead) ===
regime_aware:
  enabled: false

# === Monte Carlo Robustness ===
monte_carlo:
  enabled: true
  num_permutations: 50
  methods:
    - 'bootstrap'
    - 'shuffle'
    - 'slippage'
  confidence_level: 0.95
  slippage_range: [0.0005, 0.002]
  min_robustness: 0.60

# === Deflated Sharpe Ratio ===
deflated_sharpe:
  enabled: true
  min_trades: 10
  benchmark_sr: 0.0
  skewness_correction: true

# === Parsimony Pressure ===
parsimony:
  enabled: true
  max_indicators: 5
  max_conditions: 6

# === CPCV ===
cpcv:
  enabled: false

# === Strategy Constraints ===
strategy_constraints:
  min_trades: 15
  max_drawdown: 0.35
  min_win_rate: 0.30
  timeframes: ["15m"]
  stoploss_range: [-0.15, -0.03]
  roi_range: [0.01, 0.12]
  max_open_trades_range: [1, 4]
  min_exit_conditions: 1

# === Multi-Timeframe (disabled for now) ===
multi_timeframe:
  enabled: false

# === Available Indicators ===
indicators:
  available:
    - "RSI"
    - "EMA"
    - "BBANDS"
    - "ADX"
    - "MACD"
    - "SMA"
    - "SUPERTREND"
    - "STOCH"
    - "ATR"
    - "CCI"
  max_per_strategy: 4
  min_per_strategy: 2
  min_entry_conditions: 2

  RSI:
    period: [7, 21]
    buy_threshold: [20, 38]
    sell_threshold: [62, 80]
  MACD:
    fast_period: [8, 18]
    slow_period: [21, 50]
    signal_period: [5, 14]
  BBANDS:
    period: [14, 30]
    std_dev: [1.5, 3.0]
  EMA:
    period: [5, 50]
  SMA:
    period: [10, 100]
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [18, 38]
    d_threshold: [62, 82]
  ATR:
    period: [10, 20]
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  CCI:
    period: [10, 30]
    buy_threshold: [-200, -80]
    sell_threshold: [80, 200]
  SUPERTREND:
    period: [7, 14]
    multiplier: [2.0, 4.0]

# === Visualization ===
trade_visualization:
  enabled: false

terminal_monitor:
  enabled: false

# === Parallel Evaluation ===
parallel_evaluation:
  enabled: true
  num_workers: 5  # 90% of 6 cores — leave 1 for OS/SSH/dashboard
  worker_log_level: 'WARNING'
  backtest_timeout: 180

# === Output ===
output:
  dir: 'genetic_algorithm/output/production/R5_scaled'
  save_stats: true
  stats_file: 'evolution_stats.json'
  save_snapshots: true
  snapshot_interval: 1

# === Storage & Checkpoints ===
storage:
  database: "genetic_algorithm/data/production_R5_scaled.db"
  strategy_dir: "user_data/strategies/production_R5_scaled"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_production_R5"
  checkpoint_interval: 3  # Frequent for remote safety
  keep_history: true

# === Logging ===
logging:
  level: "INFO"
  file: "genetic_algorithm/logs/production_R5_scaled.log"
  console: true

# === Hall of Fame ===
hall_of_fame:
  enabled: true
  max_size: 50
  inject_count: 3  # Re-inject top 3 from HoF each generation
  min_fitness: 0.10
  directory: "genetic_algorithm/data/hall_of_fame_production_R5"

# === Advanced ===
advanced:
  parallel_evaluation: false
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: false
  llm:
    enabled: false

# === Overfit Analysis Thresholds ===
overfit_analysis:
  thresholds:
    holdout_degradation_warning: 0.25
    holdout_degradation_overfit: 0.50
    wf_gap_warning: 0.15
    wf_gap_overfit: 0.30
    mc_robustness_warning: 0.70
    mc_robustness_overfit: 0.50
    composite_warning: 0.25
    composite_overfit: 0.50
