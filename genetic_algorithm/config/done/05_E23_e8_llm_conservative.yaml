# ============================================================================
# WAVE 5 — E23: E8 with Conservative LLM Guidance
# ============================================================================
# Purpose: Test LLM-guided evolution WITH E8's strict anti-overfit framework.
#          E6 (LLM, mut=0.20, no strict constraints) scored 0.361 (3/5 SAFE).
#          E8 (no LLM, strict constraints) scored 0.114 (5/5 SAFE).
#          This combines E8's robustness framework with LLM guidance,
#          using LOWER LLM influence than E6 to stay conservative.
#
# Changes from E8:
#   - advanced.enable_llm: false → true
#   - Added full LLM config (conservative ratios vs E6)
#   - LLM seed_ratio: 0.25 (E6 was 0.40)
#   - LLM immigrant_ratio: 0.30 (E6 was 0.60)
#   - random_seed: 88 → 230
#
# Requires: GROQ_API_KEY environment variable set
#
# Expected: LLM may discover strategy structures GA wouldn't find alone.
#           Conservative settings keep LLM from overwhelming the GA process.
# ============================================================================

genetic_algorithm:
  random_seed: 230
  population_size: 15
  generations: 12
  max_runtime_minutes: 300
  mutation_rate: 0.15
  crossover_rate: 0.80
  crossover_method: 'uniform'
  elite_size: 3
  tournament_size: 4
  selection_method: 'tournament'
  convergence_patience: 6
  adaptive_mutation: true
  max_adaptation_factor: 2.0
  adaptation_step: 0.10
  max_mutation_rate: 0.35
  fitness_sharing: true
  sharing_radius: 0.30
  diversity_threshold: 0.20
  allow_self_crossover: false
  random_immigrants: 1
  mode: 'single_objective'

fitness_weights:
  profit: 0.25
  sharpe_ratio: 0.18
  sortino_ratio: 0.14
  profit_factor: 0.10
  drawdown: 0.18
  win_rate: 0.05
  trade_frequency: 0.04
  monthly_stability: 0.06
  cross_pair: 0.00

fitness_penalties:
  min_trades: 15
  max_drawdown: 0.20
  min_win_rate: 0.35
  complexity_weight: 0.020
  unused_indicator_weight: 0.025
  pair_loss_threshold: -5.0

backtesting:
  timerange: "20230301-20260228"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "SOL/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 120

walk_forward:
  enabled: true
  train_days: 120
  validation_days: 30
  step_days: 30
  mode: 'rolling'
  aggregation: 'trimmed_mean'
  min_train_trades: 12
  max_windows: 8
  embargo_days: 3

holdout_validation:
  enabled: true
  holdout_pct: 0.20

holdout_monitoring:
  enabled: true
  interval: 2
  top_n: 5
  early_stop: true
  early_stop_threshold: 0.50
  early_stop_checks: 3
  trend_early_stop: true
  trend_checks: 3
  fitness_penalty: true
  penalty_factor: 0.60

regime_aware:
  enabled: false

monte_carlo:
  enabled: true
  num_permutations: 15
  methods:
    - 'bootstrap'
    - 'shuffle'
  confidence_level: 0.95
  min_robustness: 0.55

deflated_sharpe:
  enabled: true
  min_trades: 12
  benchmark_sr: 0.0
  skewness_correction: true

parsimony:
  enabled: true
  max_indicators: 3
  max_conditions: 4

cpcv:
  enabled: false

strategy_constraints:
  min_trades: 15
  max_drawdown: 0.20
  min_win_rate: 0.35
  timeframes: ["15m"]
  stoploss_range: [-0.08, -0.03]
  roi_range: [0.01, 0.06]
  max_open_trades_range: [1, 3]
  min_exit_conditions: 1

multi_timeframe:
  enabled: false

indicators:
  available:
    - "RSI"
    - "EMA"
    - "BBANDS"
    - "ADX"
    - "MACD"
    - "SMA"
    - "SUPERTREND"
    - "STOCH"
    - "ATR"
    - "CCI"
    - "CMF"
    - "VROC"
  max_per_strategy: 3
  min_per_strategy: 2
  min_entry_conditions: 2

  RSI:
    period: [7, 21]
    buy_threshold: [22, 35]
    sell_threshold: [65, 80]
  MACD:
    fast_period: [8, 18]
    slow_period: [21, 50]
    signal_period: [5, 14]
  BBANDS:
    period: [14, 30]
    std_dev: [1.8, 2.8]
  EMA:
    period: [8, 40]
  SMA:
    period: [15, 80]
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [18, 35]
    d_threshold: [65, 82]
  SUPERTREND:
    period: [7, 14]
    multiplier: [2.0, 4.0]
  CMF:
    period: [14, 21]
    threshold: [-0.15, 0.15]
  VROC:
    period: [10, 25]
    threshold: [-15, 15]

trade_visualization:
  enabled: false

terminal_monitor:
  enabled: false

parallel_evaluation:
  enabled: false

output:
  dir: 'genetic_algorithm/output/exploration/wave5/05_E23_e8_llm_conservative'
  save_stats: true
  stats_file: 'evolution_stats.json'
  save_snapshots: true
  snapshot_interval: 1

storage:
  database: "genetic_algorithm/data/wave5_E23_e8_llm_conservative.db"
  strategy_dir: "user_data/strategies/wave5_E23_e8_llm_conservative"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_wave5_E23"
  checkpoint_interval: 3
  keep_history: true

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/wave5_E23_e8_llm_conservative.log"
  console: true

hall_of_fame:
  enabled: true
  size: 20
  min_fitness: 0.05
  directory: "genetic_algorithm/data/hall_of_fame_wave5_E23"

advanced:
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: true              # ← KEY CHANGE: LLM enabled

  llm:
    enabled: true
    provider: "groq"
    api_key: ""                 # Uses GROQ_API_KEY env var
    model: "llama-3.3-70b-versatile"
    temperature: 0.7
    max_tokens: 4096
    timeout: 60
    max_retries: 3
    retry_delay: 2.0
    min_call_interval: 1.0

    # Conservative LLM influence (lower than E6)
    seed_ratio: 0.25            # E6 was 0.40 — less LLM in initial pop
    immigrant_ratio: 0.30       # E6 was 0.60 — less LLM immigrants
    immigrants_per_generation: 1 # E6 was 2 — fewer per gen

    # LLM-Guided Mutation (same as E6)
    mutation_enabled: true
    mutation_probability: 0.15
    mutation_top_k: 3
    mutation_stagnation_threshold: 3

    # Batching
    batch_enabled: true
    max_batch_size: 3

    # Budget control
    max_calls_per_generation: 8  # E6 was 10 — slightly tighter budget
    max_calls_per_run: 80        # E6 was 100

overfit_analysis:
  thresholds:
    holdout_degradation_warning: 0.20
    holdout_degradation_overfit: 0.40
    wf_gap_warning: 0.12
    wf_gap_overfit: 0.25
    mc_robustness_warning: 0.75
    mc_robustness_overfit: 0.55
    composite_warning: 0.20
    composite_overfit: 0.40
