# LLM Strength Test Config — ~30 Minute Run (No Walk-Forward)
#
# Goal:
#   Stress-test LLM contribution with enough runtime and population depth to
#   see whether LLM-guided evolution can outperform baseline randomness.
#
# Runtime target:
#   ~25-35 minutes (machine-dependent)
#
# Key design choices:
#   - Walk-forward disabled for speed
#   - Larger population/generations vs quick smoke test
#   - LLM immigrants > random immigrants each generation
#
# Usage:
#   cd /home/kali/trading/freqtradeForkGA
#   source .venv/bin/activate
#   python -m genetic_algorithm.run_ga --config genetic_algorithm/config/ga_config_llm_strength_30min.yaml --yes

# === Genetic Algorithm ===
genetic_algorithm:
  random_seed: 42

  # Increased workload vs llm_test to approach ~30 mins
  population_size: 32
  generations: 30

  mutation_rate: 0.15
  crossover_rate: 0.7
  elite_size: 3
  tournament_size: 3
  selection_method: 'tournament'

  convergence_patience: 15
  adaptive_mutation: false

  fitness_sharing: false
  diversity_threshold: 0.15
  allow_self_crossover: false

  # Immigrant slots per generation.
  # With immigrant_ratio=0.75 below, this yields:
  #   LLM immigrants: int(4 * 0.75) = 3
  #   Random immigrants: 1
  # => LLM immigrants are ALWAYS more than random immigrants.
  random_immigrants: 4

  mode: 'single_objective'

# === Fitness Weights ===
fitness_weights:
  profit: 0.25
  sharpe_ratio: 0.15
  sortino_ratio: 0.10
  profit_factor: 0.10
  drawdown: 0.20
  win_rate: 0.10
  trade_frequency: 0.10

fitness_penalties:
  min_trades: 5
  max_drawdown: 0.30
  min_win_rate: 0.25
  complexity_weight: 0.01

# === Backtesting ===
backtesting:
  timerange: "20251001-20260101"

  stake_amount: 16
  pairs:
    - "BTC/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 45

# === Walk-Forward ===
walk_forward:
  enabled: false

# === Strategy Constraints ===
strategy_constraints:
  min_trades: 5
  max_drawdown: 0.30
  min_win_rate: 0.25
  timeframes: ["15m", "1h"]
  stoploss_range: [-0.15, -0.03]
  roi_range: [0.01, 0.10]
  max_open_trades_range: [1, 5]

# === Multi-Timeframe ===
multi_timeframe:
  enabled: true
  available: ['1h', '4h']
  max_timeframes: 2
  higher_timeframe_preference:
    - 'EMA'
    - 'RSI'
    - 'ADX'
    - 'BBANDS'

# === Indicators ===
indicators:
  available:
    - "RSI"
    - "MACD"
    - "BBANDS"
    - "EMA"
    - "SMA"
    - "STOCH"
    - "ATR"
    - "ADX"
    - "CCI"
  max_per_strategy: 4
  min_per_strategy: 1

  RSI:
    period: [7, 21]
    buy_threshold: [20, 40]
    sell_threshold: [60, 80]
  MACD:
    fast_period: [8, 21]
    slow_period: [21, 50]
    signal_period: [5, 14]
  BBANDS:
    period: [15, 30]
    std_dev: [1.5, 3.0]
  EMA:
    period: [5, 50]
  SMA:
    period: [10, 100]
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [20, 40]
    d_threshold: [60, 80]
  ATR:
    period: [10, 20]
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  CCI:
    period: [10, 30]
    buy_threshold: [-200, -100]
    sell_threshold: [100, 200]

# === Storage ===
storage:
  database: "genetic_algorithm/data/strategies_llm_strength_30min.db"
  strategy_dir: "user_data/strategies/ga_llm_strength_30min"
  checkpoint_dir: "genetic_algorithm/data/checkpoints"
  checkpoint_interval: 5
  keep_history: true

# === Logging ===
logging:
  level: "DEBUG"
  file: "genetic_algorithm/logs/ga_llm_strength_30min.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# === Visualization ===
visualization:
  enabled: false

# === Advanced ===
advanced:
  parallel_evaluation: false
  num_workers: 1
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: true

  llm:
    enabled: true
    provider: "groq"
    api_key: ""                 # Uses GROQ_API_KEY from .env/environment
    model: "llama-3.3-70b-versatile"
    temperature: 0.7
    max_retries: 2
    timeout: 45
    min_call_interval: 1.0

    # Increased LLM contribution:
    # initial population -> ~60% from LLM (of non-seeded slots)
    seed_ratio: 0.6

    # immigrants -> LLM majority every generation (3 LLM vs 1 random with settings above)
    immigrant_ratio: 0.75

  island_model:
    enabled: false
