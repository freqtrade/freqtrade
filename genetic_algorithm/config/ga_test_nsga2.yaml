# GA Test Config 2 - NSGA-II Multi-Objective
# Test: Multi-objective optimization with NSGA-II

genetic_algorithm:
  random_seed: 101
  population_size: 10
  generations: 3
  mutation_rate: 0.2
  crossover_rate: 0.7
  elite_size: 3
  tournament_size: 3
  selection_method: 'tournament'  # Will be overridden to nsga2
  convergence_patience: 10
  adaptive_mutation: false        # Disable for simplicity
  fitness_sharing: false
  sharing_radius: 0.3
  diversity_threshold: 0.15
  allow_self_crossover: false
  random_immigrants: 1
  mode: 'nsga2'                   # Enable NSGA-II

nsga2:
  objectives:
    - name: 'profit'
      type: 'maximize'
      scale: 100.0
    - name: 'max_drawdown'
      type: 'minimize'
      scale: 1.0
    - name: 'sharpe_ratio'
      type: 'maximize'
      scale: 3.0
  pareto_front_size: 10

progress:
  enabled: true
  show_fitness: true
  show_profit: true
  update_every: 1

backtesting:
  pairs:
    - ETH/USDT
  timerange: '20250601-20260101'
  stake_amount: 100
  max_open_trades: 3
  fee: 0.001
  exchange: binance
  datadir: data
  auto_download_data: true

walk_forward:
  enabled: false

strategy:
  min_buy_conditions: 1
  max_buy_conditions: 2
  min_sell_conditions: 1
  max_sell_conditions: 2
  base_timeframe: '5m'
  timeframes: ['5m', '15m']

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
  max_indicators: 4

multi_timeframe:
  enabled: false
  available_timeframes: ['5m', '15m']
  max_informative_timeframes: 1
  mutation_probability: 0.1

logging:
  level: INFO
  console: true

fitness_weights:
  profit: 0.35
  sharpe_ratio: 0.20
  drawdown: 0.20
  win_rate: 0.15
  trade_frequency: 0.10

fitness_penalties:
  min_trades: 10
  max_drawdown: 0.30
  min_win_rate: 0.35
  complexity_weight: 0.01
