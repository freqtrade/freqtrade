# LLM Feature Validation Config — Fast Test Run
#
# Purpose: Validate that Grok LLM strategy generation works end-to-end
# Expected runtime: ~10-15 minutes (pop 12 × 5 gens, no walk-forward)
#
# What this tests:
#   1. LLM connects to Grok API and generates valid JSON
#   2. JSON is parsed into StrategyGene objects
#   3. LLM strategies survive GA evaluation (backtest runs)
#   4. LLM immigrants are injected each generation
#   5. Evolution completes with mixed LLM + random strategies
#
# Usage:
#   cd /home/kali/trading/freqtradeForkGA
#   source .venv/bin/activate
#   python genetic_algorithm/run_ga.py --config genetic_algorithm/config/ga_config_llm_test.yaml
#
# What to look for in logs:
#   - "LLM STRATEGY DESIGNER ENABLED"
#   - "Generated N LLM seed strategies"
#   - "LLM immigrant injection: N strategies"
#   - No "Failed to create LLM provider" errors

# === Genetic Algorithm — Small & Fast ===
genetic_algorithm:
  random_seed: 42              # Reproducible for debugging

  population_size: 12          # Tiny pop — just enough to see LLM vs random
  generations: 5               # 5 gens is enough to see immigrant injection work

  mutation_rate: 0.15
  crossover_rate: 0.7
  elite_size: 2                # Keep top 2 each gen
  tournament_size: 3
  selection_method: 'tournament'

  convergence_patience: 10     # Won't trigger in 5 gens
  adaptive_mutation: false     # Keep it simple for testing

  fitness_sharing: false       # Disabled — unnecessary for validation
  diversity_threshold: 0.15
  allow_self_crossover: false

  # 3 random immigrants → 2 will be replaced by LLM (immigrant_ratio: 0.5 → 1.5 = 1 LLM)
  random_immigrants: 3

  mode: 'single_objective'

# === Fitness Weights — Standard ===
fitness_weights:
  profit: 0.25
  sharpe_ratio: 0.15
  sortino_ratio: 0.10
  profit_factor: 0.10
  drawdown: 0.20
  win_rate: 0.10
  trade_frequency: 0.10

fitness_penalties:
  min_trades: 3                # Very low bar — we just want trades to happen
  max_drawdown: 0.30           # Relaxed for testing
  min_win_rate: 0.25
  complexity_weight: 0.01

# === Backtesting — Short Period ===
backtesting:
  # 3 months of data — fast backtests
  timerange: "20251001-20260101"

  stake_amount: 16
  pairs:
    - "BTC/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 30                  # 30s timeout — fail fast

# === Walk-Forward — DISABLED for speed ===
walk_forward:
  enabled: false

# === Strategy Constraints — Relaxed ===
strategy_constraints:
  min_trades: 3
  max_drawdown: 0.30
  min_win_rate: 0.25
  timeframes: ["15m", "1h"]
  stoploss_range: [-0.15, -0.03]
  roi_range: [0.01, 0.10]
  max_open_trades_range: [1, 5]

# === Multi-Timeframe — Enabled (LLM should use this) ===
multi_timeframe:
  enabled: true
  available: ['1h', '4h']
  max_timeframes: 2
  higher_timeframe_preference:
    - 'EMA'
    - 'RSI'
    - 'ADX'
    - 'BBANDS'

# === Indicators — All available for LLM ===
indicators:
  available:
    - "RSI"
    - "MACD"
    - "BBANDS"
    - "EMA"
    - "SMA"
    - "STOCH"
    - "ATR"
    - "ADX"
    - "CCI"
  max_per_strategy: 4
  min_per_strategy: 1

  RSI:
    period: [7, 21]
    buy_threshold: [20, 40]
    sell_threshold: [60, 80]
  MACD:
    fast_period: [8, 21]
    slow_period: [21, 50]
    signal_period: [5, 14]
  BBANDS:
    period: [15, 30]
    std_dev: [1.5, 3.0]
  EMA:
    period: [5, 50]
  SMA:
    period: [10, 100]
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [20, 40]
    d_threshold: [60, 80]
  ATR:
    period: [10, 20]
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  CCI:
    period: [10, 30]
    buy_threshold: [-200, -100]
    sell_threshold: [100, 200]

# === Storage ===
storage:
  database: "genetic_algorithm/data/strategies_llm_test.db"
  strategy_dir: "user_data/strategies/ga_llm_test"
  checkpoint_dir: "genetic_algorithm/data/checkpoints"
  checkpoint_interval: 5
  keep_history: true

# === Logging ===
logging:
  level: "DEBUG"               # DEBUG to see all LLM request/response details
  file: "genetic_algorithm/logs/ga_llm_test.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# === Visualization — Disabled for speed ===
visualization:
  enabled: false

# === Advanced — LLM ENABLED ===
advanced:
  parallel_evaluation: false
  num_workers: 1
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: true             # <-- THE KEY SETTING

  llm:
    enabled: true
    provider: "groq"           # Groq (groq.com) — fast LPU inference
    api_key: ""                # Uses GROQ_API_KEY from .env / environment
    model: "llama-3.3-70b-versatile"  # Fast, capable model
    temperature: 0.7
    max_retries: 2             # Fail fast on test
    timeout: 30
    min_call_interval: 1.0     # 1s between API calls (rate limiting)

    # Ratios — what fraction of seed/immigrant slots to fill with LLM
    seed_ratio: 0.4            # 40% of initial population from LLM (≈5 of 12)
    immigrant_ratio: 0.5       # 50% of immigrants from LLM (≈1-2 of 3)

  island_model:
    enabled: false
