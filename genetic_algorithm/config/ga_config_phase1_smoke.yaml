# ============================================================================
# GA Configuration: PHASE 1 - SMOKE TEST (~10 minutes)
# ============================================================================
#
# PURPOSE:
#   Validate all three new feature areas work together without crashes:
#   1. ML Regime Detection
#   2. Evolution Flow Improvements
#   3. LLM Integration
#
# EXPECTED RUNTIME: ~10 minutes
#
# RUN COMMAND:
#   cd /home/kali/trading/freqtradeForkGA
#   source .venv/bin/activate
#   python genetic_algorithm/run_ga.py \
#     --config genetic_algorithm/config/ga_config_phase1_smoke.yaml --yes
#
# SUCCESS CRITERIA:
#   - "LLM STRATEGY DESIGNER ENABLED" in logs
#   - "Regime segments detected" in logs
#   - No exceptions or backtest timeouts
#   - All 5 generations complete
#
# ============================================================================

genetic_algorithm:
  random_seed: 42
  population_size: 12
  generations: 5
  mutation_rate: 0.18
  crossover_rate: 0.7
  crossover_method: 'uniform'
  elite_size: 2
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 10
  adaptive_mutation: true
  max_adaptation_factor: 2.0
  adaptation_step: 0.15
  max_mutation_rate: 0.35
  fitness_sharing: true
  sharing_radius: 0.20
  diversity_threshold: 0.15
  allow_self_crossover: false
  random_immigrants: 3
  mode: 'single_objective'

fitness_weights:
  profit: 0.28
  sharpe_ratio: 0.15
  sortino_ratio: 0.10
  profit_factor: 0.10
  drawdown: 0.17
  win_rate: 0.10
  trade_frequency: 0.10

fitness_penalties:
  min_trades: 3
  max_drawdown: 0.35
  min_win_rate: 0.25
  complexity_weight: 0.008
  unused_indicator_weight: 0.015

fitness_bounds:
  profit_min: -50
  profit_max: 200
  sharpe_min: -5
  sharpe_max: 10
  sortino_min: -5
  sortino_max: 12
  profit_factor_max: 10

trade_frequency_thresholds:
  very_few: 3
  few: 8
  ideal_min: 8
  ideal_max: 40
  moderate_excess: 80

# === Backtesting — Short Period for Speed ===
backtesting:
  timerange: "20251001-20260101"  # 3 months
  stake_amount: 100
  pairs:
    - "BTC/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 60

# === Walk-Forward — DISABLED for speed ===
walk_forward:
  enabled: false

# === Holdout Validation ===
holdout_validation:
  enabled: true
  holdout_pct: 0.15

# === Regime Detection — ENABLED (ensemble method) ===
regime_aware:
  enabled: true
  method: 'ensemble'
  benchmark_pair: null
  detection_timeframe: '1h'
  period_days: 30
  min_period_days: 20
  embargo_days: 2
  segments_per_regime: 2
  holdout_ratio: 0.10
  aggregation: 'mean'
  cvar_alpha: 0.20
  min_segment_trades: 3
  regime_weights:
    bullish: 1.0
    bearish: 0.8
    sideways: 1.0

# === Strategy Constraints ===
strategy_constraints:
  min_trades: 3
  max_drawdown: 0.30
  min_win_rate: 0.25
  timeframes: ["15m", "1h"]
  stoploss_range: [-0.12, -0.03]
  roi_range: [0.02, 0.08]
  max_open_trades_range: [1, 4]

# === Multi-Timeframe ===
multi_timeframe:
  enabled: true
  available: ['1h', '4h']
  max_timeframes: 2
  higher_timeframe_preference:
    - 'EMA'
    - 'RSI'
    - 'ADX'

# === Indicators ===
indicators:
  available:
    - "RSI"
    - "MACD"
    - "BBANDS"
    - "EMA"
    - "SMA"
    - "ADX"
    - "ATR"
  max_per_strategy: 3
  min_per_strategy: 1

  RSI:
    period: [10, 21]
    buy_threshold: [25, 40]
    sell_threshold: [60, 75]
  MACD:
    fast_period: [10, 18]
    slow_period: [22, 40]
    signal_period: [6, 12]
  BBANDS:
    period: [15, 25]
    std_dev: [1.8, 2.5]
  EMA:
    period: [8, 40]
  SMA:
    period: [15, 80]
  ADX:
    period: [12, 18]
    threshold: [22, 35]
  ATR:
    period: [12, 18]

# === Storage ===
storage:
  database: "genetic_algorithm/data/strategies_phase1_smoke.db"
  strategy_dir: "user_data/strategies/ga_phase1_smoke"
  checkpoint_dir: "genetic_algorithm/data/checkpoints"
  checkpoint_interval: 2
  keep_history: true

# === Logging ===
logging:
  level: "DEBUG"
  file: "genetic_algorithm/logs/ga_phase1_smoke.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# === Visualization ===
visualization:
  enabled: false

# === Advanced — LLM ENABLED ===
advanced:
  parallel_evaluation: true
  num_workers: 4
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: true

  llm:
    enabled: true
    provider: "groq"
    api_key: ""  # Uses GROQ_API_KEY from environment
    model: "llama-3.3-70b-versatile"
    temperature: 0.7
    max_retries: 2
    timeout: 45
    min_call_interval: 1.0

    # Seeding: 30% of initial population from LLM
    seed_ratio: 0.3

    # Immigrants: 50% of random immigrants from LLM
    immigrant_ratio: 0.5

    # LLM-guided mutation: ENABLED
    mutation_enabled: true
    mutation_probability: 0.1
    mutation_top_k: 2
    mutation_stagnation_threshold: 2

    # Budget limits (low for smoke test)
    max_calls_per_generation: 8
    max_calls_per_run: 50

  island_model:
    enabled: false
