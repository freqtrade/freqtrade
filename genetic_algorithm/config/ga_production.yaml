# GA Production Config - Ready to Run with Progress Bar
# Run: python -m genetic_algorithm.run_ga --config genetic_algorithm/config/ga_production.yaml

genetic_algorithm:
  random_seed: 2026              # Reproducible results
  population_size: 60            # Decent population size
  generations: 6                # 10 generations to see evolution
  mutation_rate: 0.18            # Moderate mutation
  crossover_rate: 0.75           # High crossover for exploration
  elite_size: 5                  # Keep top 5 strategies
  tournament_size: 4             # Strong selection pressure
  selection_method: 'tournament'
  convergence_patience: 15
  adaptive_mutation: true        # Increase mutation if stagnating
  fitness_sharing: false         # Focus on best, not diversity
  sharing_radius: 0.3
  diversity_threshold: 0.15
  allow_self_crossover: false
  random_immigrants: 1           # Small diversity injection
  mode: 'single_objective'

# Progress Bar Configuration
progress:
  enabled: true                  # Enable/disable progress bar
  show_fitness: true             # Show best fitness in progress bar
  show_profit: true              # Show best profit in progress bar
  update_every: 1                # Update every N individuals (1 = real-time)

backtesting:
  pairs:
    - ETH/USDT                   # Main pair
    - BTC/USDT                   # Secondary pair
  timerange: '20240601-20260220' # ~13 months data
  stake_amount: 100
  max_open_trades: 5
  fee: 0.002
  exchange: binance
  datadir: data
  auto_download_data: true

walk_forward:
  enabled: false                 # Disable for speed

strategy:
  min_buy_conditions: 1
  max_buy_conditions: 3
  min_sell_conditions: 1
  max_sell_conditions: 3
  base_timeframe: '5m'
  timeframes: ['5m', '15m', '1h']   # All timeframes strategies may use

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
    - 'SMA'
    - 'STOCH'
    - 'ADX'
  max_indicators: 5

multi_timeframe:
  enabled: false
  available_timeframes: ['5m', '15m', '1h']
  max_informative_timeframes: 1
  mutation_probability: 0.1

logging:
  level: INFO
  console: true
  file: logs/ga_run.log

# Fitness weights - balanced with profit focus
fitness_weights:
  profit: 0.35
  sharpe_ratio: 0.20
  drawdown: 0.20
  win_rate: 0.15
  trade_frequency: 0.10

fitness_penalties:
  min_trades: 15
  max_drawdown: 0.30
  min_win_rate: 0.35
  complexity_weight: 0.01
