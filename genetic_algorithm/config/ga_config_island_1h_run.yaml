# ============================================================================
# GA Configuration: ISLAND MODEL — 1H Production Run
# ============================================================================
#
# PURPOSE:
#   Instrumented island model run with regime-aware LLM integration.
#   3 LLM providers (Groq → OpenAI → Anthropic), per-island strategy
#   snapshots, LLM contribution tracking, and regime data exports.
#
# ARCHITECTURE:
#   4 Islands × 25 population × 10 generations = 1,000 evaluations
#   Single pair (BTC/USDT), 1h timeframe, 2 years of data
#   LLM generates regime-specific strategies per island
#   Migration: specialists every 3 gens + master exchange every 2 gens
#
# EXPECTED RUNTIME: 1–1.5 hours
#
# RUN COMMAND:
#   cd /home/kali/trading/freqtradeForkGA
#   source .venv/bin/activate
#   python genetic_algorithm/run_ga.py \
#     --config genetic_algorithm/config/ga_config_island_1h_run.yaml \
#     --yes
#
# OUTPUT FILES (in genetic_algorithm/output/):
#   island_results/island_summary.json       — per-island best/avg stats
#   island_results/island_generation_stats.csv — per-gen per-island CSV
#   island_results/regime_segments.json       — regime data splits
#   island_results/llm_report.json            — LLM provider attribution
#   island_strategies/{island}/gen_NNN_best.json — best strategy snapshots
#   island_evolution.png                      — fitness/diversity chart
#   regime_chart.png                          — regime visualization
#
# ============================================================================

genetic_algorithm:
  random_seed: null
  population_size: 25        # Per-island
  generations: 10            # 10 gens × 4 islands = ~1h
  mutation_rate: 0.20
  crossover_rate: 0.78
  crossover_method: 'uniform'
  elite_size: 3
  tournament_size: 4
  selection_method: 'tournament'
  convergence_patience: 8
  adaptive_mutation: true
  max_adaptation_factor: 2.0
  adaptation_step: 0.12
  max_mutation_rate: 0.40
  fitness_sharing: true
  sharing_radius: 0.18
  diversity_threshold: 0.10
  allow_self_crossover: false
  random_immigrants: 3
  mode: 'single_objective'

# === Fitness — Balanced weights, relaxed penalties for exploration ===
fitness_weights:
  profit: 0.22
  sharpe_ratio: 0.20
  sortino_ratio: 0.14
  profit_factor: 0.10
  drawdown: 0.16
  win_rate: 0.10
  trade_frequency: 0.04
  monthly_stability: 0.04
  cross_pair: 0.00          # Single pair

fitness_penalties:
  min_trades: 6              # Relaxed: 1h gives more candles
  max_drawdown: 0.22         # 22% max drawdown
  min_win_rate: 0.38         # Slightly relaxed
  complexity_weight: 0.015   # Lighter complexity penalty
  pair_loss_threshold: -10.0
  unused_indicator_weight: 0.020

fitness_bounds:
  profit_min: -50
  profit_max: 200
  sharpe_min: -5
  sharpe_max: 10
  sortino_min: -5
  sortino_max: 12
  profit_factor_max: 10

trade_frequency_thresholds:
  very_few: 3
  few: 6
  ideal_min: 8
  ideal_max: 50             # 1h allows more trades
  moderate_excess: 100

# === Backtesting — BTC/USDT 1h, 2 years ===
backtesting:
  timerange: "20240301-20260228"
  stake_amount: 0.15
  pairs:
    - "BTC/USDT"
  max_open_trades: 3
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  datadir: "user_data/data/binance"
  auto_download_data: true
  enable_cache: true
  timeout: 120

# === Walk-Forward — DISABLED ===
walk_forward:
  enabled: false

# === Holdout — DISABLED (island model handles its own) ===
holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

# === Regime Detection ===
regime_aware:
  enabled: true
  method: 'ensemble'
  benchmark_pair: 'BTC/USDT'
  detection_timeframe: '1h'
  period_days: 45            # Shorter periods for 1h data
  min_period_days: 21
  embargo_days: 2
  segments_per_regime: 5     # More segments with 1h data
  holdout_ratio: 0.20
  aggregation: 'harmonic_mean'
  min_segment_trades: 3
  regime_weights:
    bullish: 1.0
    bearish: 1.0
    sideways: 1.0

# === Strategy Constraints ===
strategy_constraints:
  min_trades: 5
  max_drawdown: 0.22
  min_win_rate: 0.35
  timeframes: ["1h"]
  stoploss_range: [-0.12, -0.03]
  roi_range: [0.02, 0.10]
  max_open_trades_range: [1, 3]

# === Multi-Timeframe — DISABLED ===
multi_timeframe:
  enabled: false

# === Indicators ===
indicators:
  available:
    - "RSI"
    - "MACD"
    - "BBANDS"
    - "EMA"
    - "SMA"
    - "STOCH"
    - "ATR"
    - "ADX"
    - "CCI"
    - "MFI"
    - "WILLR"
  max_per_strategy: 5
  min_per_strategy: 2
  min_entry_conditions: 2
  min_exit_conditions: 1

  RSI:
    period: [7, 21]
    buy_threshold: [20, 38]
    sell_threshold: [62, 80]
  MACD:
    fast_period: [8, 18]
    slow_period: [21, 50]
    signal_period: [5, 14]
  BBANDS:
    period: [14, 30]
    std_dev: [1.5, 3.0]
  EMA:
    period: [5, 50]
  SMA:
    period: [10, 100]
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [18, 38]
    d_threshold: [62, 82]
  ATR:
    period: [10, 20]
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  CCI:
    period: [10, 30]
    buy_threshold: [-200, -80]
    sell_threshold: [80, 200]
  MFI:
    period: [10, 20]
    buy_threshold: [18, 35]
    sell_threshold: [65, 82]
  WILLR:
    period: [10, 21]
    buy_threshold: [-85, -70]
    sell_threshold: [-30, -15]

# === Parsimony ===
parsimony:
  enabled: true
  tolerance: 0.02
  max_removals_per_strategy: 2

# === Storage ===
storage:
  database: "genetic_algorithm/data/strategies_island_1h.db"
  strategy_dir: "user_data/strategies/ga_island_1h"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_island_1h"
  checkpoint_interval: 3
  keep_history: true

# === Logging ===
logging:
  level: "INFO"
  file: "genetic_algorithm/logs/ga_island_1h_run.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# === Visualization ===
visualization:
  enabled: false

# === Terminal Monitor ===
terminal_monitor:
  enabled: true

# === Hall of Fame ===
hall_of_fame:
  enabled: true
  max_size: 50
  inject_count: 2
  min_fitness: 0.10
  directory: "genetic_algorithm/data/hall_of_fame_island_1h"

# === Deflated Sharpe ===
deflated_sharpe:
  enabled: true
  min_trades: 5
  benchmark_sr: 0.0
  skewness_correction: true

# ============================================================================
# LLM — 3-Provider Router (Groq → OpenAI → Anthropic)
# ============================================================================
advanced:
  parallel_evaluation: false
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: true

  llm:
    enabled: true
    provider: "groq"               # Default fallback
    model: "llama-3.3-70b-versatile"
    temperature: 0.65
    max_retries: 2
    timeout: 60
    min_call_interval: 3.0         # Groq rate-limit friendly
    max_call_interval: 15.0        # Adaptive backoff ceiling

    seed_ratio: 0.30               # 30% initial pop from LLM
    immigrant_ratio: 0.40          # 40% immigrants from LLM

    mutation_enabled: true
    mutation_probability: 0.12
    mutation_top_k: 3
    mutation_stagnation_threshold: 3

    max_calls_per_generation: 8    # Budget per island per gen
    max_calls_per_run: 300         # Total budget across run

    batch_enabled: true
    max_batch_size: 3

    # Ordered provider list: Groq (fast/free) → OpenAI → Anthropic
    providers_list:
      - provider: groq
        api_key: ""                # Loaded from GROQ_API_KEY env var
        model: "llama-3.3-70b-versatile"
      - provider: openai
        api_key: ""                # Loaded from OPENAI_API_KEY env var
        model: "gpt-4o-mini"
      - provider: anthropic
        api_key: ""                # Loaded from ANTHROPIC_API_KEY env var
        model: "claude-3-haiku-20240307"

# ============================================================================
# ISLAND MODEL CONFIGURATION
# ============================================================================
island_model:
  enabled: true

  islands:
    - name: 'bullish'
      population_size: 25
      data_regime: 'bullish'
    - name: 'bearish'
      population_size: 25
      data_regime: 'bearish'
    - name: 'sideways'
      population_size: 25
      data_regime: 'sideways'
    - name: 'master'
      population_size: 25
      data_regime: 'balanced'

  migration:
    specialist:
      interval: 3              # Every 3 generations
      count: 2                 # Top 2 individuals
      topology: 'fully_connected'
    master:
      interval: 2              # Every 2 generations
      count: 3                 # Top 3 specialists → master
      send_count: 3            # Top 3 master → each specialist

  regime_detection:
    pair: 'BTC/USDT'
    timeframe: '4h'            # Use 4h for regime detection (smoother, more reliable)
    timerange: '20240301-20260228'
    method: 'ensemble'
    period_days: 60
    holdout_ratio: 0.20
