# ============================================================================
# GA Configuration: PHASE 3 - OVERNIGHT PRODUCTION RUN (~4-6 hours)
# ============================================================================
#
# PURPOSE:
#   Full-feature production run to find real trading strategies.
#   All three feature areas at maximum capability:
#   1. ML Regime Detection (ensemble method with holdout)
#   2. Evolution Flow Improvements (all features enabled)
#   3. LLM Integration (multi-provider router with full budget)
#
# ENABLED FEATURES:
#   ✅ Regime-aware evaluation (ensemble method)
#   ✅ Holdout validation (20% out-of-sample)
#   ✅ Walk-forward (180/60 day windows)
#   ✅ Parsimony pressure (simplify overfit strategies)
#   ✅ Hall of fame (inject + archive)
#   ✅ Adaptive mutation
#   ✅ Fitness sharing (diversity preservation)
#   ✅ LLM strategy designer (Groq → OpenAI → Anthropic fallback)
#   ✅ LLM-guided mutation
#   ✅ Unused-indicator penalty
#   ✅ Frequent checkpointing
#   ✅ Non-interactive visualization
#
# EXPECTED RUNTIME: 4-6 hours on 8-core machine
# ESTIMATED EVALUATIONS: ~3,500 (100 pop × 35 gen)
#
# RUN COMMAND:
#   cd /home/kali/trading/freqtradeForkGA
#   source .venv/bin/activate
#   nohup python genetic_algorithm/run_ga.py \
#     --config genetic_algorithm/config/ga_config_phase3_overnight.yaml \
#     --visualize --no-interactive --yes \
#     > genetic_algorithm/logs/phase3_overnight_stdout.log 2>&1 &
#   echo $! > genetic_algorithm/logs/phase3_overnight_pid.txt
#
# MONITOR:
#   tail -f genetic_algorithm/logs/ga_phase3_overnight.log
#   # or
#   bash genetic_algorithm/scripts/monitor_overnight.sh
#
# MORNING ANALYSIS:
#   bash genetic_algorithm/scripts/morning_analysis.sh
#
# ============================================================================

genetic_algorithm:
  random_seed: null  # Randomized for maximum exploration
  population_size: 110  # Optimized: good balance of diversity + cost
  generations: 40  # Optimized: 8-10 hours run time
  mutation_rate: 0.22
  crossover_rate: 0.76
  crossover_method: 'uniform'
  elite_size: 11  # Preserve top performers
  tournament_size: 5
  selection_method: 'tournament'
  convergence_patience: 15
  adaptive_mutation: true
  max_adaptation_factor: 2.0
  adaptation_step: 0.11
  max_mutation_rate: 0.38
  fitness_sharing: true
  sharing_radius: 0.16
  diversity_threshold: 0.09
  allow_self_crossover: false  # No incest breeding
  random_immigrants: 18  # Fresh genetic material
  mode: 'single_objective'

fitness_weights:
  profit: 0.24
  sharpe_ratio: 0.18  # INCREASED: Quality over profit
  sortino_ratio: 0.14  # INCREASED: Risk-adjusted returns matter
  profit_factor: 0.11
  drawdown: 0.15
  win_rate: 0.09  # INCREASED: Higher quality trades
  trade_frequency: 0.05  # DECREASED: Quality over quantity
  monthly_stability: 0.07  # INCREASED: Consistency matters
  cross_pair: 0.06

fitness_penalties:
  min_trades: 15  # INCREASED: Need significant trading activity
  max_drawdown: 0.18  # TIGHTENED: No risky strategies
  min_win_rate: 0.42  # INCREASED: Higher win rate requirement
  complexity_weight: 0.018
  pair_loss_threshold: -5.0  # TIGHTENED: No losing pairs
  unused_indicator_weight: 0.025

fitness_bounds:
  profit_min: -50
  profit_max: 200
  sharpe_min: -5
  sharpe_max: 10
  sortino_min: -5
  sortino_max: 12
  profit_factor_max: 10

trade_frequency_thresholds:
  very_few: 5
  few: 12
  ideal_min: 12
  ideal_max: 50
  moderate_excess: 100

# === Backtesting — Full 3-year period, 5 pairs ===
backtesting:
  timerange: "20230101-20260228"  # 3+ years
  stake_amount: 0.15
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
  max_open_trades: 3
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 180

# === Walk-Forward — ENABLED ===
walk_forward:
  enabled: true
  train_days: 180
  validation_days: 60
  step_days: 60
  mode: 'rolling'
  aggregation: 'mean'
  embargo_days: 5
  gap_penalty:
    enabled: true
    threshold: 0.08
    max_penalty: 0.5
  min_train_trades: 8
  max_windows: 12

# === Holdout Validation ===
holdout_validation:
  enabled: true
  holdout_pct: 0.20

holdout_monitoring:
  enabled: true
  interval: 3
  top_n: 8
  early_stop: true
  early_stop_threshold: 0.55
  early_stop_checks: 4
  trend_early_stop: true
  trend_checks: 3
  fitness_penalty: false

# === Regime Detection — ENABLED (ensemble method) ===
regime_aware:
  enabled: true
  method: 'ensemble'
  benchmark_pair: null
  detection_timeframe: '4h'
  period_days: 90
  min_period_days: 75
  embargo_days: 5
  segments_per_regime: 3
  holdout_ratio: 0.20
  aggregation: 'mean'
  cvar_alpha: 0.20
  min_segment_trades: 5
  regime_weights:
    bullish: 1.20
    bearish: 0.60
    sideways: 1.0

# === Strategy Constraints ===
strategy_constraints:
  min_trades: 15
  max_drawdown: 0.20
  min_win_rate: 0.36
  timeframes: ["15m", "1h"]
  stoploss_range: [-0.09, -0.035]
  roi_range: [0.02, 0.08]
  max_open_trades_range: [2, 5]

# === Multi-Timeframe ===
multi_timeframe:
  enabled: true
  available: ['1h', '4h']
  max_timeframes: 2
  higher_timeframe_preference:
    - 'EMA'
    - 'RSI'
    - 'ADX'
    - 'BBANDS'
    - 'MACD'

# === Indicators — Full set ===
indicators:
  available:
    - "RSI"
    - "MACD"
    - "BBANDS"
    - "EMA"
    - "SMA"
    - "STOCH"
    - "ATR"
    - "ADX"
    - "CCI"
    - "MFI"
    - "WILLR"
  max_per_strategy: 5
  min_per_strategy: 2

  RSI:
    period: [7, 21]
    buy_threshold: [20, 38]
    sell_threshold: [62, 80]
  MACD:
    fast_period: [8, 18]
    slow_period: [21, 50]
    signal_period: [5, 14]
  BBANDS:
    period: [14, 30]
    std_dev: [1.5, 3.0]
  EMA:
    period: [5, 50]
  SMA:
    period: [10, 100]
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [18, 38]
    d_threshold: [62, 82]
  ATR:
    period: [10, 20]
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  CCI:
    period: [10, 30]
    buy_threshold: [-200, -80]
    sell_threshold: [80, 200]
  MFI:
    period: [10, 20]
    buy_threshold: [18, 35]
    sell_threshold: [65, 82]
  WILLR:
    period: [10, 21]
    buy_threshold: [-85, -70]
    sell_threshold: [-30, -15]

# === Storage ===
storage:
  database: "genetic_algorithm/data/strategies_phase3_overnight.db"
  strategy_dir: "user_data/strategies/ga_phase3_overnight"
  checkpoint_dir: "genetic_algorithm/data/checkpoints"
  checkpoint_interval: 3
  keep_history: true

# === Logging ===
logging:
  level: "DEBUG"
  file: "genetic_algorithm/logs/ga_phase3_overnight.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# === Visualization — ENABLED (non-interactive) ===
visualization:
  enabled: true
  update_interval: 3
  save_plots: true
  plot_dir: "genetic_algorithm/plots/phase3_overnight"

# === Hall of Fame ===
hall_of_fame:
  enabled: true
  max_size: 50
  inject_count: 3
  min_fitness: 0.15
  persistence_path: "genetic_algorithm/data/hall_of_fame.json"

# === Deflated Sharpe Ratio ===
deflated_sharpe:
  enabled: true
  min_trades: 10
  benchmark_sr: 0.0
  skewness_correction: true

# === Advanced — Full LLM with Multi-Provider Router ===
advanced:
  parallel_evaluation: true
  num_workers: 8
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: true

  llm:
    enabled: true
    provider: "groq"
    api_key: ""  # Uses GROQ_API_KEY from environment
    model: "llama-3.3-70b-versatile"
    temperature: 0.65  # Lower: Less random, more focused
    max_retries: 2
    timeout: 60
    min_call_interval: 1.0

    # Seeding: 40% from Groq (free), fallback to OpenAI/Anthropic rarely
    seed_ratio: 0.40

    # Immigrants: 50% from Groq (free), fallback to OpenAI/Anthropic rarely
    immigrant_ratio: 0.50

    # LLM-guided mutation: Enabled but conservative
    mutation_enabled: true
    mutation_probability: 0.14  # Moderate guidance
    mutation_top_k: 4
    mutation_stagnation_threshold: 4

    # COST CONTROL: Keep spending minimal (~$0.50-$1 max)
    # Most calls go to Groq (free), OpenAI/Anthropic only if Groq fails
    max_calls_per_generation: 8  # REDUCED: 8 * 50 gens = 400 calls max
    max_calls_per_run: 400  # REDUCED: ~50% Groq, ~50% spillover = ~$0.50-$1

    # Multi-provider: Groq PRIMARY (99% of calls) → Fallback only if needed
    providers_list:
      - provider: groq
        api_key: ""
        model: "llama-3.3-70b-versatile"  # FREE - will handle most calls
      - provider: openai
        api_key: ""
        model: "gpt-4o-mini"  # FALLBACK ONLY: $0.15/$0.60 per 1M
      - provider: anthropic
        api_key: ""
        model: "claude-3-haiku-20240307"  # FALLBACK ONLY: $0.25/$1.25 per 1M

  island_model:
    enabled: false
