# ============================================================================
# Example: Distributed GA Configuration with External Migration
# ============================================================================
# Use this as a template for setting up distributed GA across multiple machines.
# Each machine runs its own GA instance with this config, and they exchange
# top strategies via the external_migration directories.
#
# Setup:
#   1. Copy this config to each machine
#   2. Adjust num_islands/population to match each machine's resources
#   3. Run the migration daemon (scripts/distribute_migrate.ps1 or .sh)
#   4. Launch GA: python genetic_algorithm/run_ga.py --config <this_file> --yes
# ============================================================================

genetic_algorithm:
  random_seed: null
  population_size: 10
  generations: 20
  max_runtime_minutes: 360
  mutation_rate: 0.20
  crossover_rate: 0.75
  crossover_method: 'uniform'
  elite_size: 2
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 12
  adaptive_mutation: true
  max_adaptation_factor: 2.0
  adaptation_step: 0.15
  max_mutation_rate: 0.40
  fitness_sharing: true
  sharing_radius: 0.20
  diversity_threshold: 0.12
  allow_self_crossover: false
  random_immigrants: 1
  mode: 'single_objective'

generic_island_model:
  enabled: true
  num_islands: 6
  population_per_island: 10
  parallel_islands: false
  specialization:
    rotate_seeds: true
    indicator_pools: true
    indicator_overlap: 0.4
    pair_rotation: false
  migration:
    topology: 'ring'
    interval: 3
    count: 2
    merge_rounds: true
    merge_interval: 8

  # ── External (cross-machine) migration ──
  # Strategies are exported as JSON to export_directory, and the migration
  # daemon (scripts/distribute_migrate.ps1 or .sh) copies them between machines.
  # Incoming migrants are loaded from directory and injected into random islands.
  external_migration:
    enabled: true
    interval: 3          # Exchange every N generations
    count: 3             # Number of top individuals to export
    directory: genetic_algorithm/data/incoming_migrants
    export_directory: genetic_algorithm/data/outgoing_migrants

fitness_weights:
  profit: 0.30
  sharpe_ratio: 0.15
  sortino_ratio: 0.12
  profit_factor: 0.08
  drawdown: 0.15
  win_rate: 0.06
  trade_frequency: 0.04
  monthly_stability: 0.04
  cross_pair: 0.06

fitness_penalties:
  min_trades: 5
  max_drawdown: 0.30
  min_win_rate: 0.25
  complexity_weight: 0.015
  unused_indicator_weight: 0.02
  pair_loss_threshold: -8.0

backtesting:
  timerange: "20230301-20260228"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 120

walk_forward:
  enabled: false

holdout_validation:
  enabled: false

deflated_sharpe:
  enabled: true
  min_trades: 5
  benchmark_sr: 0.0
  skewness_correction: true

parsimony:
  enabled: true
  max_indicators: 5
  max_conditions: 6

strategy_constraints:
  min_trades: 5
  max_drawdown: 0.30
  min_win_rate: 0.25
  timeframes: ["15m"]
  stoploss_range: [-0.15, -0.03]
  roi_range: [0.01, 0.10]
  max_open_trades_range: [1, 5]
  min_exit_conditions: 1
