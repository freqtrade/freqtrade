# Medium GA Search - Optimized for Visible Improvement
# Config designed to show clear generation-over-generation improvement

genetic_algorithm:
  random_seed: 2026              # Reproducible for comparison
  population_size: 15            # Medium size population
  generations: 6                 # Enough to see trends
  mutation_rate: 0.18            # Moderate mutation
  crossover_rate: 0.75           # High crossover for exploration
  elite_size: 2                  # Keep top 2 strategies
  tournament_size: 4             # Strong selection pressure
  selection_method: 'tournament'
  convergence_patience: 10
  adaptive_mutation: true        # Increase mutation if stagnating
  fitness_sharing: false         # Focus on best, not diversity
  sharing_radius: 0.3
  diversity_threshold: 0.15
  allow_self_crossover: false
  random_immigrants: 1           # Small diversity injection
  mode: 'single_objective'

backtesting:
  pairs:
    - ETH/BTC                    # Single pair for speed
  timerange: '20250620-20260120' # ~7 months of data
  stake_amount: 0.15
  max_open_trades: 3
  fee: 0.001
  exchange: binance
  datadir: data
  auto_download_data: true

walk_forward:
  enabled: false                 # Disabled for speed

strategy:
  min_buy_conditions: 1
  max_buy_conditions: 2
  min_sell_conditions: 1
  max_sell_conditions: 2
  base_timeframe: '15m'

indicators:
  available:
    - 'RSI'
    - 'MACD'
    - 'BBANDS'
    - 'EMA'
  max_indicators: 4

multi_timeframe:
  enabled: false                 # Disabled for speed
  available_timeframes: ['15m']
  max_informative_timeframes: 0
  mutation_probability: 0.0

# Lite logging - minimal output
logging:
  level: INFO
  console: true

# Fitness weights - balanced but profit-focused
fitness_weights:
  profit: 0.35
  sharpe_ratio: 0.20
  drawdown: 0.20
  win_rate: 0.15
  trade_frequency: 0.10

fitness_penalties:
  min_trades: 10                 # Require some trades
  max_drawdown: 0.30
  min_win_rate: 0.35
  complexity_weight: 0.01
