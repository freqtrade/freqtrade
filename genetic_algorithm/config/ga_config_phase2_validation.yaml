# ============================================================================
# GA Configuration: PHASE 2 - FEATURE VALIDATION (~30-45 minutes)
# ============================================================================
#
# PURPOSE:
#   Benchmark feature impact and measure LLM contribution vs random strategies.
#   Tests all three feature areas with moderate workload:
#   1. ML Regime Detection (adx_di_hysteresis method)
#   2. Evolution Flow Improvements (adaptive mutation, fitness sharing)
#   3. LLM Integration (Groq primary, OpenAI fallback)
#
# EXPECTED RUNTIME: ~30-45 minutes
#
# RUN COMMAND:
#   cd /home/kali/trading/freqtradeForkGA
#   source .venv/bin/activate
#   python genetic_algorithm/run_ga.py \
#     --config genetic_algorithm/config/ga_config_phase2_validation.yaml \
#     --visualize --no-interactive --yes
#
# SUCCESS CRITERIA:
#   - Visual fitness trends improving
#   - LLM strategies visible in top 25%
#   - Regime-weighted scores logged
#   - Walk-forward gap penalty engaged
#   - Diversity metrics stable
#
# ============================================================================

genetic_algorithm:
  random_seed: null  # Randomized for exploration
  population_size: 32
  generations: 20
  mutation_rate: 0.18
  crossover_rate: 0.72
  crossover_method: 'uniform'
  elite_size: 3
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 12
  adaptive_mutation: true
  max_adaptation_factor: 2.0
  adaptation_step: 0.12
  max_mutation_rate: 0.32
  fitness_sharing: true
  sharing_radius: 0.15
  diversity_threshold: 0.12
  allow_self_crossover: false
  random_immigrants: 4
  mode: 'single_objective'

fitness_weights:
  profit: 0.25
  sharpe_ratio: 0.17
  sortino_ratio: 0.12
  profit_factor: 0.10
  drawdown: 0.15
  win_rate: 0.08
  trade_frequency: 0.08
  monthly_stability: 0.05

fitness_penalties:
  min_trades: 8
  max_drawdown: 0.28
  min_win_rate: 0.32
  complexity_weight: 0.012
  unused_indicator_weight: 0.018
  pair_loss_threshold: -10.0

fitness_bounds:
  profit_min: -50
  profit_max: 200
  sharpe_min: -5
  sharpe_max: 10
  sortino_min: -5
  sortino_max: 12
  profit_factor_max: 10

trade_frequency_thresholds:
  very_few: 5
  few: 10
  ideal_min: 10
  ideal_max: 45
  moderate_excess: 90

# === Backtesting — 6 months, 2 pairs ===
backtesting:
  timerange: "20250701-20260201"  # 7 months
  stake_amount: 0.15
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
  max_open_trades: 3
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 90

# === Walk-Forward — ENABLED ===
walk_forward:
  enabled: true
  train_days: 90
  validation_days: 21
  step_days: 21
  mode: 'rolling'
  aggregation: 'mean'
  embargo_days: 3
  gap_penalty:
    enabled: true
    threshold: 0.10
    max_penalty: 0.4
  min_train_trades: 5
  max_windows: 6

# === Holdout Validation ===
holdout_validation:
  enabled: true
  holdout_pct: 0.18

holdout_monitoring:
  enabled: true
  interval: 3
  top_n: 5
  early_stop: false
  fitness_penalty: false

# === Regime Detection — ENABLED (ADX+DI method) ===
regime_aware:
  enabled: true
  method: 'adx_di_hysteresis'
  benchmark_pair: null
  detection_timeframe: '4h'
  period_days: 60
  min_period_days: 45
  embargo_days: 3
  segments_per_regime: 2
  holdout_ratio: 0.15
  aggregation: 'harmonic_mean'
  cvar_alpha: 0.20
  min_segment_trades: 4
  regime_weights:
    bullish: 1.15
    bearish: 0.65
    sideways: 1.0

# === Strategy Constraints ===
strategy_constraints:
  min_trades: 8
  max_drawdown: 0.25
  min_win_rate: 0.32
  timeframes: ["15m", "1h"]
  stoploss_range: [-0.10, -0.035]
  roi_range: [0.02, 0.08]
  max_open_trades_range: [2, 4]

# === Multi-Timeframe ===
multi_timeframe:
  enabled: true
  available: ['1h', '4h']
  max_timeframes: 2
  higher_timeframe_preference:
    - 'EMA'
    - 'RSI'
    - 'ADX'
    - 'BBANDS'

# === Indicators ===
indicators:
  available:
    - "RSI"
    - "MACD"
    - "BBANDS"
    - "EMA"
    - "SMA"
    - "STOCH"
    - "ATR"
    - "ADX"
    - "CCI"
  max_per_strategy: 4
  min_per_strategy: 1

  RSI:
    period: [8, 21]
    buy_threshold: [22, 38]
    sell_threshold: [62, 78]
  MACD:
    fast_period: [9, 18]
    slow_period: [22, 45]
    signal_period: [6, 13]
  BBANDS:
    period: [16, 28]
    std_dev: [1.6, 2.8]
  EMA:
    period: [6, 45]
  SMA:
    period: [12, 90]
  STOCH:
    k_period: [8, 18]
    d_period: [3, 12]
    k_threshold: [22, 38]
    d_threshold: [62, 78]
  ATR:
    period: [10, 18]
  ADX:
    period: [11, 18]
    threshold: [22, 38]
  CCI:
    period: [12, 26]
    buy_threshold: [-180, -90]
    sell_threshold: [90, 180]

# === Storage ===
storage:
  database: "genetic_algorithm/data/strategies_phase2_validation.db"
  strategy_dir: "user_data/strategies/ga_phase2_validation"
  checkpoint_dir: "genetic_algorithm/data/checkpoints"
  checkpoint_interval: 4
  keep_history: true

# === Logging ===
logging:
  level: "DEBUG"
  file: "genetic_algorithm/logs/ga_phase2_validation.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# === Visualization — ENABLED ===
visualization:
  enabled: true
  update_interval: 2
  save_plots: true
  plot_dir: "genetic_algorithm/plots/phase2_validation"

# === Advanced — LLM with Fallback Router ===
advanced:
  parallel_evaluation: true
  num_workers: 6
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: true

  llm:
    enabled: true
    provider: "groq"
    api_key: ""  # Uses GROQ_API_KEY from environment
    model: "llama-3.3-70b-versatile"
    temperature: 0.75
    max_retries: 2
    timeout: 50
    min_call_interval: 1.0

    # Seeding: 50% of initial population from LLM
    seed_ratio: 0.5

    # Immigrants: 60% of random immigrants from LLM
    immigrant_ratio: 0.6

    # LLM-guided mutation: ENABLED
    mutation_enabled: true
    mutation_probability: 0.12
    mutation_top_k: 3
    mutation_stagnation_threshold: 3

    # Budget limits
    max_calls_per_generation: 15
    max_calls_per_run: 200

    # Fallback providers (router will try these in order)
    providers_list:
      - provider: groq
        api_key: ""
        model: "llama-3.3-70b-versatile"
      - provider: openai
        api_key: ""
        model: "gpt-4o-mini"
      - provider: anthropic
        api_key: ""
        model: "claude-sonnet-4-20250514"

  island_model:
    enabled: false
