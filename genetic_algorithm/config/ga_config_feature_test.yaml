  # GA Feature Test Configuration
# 
# Purpose: Test all newly implemented features:
#   1. AND-logic bias (75/25 AND/OR weighting)
#   2. Expanded operators (increasing, decreasing, between, value_above_ago)
#   3. Monthly stability + cross-pair consistency fitness metrics
#   4. Seed population with 7 known archetypes
#   5. Feature importance tracking
#   6. Strategy hall of fame
#   7. Walk-forward validation
#   8. Holdout validation
#
# Uses available data: BTC/USDT, ETH/USDT, LTC/USDT (2024-01 to 2026-02)
# Designed for a ~20-40 minute test run

# === Genetic Algorithm Parameters ===
genetic_algorithm:
  random_seed: 42  # Fixed seed for reproducibility
  population_size: 25
  generations: 10
  mutation_rate: 0.25
  crossover_rate: 0.70
  crossover_method: 'uniform'
  elite_size: 3
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 8
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.15
  fitness_sharing: true
  sharing_radius: 0.25
  diversity_threshold: 0.12
  allow_self_crossover: false
  random_immigrants: 3
  mode: 'single_objective'

# === Fitness Function Weights ===
# Includes new monthly_stability and cross_pair metrics
fitness_weights:
  profit: 0.22
  sharpe_ratio: 0.16
  sortino_ratio: 0.13
  profit_factor: 0.10
  drawdown: 0.13
  win_rate: 0.07
  trade_frequency: 0.07
  monthly_stability: 0.06  # NEW: penalizes inconsistent monthly returns
  cross_pair: 0.06          # NEW: penalizes pair-dependent strategies

# Fitness penalties
fitness_penalties:
  min_trades: 6
  max_drawdown: 0.25
  min_win_rate: 0.35
  complexity_weight: 0.015
  pair_loss_threshold: -8.0

# Fitness bounds
fitness_bounds:
  profit_min: -50
  profit_max: 200
  sharpe_min: -5
  sharpe_max: 10
  sortino_min: -5
  sortino_max: 12
  profit_factor_max: 10

# Trade frequency thresholds
trade_frequency_thresholds:
  very_few: 5
  few: 10
  ideal_min: 10
  ideal_max: 50
  moderate_excess: 100

# === Backtesting Configuration ===
backtesting:
  # Using data range where all 3 pairs overlap
  timerange: "20240601-20260228"
  stake_amount: 0.15
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
  max_open_trades: 3
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 90

# === Walk-Forward Optimization ===
# Disabled for speed in this feature test
walk_forward:
  enabled: false
  train_days: 120
  validation_days: 45
  step_days: 45
  mode: 'rolling'
  aggregation: 'mean'
  embargo_days: 2
  gap_penalty:
    enabled: true
    threshold: 0.15
    max_penalty: 0.4
  min_train_trades: 3

# === Holdout Validation ===
holdout_validation:
  enabled: false
  holdout_pct: 0.15

# === Regime-Aware Evaluation ===
# Disabled for speed in this test
regime_aware:
  enabled: false

# === Strategy Constraints ===
strategy_constraints:
  min_trades: 10
  max_drawdown: 0.20
  min_win_rate: 0.35
  timeframes: ["1h"]
  stoploss_range: [-0.12, -0.04]
  roi_range: [0.02, 0.08]
  max_open_trades_range: [2, 5]

# === Multi-Timeframe ===
multi_timeframe:
  enabled: false

# === Indicator Configuration ===
indicators:
  available:
    - "RSI"
    - "MACD"
    - "BBANDS"
    - "EMA"
    - "SMA"
    - "ADX"
    - "SUPERTREND"
    - "DONCHIAN"
    - "PSAR"
    - "CMF"
    - "CDL_ENGULFING"
    - "CDL_HAMMER"
  max_per_strategy: 4
  min_per_strategy: 2

  RSI:
    period: [7, 21]
    buy_threshold: [20, 40]
    sell_threshold: [60, 80]
  MACD:
    fast_period: [8, 21]
    slow_period: [21, 50]
    signal_period: [5, 14]
  BBANDS:
    period: [15, 30]
    std_dev: [1.5, 3.0]
  EMA:
    period: [5, 50]
  SMA:
    period: [10, 100]
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  SUPERTREND:
    period: [7, 14]
    multiplier: [2.0, 4.0]
  DONCHIAN:
    period: [10, 30]
  PSAR:
    acceleration: [0.01, 0.05]
    maximum: [0.1, 0.3]
  CMF:
    period: [10, 25]
    buy_threshold: [0.05, 0.2]
    sell_threshold: [-0.2, -0.05]
  CDL_ENGULFING: {}
  CDL_HAMMER: {}

# === Storage Configuration ===
storage:
  database: "genetic_algorithm/data/strategies_feature_test.db"
  strategy_dir: "user_data/strategies/ga_generated"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_feature_test"
  checkpoint_interval: 4
  keep_history: true

# === Hall of Fame Configuration ===
hall_of_fame:
  directory: "genetic_algorithm/data/hall_of_fame_feature_test"
  max_size: 20
  min_fitness: 0.0
  inject_count: 2

# === Logging Configuration ===
logging:
  level: "INFO"
  file: "genetic_algorithm/logs/ga_feature_test.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# === Terminal Monitor ===
terminal_monitor:
  enabled: true
  default_mode: "simple"
  refresh_rate: 4
  history_window: 20

# === Visualization ===
visualization:
  enabled: false

# === Parallel Evaluation ===
parallel_evaluation:
  enabled: true
  num_workers: null
  worker_log_level: 'WARNING'

# === Progress Bar ===
progress:
  enabled: false

# === Advanced ===
advanced:
  enable_dry_run: false

# === Parsimony ===
parsimony:
  enabled: false
  epsilon: 0.02
  max_removals: 1

# === Monte Carlo ===
monte_carlo:
  enabled: false

# === Dynamic Bounds ===
dynamic_bounds:
  enabled: false
