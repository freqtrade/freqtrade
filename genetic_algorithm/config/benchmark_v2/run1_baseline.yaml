# ============================================================================
# BENCHMARK v2 RUN 1: Baseline Raw GA
# ============================================================================
# Purpose: Raw GA with NO anti-overfitting measures on 3-year data.
#          Establishes ceiling fitness and measures how much "raw" evolution
#          can achieve without guardrails. Expected: high in-sample fitness,
#          poor out-of-sample generalization.
#
# What's enabled:  Core GA only (selection, crossover, mutation, elitism)
# What's disabled: Walk-forward, holdout, Monte Carlo, DSR, parsimony,
#                  regime detection, island model
# Budget: ~60 min
# ============================================================================

genetic_algorithm:
  random_seed: 42
  population_size: 25
  generations: 20
  max_runtime_minutes: 90
  mutation_rate: 0.20
  crossover_rate: 0.75
  crossover_method: 'uniform'
  elite_size: 3
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 12
  adaptive_mutation: true
  max_adaptation_factor: 2.0
  adaptation_step: 0.12
  max_mutation_rate: 0.65
  fitness_sharing: true
  sharing_radius: 0.22
  diversity_threshold: 0.15
  allow_self_crossover: false
  random_immigrants: 5
  mode: 'single_objective'

fitness_weights:
  profit: 0.35
  sharpe_ratio: 0.12
  sortino_ratio: 0.10
  profit_factor: 0.10
  drawdown: 0.13
  win_rate: 0.05
  trade_frequency: 0.05
  drawdown_duration: 0.02
  consecutive_losses: 0.02
  monthly_stability: 0.06

fitness_penalties:
  min_trades: 15
  max_drawdown: 0.40
  min_win_rate: 0.25
  complexity_weight: 0.005
  unused_indicator_weight: 0.02

backtesting:
  timerange: "20230301-20260228"
  stake_amount: 100
  pairs:
    - "BTC/USDT"
  max_open_trades: 3
  fee: 0.001
  exchange: "binance"
  auto_download_data: false
  enable_cache: true
  timeout: 180

# === ALL ANTI-OVERFIT OFF ===
walk_forward:
  enabled: false

holdout_validation:
  enabled: false

holdout_monitoring:
  enabled: false

regime_aware:
  enabled: false

monte_carlo:
  enabled: false

deflated_sharpe:
  enabled: false

parsimony:
  enabled: false

cpcv:
  enabled: false

strategy_constraints:
  min_trades: 15
  max_drawdown: 0.40
  min_win_rate: 0.25
  timeframes: ["15m"]
  stoploss_range: [-0.15, -0.03]
  roi_range: [0.01, 0.12]
  max_open_trades_range: [1, 4]
  min_exit_conditions: 1

multi_timeframe:
  enabled: false

indicators:
  available:
    - "RSI"
    - "EMA"
    - "BBANDS"
    - "ADX"
    - "MACD"
    - "SMA"
    - "SUPERTREND"
    - "STOCH"
    - "ATR"
    - "CCI"
  max_per_strategy: 4
  min_per_strategy: 2
  min_entry_conditions: 2

  RSI:
    period: [7, 21]
    buy_threshold: [20, 38]
    sell_threshold: [62, 80]
  MACD:
    fast_period: [8, 18]
    slow_period: [21, 50]
    signal_period: [5, 14]
  BBANDS:
    period: [14, 30]
    std_dev: [1.5, 3.0]
  EMA:
    period: [5, 50]
  SMA:
    period: [10, 100]
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [18, 38]
    d_threshold: [62, 82]
  ATR:
    period: [10, 20]
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  CCI:
    period: [10, 30]
    buy_threshold: [-200, -80]
    sell_threshold: [80, 200]
  SUPERTREND:
    period: [7, 14]
    multiplier: [2.0, 4.0]

trade_visualization:
  enabled: false

terminal_monitor:
  enabled: false

parallel_evaluation:
  enabled: true
  num_workers: null
  worker_log_level: 'WARNING'
  backtest_timeout: 120

output:
  dir: 'genetic_algorithm/output/benchmark/run1_baseline'
  save_stats: true
  stats_file: 'evolution_stats.json'
  save_snapshots: true
  snapshot_interval: 1

storage:
  database: "genetic_algorithm/data/benchmark_v2_run1.db"
  strategy_dir: "user_data/strategies/benchmark_v2_run1"
  checkpoint_dir: "genetic_algorithm/data/checkpoints_benchmark_v2_run1"
  checkpoint_interval: 5
  keep_history: true

logging:
  level: "INFO"
  file: "genetic_algorithm/logs/benchmark_v2_run1.log"
  console: true

hall_of_fame:
  enabled: true
  max_size: 30
  inject_count: 0
  min_fitness: 0.10
  directory: "genetic_algorithm/data/hall_of_fame_benchmark_v2"

advanced:
  parallel_evaluation: false
  enable_dry_run: false
  enable_ml_fitness: false
  enable_llm: false
  llm:
    enabled: false

overfit_analysis:
  thresholds:
    holdout_degradation_warning: 0.25
    holdout_degradation_overfit: 0.50
    wf_gap_warning: 0.15
    wf_gap_overfit: 0.30
    mc_robustness_warning: 0.70
    mc_robustness_overfit: 0.50
    composite_warning: 0.25
    composite_overfit: 0.50
