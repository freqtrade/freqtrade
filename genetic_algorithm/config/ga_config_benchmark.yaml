# Benchmark Configuration — End-to-End Validation Run
#
# Scaled-down config for validating correctness and measuring performance.
# Uses 3 pairs with existing data, small population, few generations.
# All features enabled for comprehensive testing.

# === Genetic Algorithm Parameters ===
genetic_algorithm:
  random_seed: 42  # Fixed seed for reproducible benchmarking
  population_size: 15
  generations: 6
  mutation_rate: 0.20
  crossover_rate: 0.75
  crossover_method: 'uniform'
  elite_size: 3
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 12  # High enough to not trigger convergence early
  adaptive_mutation: true
  max_adaptation_factor: 2.5
  adaptation_step: 0.15
  fitness_sharing: true
  sharing_radius: 0.25
  diversity_threshold: 0.12
  allow_self_crossover: false
  random_immigrants: 3
  mode: 'single_objective'

# === Fitness Function Weights ===
fitness_weights:
  profit: 0.22
  sharpe_ratio: 0.16
  sortino_ratio: 0.13
  profit_factor: 0.10
  drawdown: 0.13
  win_rate: 0.07
  trade_frequency: 0.07
  monthly_stability: 0.06
  cross_pair: 0.06

fitness_penalties:
  min_trades: 8
  max_drawdown: 0.25
  min_win_rate: 0.35
  complexity_weight: 0.015
  pair_loss_threshold: -8.0

fitness_bounds:
  profit_min: -50
  profit_max: 200
  sharpe_min: -5
  sharpe_max: 10
  sortino_min: -5
  sortino_max: 12
  profit_factor_max: 10

trade_frequency_thresholds:
  very_few: 5
  few: 10
  ideal_min: 10
  ideal_max: 50
  moderate_excess: 100

# === Backtesting Configuration ===
backtesting:
  # 6 months of data that exists for all 3 pairs
  timerange: "20240601-20241201"
  stake_amount: 0.15
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "LTC/USDT"
  max_open_trades: 3
  fee: 0.001
  slippage_pct: 0.0005
  exchange: "binance"
  auto_download_data: false  # Use existing data only
  enable_cache: true
  timeout: 90

# === Walk-Forward Optimization ===
walk_forward:
  enabled: true
  train_days: 90
  validation_days: 30
  step_days: 30
  mode: 'rolling'
  aggregation: 'mean'
  embargo_days: 3
  gap_penalty:
    enabled: true
    threshold: 0.1
    max_penalty: 0.5
  min_train_trades: 5
  max_windows: 12

# === Holdout Validation ===
holdout_validation:
  enabled: false  # Disable to keep benchmark fast

# === Regime-Aware Evaluation ===
regime_aware:
  enabled: false  # Disable to keep benchmark fast

# === Strategy Constraints ===
strategy_constraints:
  min_trades: 5
  max_drawdown: 0.30
  min_win_rate: 0.25
  timeframes: ["1h"]
  stoploss_range: [-0.12, -0.04]
  roi_range: [0.02, 0.08]
  max_open_trades_range: [2, 5]

# === Short Selling ===
short_selling:
  enabled: false
  probability: 0.5

# === Holdout Test ===
holdout_test:
  enabled: false
  timerange: ""
  top_n: 5

# === Multi-Timeframe ===
multi_timeframe:
  enabled: false
  available: ['1h', '4h']
  max_timeframes: 1

# === Indicators ===
indicators:
  available:
    - "RSI"
    - "MACD"
    - "BBANDS"
    - "EMA"
    - "SMA"
    - "ADX"
    - "SUPERTREND"
    - "DONCHIAN"
    - "CMF"
    - "CDL_ENGULFING"
    - "CDL_HAMMER"
  max_per_strategy: 4
  min_per_strategy: 2

  RSI:
    period: [7, 21]
    buy_threshold: [20, 40]
    sell_threshold: [60, 80]
  MACD:
    fast_period: [8, 21]
    slow_period: [21, 50]
    signal_period: [5, 14]
  BBANDS:
    period: [15, 30]
    std_dev: [1.5, 3.0]
  EMA:
    period: [5, 50]
  SMA:
    period: [10, 100]
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  SUPERTREND:
    period: [7, 14]
    multiplier: [2.0, 4.0]
  DONCHIAN:
    period: [10, 30]
  CMF:
    period: [10, 25]
    buy_threshold: [0.05, 0.2]
    sell_threshold: [-0.2, -0.05]
  CDL_ENGULFING: {}
  CDL_HAMMER: {}

# === Storage ===
storage:
  database: "genetic_algorithm/data/strategies.db"
  strategy_dir: "user_data/strategies/ga_generated"
  checkpoint_dir: "genetic_algorithm/data/checkpoints"
  checkpoint_interval: 3
  keep_history: true

# === Hall of Fame ===
hall_of_fame:
  directory: "genetic_algorithm/data/hall_of_fame"
  max_size: 50
  min_fitness: 0.0
  inject_count: 0  # Don't inject HoF for clean benchmark

# === Logging ===
logging:
  level: "INFO"
  file: "genetic_algorithm/logs/ga.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# === Terminal Monitor ===
# Live dashboard replaces scrolling log output. Press S/D/L to switch views.
terminal_monitor:
  enabled: true
  default_mode: "simple"   # simple | detailed | logs
  refresh_rate: 4           # UI refreshes per second
  history_window: 20        # Generations to keep in history table

# === Visualization ===
visualization:
  enabled: false
  update_interval: 1
  plots:
    - "fitness_evolution"
    - "diversity"
  output_dir: "genetic_algorithm/plots"

# === Parallel Evaluation ===
parallel_evaluation:
  enabled: true
  num_workers: null  # Auto-detect
  worker_log_level: 'WARNING'

# === Parsimony ===
parsimony:
  enabled: true
  epsilon: 0.02
  max_removals: 1

# === Monte Carlo (disabled for benchmark speed) ===
monte_carlo:
  enabled: false

# === Dynamic Bounds ===
dynamic_bounds:
  enabled: true
  mutation_strength: 0.1
