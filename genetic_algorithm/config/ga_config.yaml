# Default GA Configuration
# 
# ⚠️  WARNING: This config uses test data (UNITTEST/BTC from 2018)
# 
# For real strategy development:
# 1. Copy ga_config_example.yaml to create your own config
# 2. Download real data: freqtrade download-data --pairs BTC/USDT --timeframes 1h --days 90
# 3. Update pairs and timerange in your config
# 4. Run: python genetic_algorithm/run_ga.py --config your_config.yaml
# 
# Or use the quick test: python genetic_algorithm/run_ga.py --config genetic_algorithm/config/ga_config_test.yaml

# Genetic Algorithm Configuration for FreqTrade Strategy Evolution

# === Genetic Algorithm Parameters ===
genetic_algorithm:
  # Random seed for reproducibility (set to null for random behavior)
  random_seed: null  # Set to an integer (e.g., 42) for reproducible experiments
  
  # Population size - number of strategies per generation
  population_size: 10
  
  # Number of generations to evolve
  generations: 2
  
  # Mutation rate - probability of mutating an individual
  mutation_rate: 0.15
  
  # Crossover rate - probability of crossing over two parents
  crossover_rate: 0.7
  
  # Crossover method: 'single_point', 'uniform', 'component'
  # - single_point: splits indicator/condition lists at random point, swaps tails
  # - uniform: each component independently inherited from either parent
  # - component: swaps entire blocks (indicators, entry conditions, exit conditions, risk params)
  crossover_method: 'single_point'
  
  # Elite size - number of top strategies to preserve unchanged (~15% of population)
  elite_size: 2
  
  # Tournament size for tournament selection (3-5 recommended for good selection pressure)
  tournament_size: 3

  # Selection method: 'tournament', 'roulette', 'rank'
  selection_method: 'tournament'
  
  # Convergence threshold - stop if no improvement after N generations
  convergence_patience: 10
  
  # Adaptive mutation - increase mutation rate when stuck
  adaptive_mutation: true
  
  # Adaptive mutation parameters
  max_adaptation_factor: 2.0   # Maximum multiplier for mutation rate (2x base rate)
  adaptation_step: 0.1          # Increase factor per generation with no improvement
  
  # Diversity preservation
  fitness_sharing: true         # Enable fitness sharing for diversity
  sharing_radius: 0.3           # How similar strategies must be to share fitness (0-1)
  diversity_threshold: 0.15     # Minimum genetic diversity to maintain
  allow_self_crossover: false   # Allow same parent to be selected twice (set false for more diversity)
  
  # Random immigrants - inject fresh random strategies each generation to prevent premature convergence
  # When diversity drops below diversity_threshold, this count is doubled for that generation
  random_immigrants: 5          # Number of fresh random individuals to inject per generation
  
  # Evolution mode: 'single_objective' (default) or 'nsga2' (multi-objective)
  # Single-objective uses weighted fitness function, NSGA-II returns Pareto front
  mode: 'single_objective'

# === NSGA-II Multi-Objective Configuration ===
# Only used when genetic_algorithm.mode = 'nsga2'
nsga2:
  # Objectives to optimize (all converted to maximization internally)
  # Each objective has: name (metric key), type (maximize/minimize/goldilocks)
  objectives:
    - name: 'profit'          # Total profit percentage
      type: 'maximize'
      scale: 100.0            # Normalize to ~0-1 range
    - name: 'max_drawdown'    # Maximum drawdown (risk)
      type: 'minimize'        # Converted to -drawdown for maximization
      scale: 1.0
    - name: 'sharpe_ratio'    # Risk-adjusted return
      type: 'maximize'
      scale: 3.0              # Normalize to ~0-1 range
  
  # Number of Pareto-optimal strategies to return
  pareto_front_size: 20
  
  # Crowding distance percentile for diversity (not currently used, for future)
  crowding_distance_percentile: 0.1

# === Fitness Function Weights ===
# These weights determine how different metrics contribute to overall fitness
# All weights should sum to 1.0
fitness_weights:
  profit: 0.29            # Total profit/return
  sharpe_ratio: 0.13      # Risk-adjusted returns (volatility)
  sortino_ratio: 0.13     # Downside risk-adjusted returns
  profit_factor: 0.10     # Win/loss ratio
  drawdown: 0.15          # Maximum drawdown (penalty)
  win_rate: 0.10          # Percentage of winning trades
  trade_frequency: 0.10   # Number of trades (too few or too many is bad)

# Fitness penalties
fitness_penalties:
  min_trades: 5            # Penalize if fewer trades (reduced from 10)
  max_drawdown: 0.30       # Penalize if drawdown exceeds this (increased from 0.25)
  min_win_rate: 0.30       # Penalize if win rate below this (reduced from 0.35)
  complexity_weight: 0.01  # Penalty weight for strategy complexity (num_indicators + num_conditions)
  pair_loss_threshold: -10.0  # Max acceptable loss (%) on any single pair before penalty applies

# === Backtesting Configuration ===
backtesting:
  # Time range for backtesting (YYYYMMDD-YYYYMMDD)
  timerange: "20240620-20260218"  # Last 60 days
  
  # Stake amount per trade
  stake_amount: 0.2
  
  # Trading pairs to test strategies on (use test data pairs)
  pairs:
    - "ETH/BTC"
    - "LTC/BTC"
  
  # Maximum number of open trades
  max_open_trades: 4
  
  # Fee for trades (0.1%)
  fee: 0.002
  
  # Slippage percentage added on top of exchange fee for realistic cost modeling
  # Accounts for spread, market impact, and execution delays in live trading
  # 0.0005 = 0.05%, typical for liquid pairs; set higher for illiquid pairs
  slippage_pct: 0.0005
  
  # Exchange name (default: binance)
  exchange: "binance"
  
  # Auto-download missing data
  # When enabled, GA will automatically download missing data files
  # If disabled, you must manually download data before running
  auto_download_data: true
  
  # Enable caching of backtest results
  enable_cache: true
  
  # Timeout for single backtest (seconds)
  timeout: 300

# === Walk-Forward Optimization ===
# Walk-forward optimization prevents overfitting by training on one period
# and validating on a separate out-of-sample period. This is repeated across
# multiple windows to ensure strategy robustness.
walk_forward:
  # Enable walk-forward optimization
  enabled: false  # Set to true to use walk-forward validation
  
  # Training window size in days
  # Strategies are evolved using only this training data
  train_days: 60
  
  # Validation window size in days
  # Strategy performance is measured on this unseen data
  validation_days: 15
  
  # Step size in days - how far to slide the window forward
  # Smaller steps = more windows but slower evolution
  # Larger steps = fewer windows but less validation
  step_days: 15
  
  # Window mode:
  # - 'rolling': Fixed-size training window that slides forward
  # - 'anchored': Expanding training window that grows from start date
  mode: 'rolling'
  
  # Aggregation method for combining validation scores across windows:
  # - 'mean': Average performance (balanced)
  # - 'min': Worst-case performance (conservative)
  # - 'harmonic_mean': Penalizes inconsistency
  # - 'weighted': More weight to recent windows (requires weights config)
  aggregation: 'mean'
  
  # Embargo days - gap between training and validation windows to prevent
  # autocorrelated data leakage. Recommended 3-5 days for daily/hourly timeframes.
  embargo_days: 3
  
  # Train-validation gap penalty
  # Penalizes strategies that perform much better on training than validation (overfit)
  gap_penalty:
    enabled: true
    threshold: 0.1       # Gap above this triggers penalty (10% fitness difference)
    max_penalty: 0.5     # Maximum penalty factor (50% reduction)
  
  # Minimum trades required in training window to be valid
  # Windows with fewer trades are skipped
  min_train_trades: 10
  
  # Optional: Custom weights for 'weighted' aggregation
  # Must sum to 1.0, length must match number of windows
  # weights: [0.1, 0.2, 0.3, 0.4]  # Example: more weight to recent windows

# === Regime-Aware Evaluation ===
# Evaluates strategies across different market regimes (bullish, bearish, sideways)
# to prevent overfitting to a single market condition.
# 
# ⚠️ NOTE: Current regime detection methods are simple and may be noisy/inaccurate.
# See REGIME_DETECTION_IMPLEMENTATION.md for planned improvements.
regime_aware:

# === Out-of-Sample Holdout Validation ===
# After evolution completes, evaluates the top strategies on a completely unseen
# holdout period taken from the END of the timerange. This provides a true
# out-of-sample performance estimate and detects overfitting.
holdout_validation:
  # Enable holdout validation post-evolution
  enabled: true
  
  # Fraction of data to reserve as holdout (taken from the end of timerange)
  # The GA never sees this data during evolution
  holdout_pct: 0.15  # 15% of total timerange
  # Enable regime-aware evaluation
  # When enabled, strategies are evaluated across multiple market regime segments
  enabled: true  # Set to true to use regime-aware evaluation
  
  # Detection method: 'sma_adx', 'adx_di', 'returns', 'bollinger', 'ensemble'
  # 'sma_adx' is recommended - uses SMA crossover + ADX trend strength
  method: 'sma_adx'
  
  # Benchmark pair for regime detection (uses first pair if not specified)
  # For consistent regime labeling, use a major pair like BTC/USDT
  benchmark_pair: null  # null = use first pair from backtesting.pairs
  
  # Timeframe for regime detection (can differ from trading timeframe)
  # Higher timeframes (1h, 4h) give cleaner regimes than 5m
  detection_timeframe: '1h'
  
  # Segment duration parameters
  period_days: 90         # Target segment length in days
  min_period_days: 60     # Minimum acceptable segment length
  embargo_days: 5         # Gap between segments to prevent leakage
  
  # Number of segments to select per regime type (bullish, bearish, sideways)
  segments_per_regime: 3
  
  # Holdout split - fraction reserved for final out-of-sample validation
  # These segments are NEVER seen during GA evolution
  holdout_ratio: 0.20
  
  # Fitness aggregation method across segments:
  # - 'mean': Average performance (balanced)
  # - 'min': Worst-case performance (conservative, good for risk management)
  # - 'harmonic_mean': Penalizes inconsistency (recommended)
  # - 'cvar': Conditional Value at Risk (average of worst alpha% outcomes)
  aggregation: 'harmonic_mean'
  
  # CVaR alpha parameter (for 'cvar' aggregation only)
  # 0.2 = average of bottom 20% of segment fitness scores
  cvar_alpha: 0.20
  
  # Per-regime weights (optional, for 'mean' aggregation)
  # Can weight certain regimes more heavily in fitness calculation
  regime_weights:
    bullish: 1.0
    bearish: 1.0
    sideways: 1.0

# === Strategy Constraints ===
strategy_constraints:
  # Minimum number of trades for valid strategy
  min_trades: 10
  
  # Maximum allowed drawdown
  max_drawdown: 0.25
  
  # Minimum win rate
  min_win_rate: 0.30
  
  # Allowed timeframes
  timeframes: ["5m", "15m", "1h"]
  
  # Stop loss range
  stoploss_range: [-0.20, -0.05]
  
  # ROI range
  roi_range: [0.01, 0.10]
  
  # Max open trades range (per strategy)
  # Allows strategies to evolve their own trade capacity
  # Note: Still limited by global max_open_trades in backtesting config
  max_open_trades_range: [1, 10]

# === Multi-Timeframe Configuration ===
# Trade on base timeframe but use indicators from higher timeframes for:
# - Trend confirmation (e.g., only buy on 5m when 1h trend is bullish)
# - Market regime filtering (e.g., avoid trades during 4h consolidation)
# - Stronger signals (higher TF = less noise)
multi_timeframe:
  # Enable multi-timeframe strategy generation
  enabled: true  # Set to true to evolve multi-TF strategies
  
  # Higher timeframes available for informative indicators
  # Must be strictly higher than the base strategy timeframe
  available: ['15m', '1h', '4h']
  
  # Maximum number of informative timeframes per strategy
  max_timeframes: 2
  
  # Indicator types preferred on higher timeframes
  # Trend and volatility indicators tend to be more useful on higher TFs
  higher_timeframe_preference:
    - 'EMA'
    - 'SMA'
    - 'BBANDS'
    - 'ATR'
    - 'ADX'
    - 'RSI'

# === Indicator Configuration ===
indicators:
  # Available indicators for strategy generation
  # Only fully-supported indicators with complete codegen and condition support
  available:
    - "RSI"
    - "MACD"
    - "BBANDS"
    - "EMA"
    - "SMA"
    - "STOCH"
    - "ATR"
    - "ADX"
    - "CCI"
  
  # Maximum indicators per strategy
  max_per_strategy: 5
  
  # Minimum indicators per strategy
  min_per_strategy: 2
  
  # Indicator-specific parameter ranges
  RSI:
    period: [7, 21]
    buy_threshold: [20, 40]
    sell_threshold: [60, 80]
  
  MACD:
    fast_period: [8, 21]
    slow_period: [21, 50]
    signal_period: [5, 14]
  
  BBANDS:
    period: [15, 30]
    std_dev: [1.5, 3.0]
  
  EMA:
    period: [5, 50]
  
  SMA:
    period: [10, 100]
  
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [20, 40]
    d_threshold: [60, 80]
  
  ATR:
    period: [10, 20]
  
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  
  CCI:
    period: [10, 30]
    buy_threshold: [-200, -100]
    sell_threshold: [100, 200]

# === Storage Configuration ===
storage:
  # Database file for storing strategies and results
  database: "genetic_algorithm/data/strategies.db"
  
  # Directory for generated strategy files
  strategy_dir: "user_data/strategies/ga_generated"
  
  # Directory for checkpoints
  checkpoint_dir: "genetic_algorithm/data/checkpoints"
  
  # Save checkpoint every N generations
  checkpoint_interval: 5
  
  # Keep history of all generations
  keep_history: true

# === Logging Configuration ===
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR
  level: "INFO"
  
  # Log file location
  file: "genetic_algorithm/logs/ga.log"
  
  # Enable console output
  console: true
  
  # Log format
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# === Visualization Configuration ===
visualization:
  # Enable real-time plotting
  enabled: true
  
  # Update plot every N generations
  update_interval: 1
  
  # Plot types to generate
  plots:
    - "fitness_evolution"
    - "diversity"
    - "top_strategies"
  
  # Save plots to directory
  output_dir: "genetic_algorithm/plots"

# === Parallel Evaluation Configuration ===
# Enables multi-process parallel backtesting for significant speedup.
# Each worker process runs independent backtests simultaneously.
# 
# Benchmark results (8-core system, 50 strategies):
#   - Sequential: ~174 seconds
#   - Parallel (4 workers): ~49 seconds (3.5x speedup)
#   - Parallel (8 workers): ~37 seconds (4.7x speedup)
#
# Recommendation: Enable for populations > 20 strategies
parallel_evaluation:
  # Enable parallel evaluation
  enabled: true  # Set to true to enable parallel backtesting
  
  # Number of worker processes
  # - null: Auto-detect (CPU cores - 1)
  # - Integer: Fixed number of workers
  # Recommended: Leave as null for automatic optimization
  num_workers: null
  
  # Logging level for worker processes
  # Workers use WARNING level by default to reduce noise
  worker_log_level: 'WARNING'

# === Advanced Features (Optional) ===
advanced:
  # Enable dry-run testing for top strategies
  enable_dry_run: false
  
  # Dry-run duration (days)
  dry_run_duration: 7
  
  # Enable ML-based fitness prediction (FreqAI)
  enable_ml_fitness: false
  
  # Enable LLM-based strategy generation
  enable_llm: false
  
  # LLM API configuration
  llm:
    provider: "grok"  # grok, openai, local
    api_key: ""
    model: "grok-1"
  
  # Island model configuration
  island_model:
    enabled: false
    num_islands: 4
    migration_interval: 5  # generations between migrations
    migration_size: 5      # individuals to migrate

# =====================================================================
# TIER 3 — ADVANCED ROBUSTNESS & SIMPLIFICATION FEATURES
# =====================================================================

# === Monte-Carlo Robustness Analysis ===
# After evolution finishes, run Monte-Carlo permutations on top strategies
# to estimate how robust they are under random perturbations.
monte_carlo:
  enabled: true

  # Number of permutation runs (more = more accurate, slower)
  num_permutations: 30

  # Methods to use (any combination):
  #   bootstrap       — sample trades with replacement
  #   shuffle         — randomise trade order (affects compounding)
  #   slippage_jitter — add random slippage noise
  methods:
    - bootstrap
    - shuffle
    - slippage_jitter

  # Std dev of slippage noise per trade (e.g. 0.0005 = 0.05%)
  slippage_std: 0.0005

  # Fraction of trades to sample per bootstrap iteration
  sample_fraction: 1.0

  # Optional seed for reproducibility (null = random)
  random_seed: null

# === Parsimony Pressure (Strategy Simplification) ===
# After creating next-gen elites, attempt to remove indicators/conditions
# one at a time. If the fitness drop is within epsilon, keep the simpler
# version. This reduces overfitting and creates more interpretable rules.
parsimony:
  enabled: true

  # Max allowed relative fitness drop (0.02 = 2%)
  epsilon: 0.02

  # Max components to try removing per elite per generation
  max_removals: 1

# === Pareto Archive (NSGA-II mode only) ===
# Maintains an external set of historically non-dominated solutions.
# Uses crowding-distance decay to prune toward the "knee" of the front.
pareto_archive:
  enabled: false

  # Maximum archive size
  max_size: 100

  # Crowding-distance decay rate per generation (< 1.0)
  # Lower values make long-lived members easier to prune.
  decay_rate: 0.95

# === Dynamic Indicator Parameter Ranges ===
# Allow parameter bounds (min, max) to be evolved alongside values.
# Enables the GA to tighten or widen search spaces per indicator.
dynamic_bounds:
  enabled: true

  # Mutation strength when perturbing bounds (0.0–1.0)
  mutation_strength: 0.1
