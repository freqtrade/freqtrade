# Default GA Configuration
# 
# ⚠️  WARNING: This config uses test data (UNITTEST/BTC from 2018)
# 
# For real strategy development:
# 1. Copy ga_config_example.yaml to create your own config
# 2. Download real data: freqtrade download-data --pairs BTC/USDT --timeframes 1h --days 90
# 3. Update pairs and timerange in your config
# 4. Run: python genetic_algorithm/run_ga.py --config your_config.yaml
# 
# Or use the quick test: python genetic_algorithm/run_ga.py --config genetic_algorithm/config/ga_config_test.yaml

# Genetic Algorithm Configuration for FreqTrade Strategy Evolution

# === Genetic Algorithm Parameters ===
genetic_algorithm:
  # Random seed for reproducibility (set to null for random behavior)
  random_seed: null  # Set to an integer (e.g., 42) for reproducible experiments
  
  # Population size - number of strategies per generation
  # Quick test: 20-25, Validation: 30, Production: 100-200
  population_size: 30
  
  # Number of generations to evolve
  # Quick test: 5-8, Validation: 12, Production: 50-100
  generations: 12
  
  # Mutation rate - probability of mutating an individual
  # Higher = more exploration, Lower = more exploitation
  mutation_rate: 0.20
  
  # Crossover rate - probability of crossing over two parents
  crossover_rate: 0.75
  
  # Crossover method: 'single_point', 'uniform', 'component'
  # - single_point: splits indicator/condition lists at random point, swaps tails
  # - uniform: each component independently inherited from either parent (recommended)
  # - component: swaps entire blocks (indicators, entry conditions, exit conditions, risk params)
  crossover_method: 'uniform'
  
  # Elite size - number of top strategies to preserve unchanged (~13% of population)
  elite_size: 4
  
  # Tournament size for tournament selection (3-5 recommended for good selection pressure)
  tournament_size: 3

  # Selection method: 'tournament', 'roulette', 'rank'
  selection_method: 'tournament'
  
  # Convergence threshold - stop if no improvement after N generations
  convergence_patience: 8
  
  # Adaptive mutation - increase mutation rate when stuck
  adaptive_mutation: true
  
  # Adaptive mutation parameters
  max_adaptation_factor: 2.5   # Maximum multiplier for mutation rate
  adaptation_step: 0.15         # Increase factor per generation with no improvement
  
  # Diversity preservation
  fitness_sharing: true         # Enable fitness sharing for diversity
  sharing_radius: 0.25          # How similar strategies must be to share fitness (0-1)
  diversity_threshold: 0.15     # Minimum genetic diversity to maintain
  allow_self_crossover: false   # Allow same parent to be selected twice (set false for more diversity)
  
  # Random immigrants - inject fresh random strategies each generation to prevent premature convergence
  # When diversity drops below diversity_threshold, this count is doubled for that generation
  random_immigrants: 5            # Number of fresh random individuals to inject per generation
  
  # Evolution mode: 'single_objective' (default) or 'nsga2' (multi-objective)
  # Single-objective uses weighted fitness function, NSGA-II returns Pareto front
  mode: 'single_objective'

# === NSGA-II Multi-Objective Configuration ===
# Only used when genetic_algorithm.mode = 'nsga2'
nsga2:
  # Objectives to optimize (all converted to maximization internally)
  # Each objective has: name (metric key), type (maximize/minimize/goldilocks)
  objectives:
    - name: 'profit'          # Total profit percentage
      type: 'maximize'
      scale: 100.0            # Normalize to ~0-1 range
    - name: 'max_drawdown'    # Maximum drawdown (risk)
      type: 'minimize'        # Converted to -drawdown for maximization
      scale: 1.0
    - name: 'sharpe_ratio'    # Risk-adjusted return
      type: 'maximize'
      scale: 3.0              # Normalize to ~0-1 range
  
  # Number of Pareto-optimal strategies to return
  pareto_front_size: 20
  
  # Crowding distance percentile for diversity (not currently used, for future)
  crowding_distance_percentile: 0.1

# === Fitness Function Weights ===
# These weights determine how different metrics contribute to overall fitness
# All weights should sum to 1.0
# Balanced between profitability and risk management
fitness_weights:
  profit: 0.28            # Total profit/return (increased for stronger signal)
  sharpe_ratio: 0.18      # Risk-adjusted returns (volatility)
  sortino_ratio: 0.13     # Downside risk-adjusted returns
  profit_factor: 0.08     # Win/loss ratio
  drawdown: 0.15          # Maximum drawdown (penalty, increased)
  win_rate: 0.05          # Percentage of winning trades
  trade_frequency: 0.05   # Number of trades (too few or too many is bad)
  monthly_stability: 0.04 # Consistency of monthly returns (lower std = better)
  cross_pair: 0.04        # Cross-pair consistency (penalizes pair-dependent strategies)

# Fitness penalties
fitness_penalties:
  min_trades: 12           # Penalize if fewer trades (increased from 8)
  max_drawdown: 0.25       # Penalize if drawdown exceeds this
  min_win_rate: 0.35       # Penalize if win rate below this
  complexity_weight: 0.015 # Penalty weight for strategy complexity (num_indicators + num_conditions)
  unused_indicator_weight: 0.02  # Penalty for indicators not referenced by any entry/exit condition
  pair_loss_threshold: -8.0  # Max acceptable loss (%) on any single pair before penalty applies

# Fitness bounds for clamping extreme values
# Values outside these bounds are clamped to prevent extreme outliers from skewing fitness
fitness_bounds:
  profit_min: -50          # Minimum profit % to consider (-50% floor)
  profit_max: 200          # Maximum profit % to consider (200% ceiling)
  sharpe_min: -5           # Minimum Sharpe ratio
  sharpe_max: 10           # Maximum Sharpe ratio
  sortino_min: -5          # Minimum Sortino ratio
  sortino_max: 12          # Maximum Sortino ratio (typically higher than Sharpe)
  profit_factor_max: 10    # Maximum profit factor

# Trade frequency thresholds for normalization
trade_frequency_thresholds:
  very_few: 5              # Trades below this are heavily penalized
  few: 10                  # Trades below this get some penalty
  ideal_min: 10            # Lower bound of ideal range
  ideal_max: 50            # Upper bound of ideal range
  moderate_excess: 100     # Slight penalty above ideal_max up to this
  # Above moderate_excess: significant penalty

# === Backtesting Configuration ===
backtesting:
  # Time range for backtesting (YYYYMMDD-YYYYMMDD)
  # Quick test: 30-60 days, Production: 90-180 days
  timerange: "20240301-20260228"  # 2 years for validation run
  
  # Stake amount per trade
  # Values 0-1: treated as fraction of wallet (e.g., 0.15 = 15% of wallet per trade)
  # Values >= 1: treated as fixed amount in stake currency (e.g., 1500 = $1500 per trade)
  stake_amount: 0.15
  
  # Trading pairs to test strategies on
  # Quick test: 2-3 pairs, Production: 5-10 diverse pairs
  # Using 2 pairs for validation run (30-60 min); use 5+ for production
  pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
  
  # Maximum number of open trades
  max_open_trades: 3
  
  # Fee for trades (0.1% = 0.001)
  # Realistic fee: 0.1% maker/taker on most exchanges
  fee: 0.001
  
  # Slippage percentage added on top of exchange fee for realistic cost modeling
  # 0.05% slippage is conservative for major pairs on Binance
  slippage_pct: 0.0005
  
  # Exchange name (default: binance)
  exchange: "binance"
  
  # Auto-download missing data
  auto_download_data: true
  
  # Enable caching of backtest results (saves time on repeated evaluations)
  enable_cache: true
  
  # Timeout for single backtest (seconds) - quick test uses lower timeout
  timeout: 120

# === Walk-Forward Optimization ===
# Walk-forward optimization prevents overfitting by training on one period
# and validating on a separate out-of-sample period.
# NOTE: Disable for quick tests, enable for production runs
walk_forward:
  # Enable walk-forward optimization
  # ENABLED BY DEFAULT - critical for preventing overfitting
  enabled: true
  
  # Training window size in days
  # Strategies are evolved using only this training data
  train_days: 120
  
  # Validation window size in days
  # Strategy performance is measured on this unseen data
  validation_days: 30
  
  # Step size in days - how far to slide the window forward
  # Smaller steps = more windows but slower evolution
  # Larger steps = fewer windows but less validation
  step_days: 30
  
  # Window mode:
  # - 'rolling': Fixed-size training window that slides forward
  # - 'anchored': Expanding training window that grows from start date
  mode: 'rolling'
  
  # Aggregation method for combining validation scores across windows:
  # - 'mean': Average performance (balanced)
  # - 'min': Worst-case performance (conservative)
  # - 'harmonic_mean': Penalizes inconsistency
  # - 'weighted': More weight to recent windows (requires weights config)
  aggregation: 'mean'
  
  # Embargo days - gap between training and validation windows to prevent
  # autocorrelated data leakage. Recommended 3-5 days for daily/hourly timeframes.
  embargo_days: 5
  
  # Train-validation gap penalty
  # Penalizes strategies that perform much better on training than validation (overfit)
  gap_penalty:
    enabled: true
    threshold: 0.1       # Gap above this triggers penalty (10% fitness difference)
    max_penalty: 0.5     # Maximum penalty factor (50% reduction)
  
  # Minimum trades required in training window to be valid
  # Windows with fewer trades are skipped
  min_train_trades: 10
  
  # Maximum number of walk-forward windows to create.
  # Caps window count for long timeranges to keep evaluation fast.
  # Set to null/omit for no cap.
  max_windows: 10
  
  # Optional: Custom weights for 'weighted' aggregation
  # Must sum to 1.0, length must match number of windows
  # weights: [0.1, 0.2, 0.3, 0.4]  # Example: more weight to recent windows

# === Out-of-Sample Holdout Validation ===
# After evolution completes, evaluates the top strategies on a completely unseen
# holdout period taken from the END of the timerange.
# NOTE: Disable for quick tests to save time
holdout_validation:
  # Enable holdout validation post-evolution
  # ENABLED BY DEFAULT - validates strategies on completely unseen data
  enabled: true
  
  # Fraction of data to reserve as holdout (taken from the end of timerange)
  holdout_pct: 0.15  # 15% of total timerange

# === Holdout Monitoring (During Evolution) ===
# Tracks holdout degradation per generation and optionally penalizes fitness
# of strategies that show high training→holdout degradation.
holdout_monitoring:
  enabled: true
  interval: 2          # Check every N generations
  top_n: 5             # Number of top strategies to evaluate on holdout
  early_stop: true     # Stop evolution if holdout degradation is consistently high
  early_stop_threshold: 0.60  # Degradation threshold for early stopping
  early_stop_checks: 3        # Consecutive checks above threshold to trigger
  # Trend-based early stopping: stops if degradation worsens for N consecutive checks
  trend_early_stop: true
  trend_checks: 3             # Consecutive worsening checks to trigger
  # Fitness penalty: reduce fitness of strategies with high holdout degradation
  # NOTE: penalty now applies to BOTH raw_fitness and fitness, affecting elite selection
  fitness_penalty: true
  penalty_factor: 0.8  # How aggressively to penalize (0.0-1.0; was 0.5, increased for stronger pressure)

# === Regime-Aware Evaluation ===
# Evaluates strategies across different market regimes (bullish, bearish, sideways)
# NOTE: Disable for quick tests, enable for production
regime_aware:
  # Enable regime-aware evaluation
  enabled: true  # Set to true for production runs
  
  # Detection method: 'adx_di_hysteresis', 'adx_di', 'sma_adx', 'returns', 'bollinger', 'ensemble'
  # 'adx_di_hysteresis' is best performer — avoids sideways-only misclassification on 1h
  method: 'adx_di_hysteresis'
  
  # Benchmark pair for regime detection (uses first pair if not specified)
  # For consistent regime labeling, use a major pair like BTC/USDT
  benchmark_pair: null  # null = use first pair from backtesting.pairs
  
  # Timeframe for regime detection (can differ from trading timeframe)
  # Higher timeframes (4h) give cleaner regimes than 1h
  detection_timeframe: '4h'
  
  # Segment duration parameters
  period_days: 90         # Target segment length in days
  min_period_days: 60     # Minimum acceptable segment length
  embargo_days: 5         # Gap between segments to prevent leakage
  
  # Number of segments to select per regime type (bullish, bearish, sideways)
  segments_per_regime: 3
  
  # Holdout split - fraction reserved for final out-of-sample validation
  # These segments are NEVER seen during GA evolution
  holdout_ratio: 0.20
  
  # Fitness aggregation method across segments:
  # - 'mean': Average performance (balanced)
  # - 'min': Worst-case performance (conservative, good for risk management)
  # - 'harmonic_mean': Penalizes inconsistency (recommended)
  # - 'cvar': Conditional Value at Risk (average of worst alpha% outcomes)
  aggregation: 'harmonic_mean'
  
  # CVaR alpha parameter (for 'cvar' aggregation only)
  # 0.2 = average of bottom 20% of segment fitness scores
  cvar_alpha: 0.20
  
  # Per-regime weights (optional, for 'mean' aggregation)
  # Can weight certain regimes more heavily in fitness calculation
  regime_weights:
    bullish: 1.0
    bearish: 1.0
    sideways: 1.0

# === Strategy Constraints ===
strategy_constraints:
  # Minimum number of trades for valid strategy
  min_trades: 15
  
  # Maximum allowed drawdown
  max_drawdown: 0.20
  
  # Minimum win rate
  min_win_rate: 0.35
  
  # Allowed timeframes (focus on intraday for faster backtests)
  timeframes: ["15m", "1h"]
  
  # Stop loss range (tighter for better risk management)
  stoploss_range: [-0.10, -0.04]
  
  # ROI range
  roi_range: [0.02, 0.08]
  
  # Max open trades range (per strategy)
  max_open_trades_range: [2, 5]
  
  # Minimum exit conditions per strategy (prevents exit-less strategies)
  min_exit_conditions: 1

# === Short Selling Configuration ===
# Enable strategies to open short positions (enter_short/exit_short)
# NOTE: Requires exchange support for margin/futures trading
short_selling:
  enabled: false  # Set to true for futures/margin exchanges
  probability: 0.5  # Probability a new strategy gets can_short=True

# === Holdout Test Configuration ===
# Run best strategies on out-of-sample data after evolution completes
# to detect overfitting. The holdout timerange should NOT overlap with
# the training timerange used for backtesting.
holdout_test:
  enabled: false
  timerange: ""  # e.g., "20250301-20250401" - must be outside training range
  top_n: 5  # Number of top strategies to test on holdout data

# === Multi-Timeframe Configuration ===
# Trade on base timeframe but use indicators from higher timeframes
# NOTE: Disable for quick tests, enable for production
multi_timeframe:
  # Enable multi-timeframe strategy generation
  enabled: false  # Set to true for production (adds complexity)
  
  # Higher timeframes available for informative indicators
  # Must be strictly higher than the base strategy timeframe
  available: ['15m', '1h', '4h']
  
  # Maximum number of informative timeframes per strategy
  max_timeframes: 2
  
  # Indicator types preferred on higher timeframes
  # Trend and volatility indicators tend to be more useful on higher TFs
  higher_timeframe_preference:
    - 'EMA'
    - 'SMA'
    - 'BBANDS'
    - 'ATR'
    - 'ADX'
    - 'RSI'

# === Indicator Configuration ===
indicators:
  # Available indicators for strategy generation
  # Curated list balancing variety and quality
  # Quick test: Use fewer indicators, Production: Use full list
  available:
    # Classic momentum/trend indicators
    - "RSI"
    - "MACD"
    - "BBANDS"
    - "EMA"
    - "SMA"
    - "ADX"
    # New trend indicators (high-quality signals)
    - "SUPERTREND"
    - "PSAR"
    # Volume-based indicators
    - "CMF"
    # Best candlestick patterns (most reliable, reduced set)
    - "CDL_ENGULFING"
    - "CDL_HAMMER"
    - "CDL_DOJI"
  
  # Maximum indicators per strategy (lower = faster, simpler strategies)
  max_per_strategy: 4
  
  # Minimum indicators per strategy
  min_per_strategy: 2
  
  # Indicator-specific parameter ranges
  RSI:
    period: [7, 21]
    buy_threshold: [20, 40]
    sell_threshold: [60, 80]
  
  MACD:
    fast_period: [8, 21]
    slow_period: [21, 50]
    signal_period: [5, 14]
  
  BBANDS:
    period: [15, 30]
    std_dev: [1.5, 3.0]
  
  EMA:
    period: [5, 50]
  
  SMA:
    period: [10, 100]
  
  STOCH:
    k_period: [5, 21]
    d_period: [3, 14]
    k_threshold: [20, 40]
    d_threshold: [60, 80]
  
  ATR:
    period: [10, 20]
  
  ADX:
    period: [10, 20]
    threshold: [20, 40]
  
  CCI:
    period: [10, 30]
    buy_threshold: [-200, -100]
    sell_threshold: [100, 200]
  
  # New indicator parameter ranges
  SUPERTREND:
    period: [7, 14]
    multiplier: [2.0, 4.0]
  
  ICHIMOKU:
    tenkan_period: [7, 12]
    kijun_period: [20, 30]
    senkou_b_period: [40, 60]
  
  DONCHIAN:
    period: [10, 30]
  
  VWAP:
    # No parameters needed
  
  PSAR:
    acceleration: [0.01, 0.05]
    maximum: [0.1, 0.3]
  
  CMF:
    period: [10, 25]
    buy_threshold: [0.05, 0.2]
    sell_threshold: [-0.2, -0.05]
  
  VROC:
    period: [5, 20]
    threshold: [50, 200]
  
  # Candlestick pattern configurations
  # Most patterns have no parameters (they analyze raw OHLC data)
  CDL_ENGULFING:
    # No parameters
  
  CDL_HAMMER:
    # No parameters
  
  CDL_DOJI:
    # No parameters
  
  CDL_MORNINGSTAR:
    penetration: [0.0, 0.3]  # Penetration percentage for pattern detection
  
  CDL_EVENINGSTAR:
    penetration: [0.0, 0.3]
  
  CDL_SHOOTINGSTAR:
    # No parameters
  
  CDL_HARAMI:
    # No parameters
  
  CDL_PIERCING:
    # No parameters
  
  CDL_DARKCLOUD:
    # No parameters
  
  CDL_3WHITESOLDIERS:
    # No parameters
  
  CDL_3BLACKCROWS:
    # No parameters

# === Storage Configuration ===
storage:
  # Database file for storing strategies and results
  database: "genetic_algorithm/data/strategies.db"
  
  # Directory for generated strategy files
  strategy_dir: "user_data/strategies/ga_generated"
  
  # Directory for checkpoints
  checkpoint_dir: "genetic_algorithm/data/checkpoints"
  
  # Save checkpoint every N generations
  checkpoint_interval: 5
  
  # Keep history of all generations
  keep_history: true

# === Hall of Fame Configuration ===
hall_of_fame:
  # Directory for hall of fame archive
  directory: "genetic_algorithm/data/hall_of_fame"
  
  # Maximum strategies to archive
  max_size: 50
  
  # Minimum fitness to qualify
  min_fitness: 0.0
  
  # Number of hall-of-fame strategies to inject into new runs
  inject_count: 3

# === Logging Configuration ===
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR
  level: "INFO"
  
  # Log file location
  file: "genetic_algorithm/logs/ga.log"
  
  # Enable console output
  console: true
  
  # Log format
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# === Terminal Monitor Configuration ===
# Live-updating terminal dashboard that replaces scrolling log output.
# Requires: pip install rich  (optional — falls back to normal logging if missing)
terminal_monitor:
  # Enable the live terminal dashboard (set false to keep classic log output)
  enabled: true

  # Default view mode: "simple" | "detailed" | "logs"
  #   simple   — compact overview: fitness, profit, diversity, trends
  #   detailed — phase timing, population composition, convergence info
  #   logs     — live scrolling log output with pinned header
  # Switch at runtime with keyboard: S / D / L
  default_mode: "simple"

  # Show keybinding hints in the footer
  show_keybindings: true

  # Number of past generations to keep for trend sparklines
  history_window: 20

  # Live display refresh rate (times per second)
  refresh_rate: 4

# === Visualization Configuration ===
visualization:
  # Enable real-time plotting
  enabled: true
  
  # Update plot every N generations
  update_interval: 1
  
  # Plot types to generate
  plots:
    - "fitness_evolution"
    - "diversity"
    - "top_strategies"
  
  # Save plots to directory
  output_dir: "genetic_algorithm/output/validation_run/plots"

# === Parallel Evaluation Configuration ===
# Enables multi-process parallel backtesting for significant speedup.
# CRITICAL for quick tests - provides 3-5x speedup
parallel_evaluation:
  # Enable parallel evaluation (HIGHLY RECOMMENDED)
  enabled: true
  
  # Number of worker processes
  # - null: Auto-detect (CPU cores - 1)
  # - Integer: Fixed number of workers
  num_workers: null
  
  # Logging level for worker processes
  worker_log_level: 'WARNING'

# === Advanced Features (Optional) ===
advanced:
  # Enable dry-run testing for top strategies
  enable_dry_run: false
  
  # Dry-run duration (days)
  dry_run_duration: 7
  
  # Enable ML-based fitness prediction (FreqAI)
  enable_ml_fitness: false
  
  # LLM-Based Strategy Designer
  # Generates seed strategies and immigrants using an LLM for smarter
  # initial population and guided diversity injection during evolution.
  # Set api_key here or via env var GROK_API_KEY / OPENAI_API_KEY.
  llm:
    enabled: false  # Set to true and provide api_key to activate
    provider: "grok"  # grok | openai | anthropic | local
    api_key: ""  # Set via env var GROK_API_KEY or paste here
    model: ""  # Leave empty for provider default (grok-3-mini, gpt-4o-mini, etc.)
    base_url: ""  # Leave empty for provider default; set for custom endpoints
    temperature: 0.7  # Higher = more creative strategies
    max_tokens: 4096
    timeout: 60  # Seconds per API call
    max_retries: 3
    retry_delay: 2.0
    min_call_interval: 1.0  # Rate limiting: min seconds between calls
    # Ratio config
    seed_ratio: 0.40  # 40% of initial population from LLM
    immigrant_ratio: 0.50  # 50% of each generation's immigrants from LLM
  
  # Island model configuration
  island_model:
    enabled: false
    num_islands: 4
    migration_interval: 5  # generations between migrations
    migration_size: 5      # individuals to migrate

# =====================================================================
# TIER 3 — ADVANCED ROBUSTNESS & SIMPLIFICATION FEATURES
# =====================================================================

# === Monte-Carlo Robustness Analysis ===
# After evolution finishes, run Monte-Carlo permutations on top strategies
# to estimate how robust they are under random perturbations.
# NOTE: Disable for quick tests, enable for production runs
monte_carlo:
  enabled: true  # Enabled for validation run

  # Number of permutation runs (more = more accurate, slower)
  num_permutations: 20

  # Methods to use (any combination):
  #   bootstrap       — sample trades with replacement
  #   shuffle         — randomise trade order (affects compounding)
  #   slippage_jitter — add random slippage noise
  methods:
    - bootstrap
    - shuffle
    - slippage_jitter

  # Std dev of slippage noise per trade (e.g. 0.0005 = 0.05%)
  slippage_std: 0.0005

  # Fraction of trades to sample per bootstrap iteration
  sample_fraction: 1.0

  # Optional seed for reproducibility (null = random)
  random_seed: null

# === Parsimony Pressure (Strategy Simplification) ===
# After creating next-gen elites, attempt to remove indicators/conditions
# one at a time. If the fitness drop is within epsilon, keep the simpler
# version. This reduces overfitting and creates more interpretable rules.
parsimony:
  enabled: true

  # Max allowed relative fitness drop (0.02 = 2%)
  epsilon: 0.02

  # Max components to try removing per elite per generation
  max_removals: 1

# === Pareto Archive (NSGA-II mode only) ===
# Maintains an external set of historically non-dominated solutions.
# Uses crowding-distance decay to prune toward the "knee" of the front.
pareto_archive:
  enabled: false

  # Maximum archive size
  max_size: 100

  # Crowding-distance decay rate per generation (< 1.0)
  # Lower values make long-lived members easier to prune.
  decay_rate: 0.95

# === Dynamic Indicator Parameter Ranges ===
# Allow parameter bounds (min, max) to be evolved alongside values.
# Enables the GA to tighten or widen search spaces per indicator.
dynamic_bounds:
  enabled: true

  # Mutation strength when perturbing bounds (0.0–1.0)
  mutation_strength: 0.1

# === Overfit Analysis Thresholds ===
# Configurable thresholds for the composite overfitting scoring.
# Composite score combines holdout degradation, walk-forward gap, and MC robustness.
overfit_analysis:
  thresholds:
    holdout_degradation_warning: 0.25
    holdout_degradation_overfit: 0.50
    wf_gap_warning: 0.15
    wf_gap_overfit: 0.30
    mc_robustness_warning: 0.70
    mc_robustness_overfit: 0.50
    composite_warning: 0.25  # Tightened from 0.35
    composite_overfit: 0.50  # Tightened from 0.60
