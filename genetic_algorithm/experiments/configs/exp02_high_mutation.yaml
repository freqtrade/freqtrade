# Experiment 02: High Mutation Rate
# Purpose: Test if higher mutation helps escape local optima
# Key change: mutation_rate 0.30 (vs 0.15 baseline)
# Hypothesis: May find better solutions but less stable convergence

genetic_algorithm:
  random_seed: 42
  population_size: 20
  generations: 8
  mutation_rate: 0.30  # CHANGED: 2x baseline
  crossover_rate: 0.7
  elite_size: 3
  tournament_size: 3
  selection_method: 'tournament'
  convergence_patience: 10
  adaptive_mutation: false  # CHANGED: Disabled since already high
  max_adaptation_factor: 2.0
  adaptation_step: 0.1
  fitness_sharing: true
  sharing_radius: 0.3
  diversity_threshold: 0.15
  allow_self_crossover: false
  random_immigrants: 2
  mode: 'single_objective'

fitness_weights:
  profit: 0.30
  sharpe_ratio: 0.15
  sortino_ratio: 0.10
  profit_factor: 0.10
  drawdown: 0.15
  win_rate: 0.10
  trade_frequency: 0.10

fitness_penalties:
  min_trades: 5
  max_drawdown: 0.30
  min_win_rate: 0.30
  complexity_weight: 0.01

backtesting:
  timerange: "20240620-20260218"
  stake_amount: 0.2
  pairs:
    - "ETH/BTC"
    - "LTC/BTC"
  max_open_trades: 4
  fee: 0.002
  exchange: "binance"
  auto_download_data: true
  enable_cache: true
  timeout: 300

walk_forward:
  enabled: false

regime_aware:
  enabled: true
  method: 'sma_adx'
  benchmark_pair: null
  detection_timeframe: '1h'
  period_days: 60
  min_period_days: 30
  embargo_days: 3
  segments_per_regime: 2
  holdout_ratio: 0.15
  aggregation: 'harmonic_mean'
  cvar_alpha: 0.20
  regime_weights:
    bullish: 1.0
    bearish: 1.0
    sideways: 1.0

strategy_constraints:
  min_trades: 5
  max_drawdown: 0.30
  min_win_rate: 0.25
  timeframes: ["5m", "15m", "1h"]
  stoploss_range: [-0.20, -0.05]
  roi_range: [0.01, 0.10]
  max_open_trades_range: [1, 6]

multi_timeframe:
  enabled: true
  available: ['15m', '1h']
  max_timeframes: 1
  higher_timeframe_preference:
    - 'EMA'
    - 'SMA'
    - 'RSI'
    - 'ADX'

indicators:
  available:
    - "RSI"
    - "MACD"
    - "BBANDS"
    - "EMA"
    - "SMA"
    - "STOCH"
    - "ATR"
    - "ADX"
    - "CCI"
  max_per_strategy: 4

parallel_evaluation:
  enabled: true
  num_workers: null
  worker_log_level: 'WARNING'

progress:
  enabled: true
  show_fitness: true
  show_profit: true
  update_every: 1
